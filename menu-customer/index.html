<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#3E2C22" />
<title>와글링 테이블 · 손님용 — 큰 글씨 메뉴판</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="와글링 테이블" />
<style>
/* ══════════════════════════════════════════════════════════════
   와글링 테이블 · 손님용 — 큰 글씨 메뉴판 (고객 앱)
   ══════════════════════════════════════════════════════════════ */
:root{
  --cream:#FFF7E9; --cream2:#FDF0D9; --card:#FFFFFF; --ink:#2A211B; --ink2:#5A4A3F; --ink3:#8B7A6B;
  --coffee:#3E2C22; --accent:#C0562B; --accent2:#A3431F; --gold:#D9A227; --line:#EADFCB;
  --green:#2E7D5B; --shadow:0 2px 10px rgba(58,40,25,.10);
  --hot:#C0562B; --hotbg:#FFF0DF; --ice:#2E7FA6; --icebg:#E8F6FC; --food:#8A6A22; --foodbg:#FBF1D8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;background:var(--cream)}
html.big{font-size:23px}
body{margin:0;background:var(--cream);color:var(--ink);line-height:1.35;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  padding-bottom:8.4rem;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 머리말 ─────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--coffee);color:#FFF7E9;
  padding:.5rem .7rem .6rem;box-shadow:0 3px 12px rgba(40,26,16,.22)}
.brand{display:flex;align-items:center;gap:.5rem;min-width:0}
.logo{flex:0 0 auto;width:2.3rem;height:2.3rem;border-radius:.85rem;background:#FFF3DF;
  display:grid;place-items:center;font-size:1.3rem;line-height:1;box-shadow:inset 0 0 0 2px #E9CFA4}
.ttl{flex:1 1 auto;min-width:0}
.ttl h1{margin:0;font-size:1.42rem;font-weight:900;letter-spacing:-.035em;line-height:1.16;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:.05rem 0 0;font-size:.72rem;font-weight:700;color:#E8D5BC;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{flex:0 0 auto;font-size:.66rem;font-weight:900;color:#3E2C22;background:#F3D391;
  border-radius:2rem;padding:.14rem .45rem;letter-spacing:-.01em}

/* 조작 알약 3개 — 언어 · 큰 글씨 · 소리 */
.ctrl{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:.34rem;margin-top:.5rem}
.pill{display:flex;align-items:center;justify-content:center;gap:.28rem;min-height:2.5rem;
  border-radius:2rem;background:rgba(255,247,233,.13);border:2px solid rgba(255,247,233,.42);
  color:#FFF7E9;font-size:.86rem;font-weight:900;letter-spacing:-.02em;white-space:nowrap;
  padding:0 .4rem;transition:background .15s,border-color .15s}
.pill:active{transform:translateY(1px)}
.pill[aria-pressed="true"]{background:#F3D391;border-color:#F3D391;color:#3A2A1B}
.pill .sw{width:1.55rem;height:.92rem;border-radius:1rem;background:rgba(255,247,233,.3);position:relative;flex:0 0 auto}
.pill .sw::after{content:"";position:absolute;top:.1rem;left:.1rem;width:.72rem;height:.72rem;border-radius:50%;background:#FFF7E9;transition:.15s}
.pill[aria-pressed="true"] .sw{background:#8A6A2E}
.pill[aria-pressed="true"] .sw::after{left:.73rem;background:#FFFDF4}
.pill .ic{font-size:1.02rem;line-height:1}

/* 큰 글씨 모드 머리말은 조금 더 아낀다 (메뉴가 더 보이게) */
html.big .ttl h1{font-size:1.18rem}
html.big .ttl p{display:none}
html.big .logo{width:2rem;height:2rem;font-size:1.1rem}
html.big .top{padding-top:.42rem;padding-bottom:.5rem}
html.big .ctrl{margin-top:.38rem}

/* 날짜·요일·날씨 */
.datebar{display:flex;align-items:center;gap:.3rem;margin-top:.45rem;padding:.34rem .55rem;
  background:#FFFDF6;border-radius:.8rem;color:#4A362B;text-align:left;width:100%;
  font-size:.78rem;box-shadow:inset 0 0 0 1.5px #E7D8BF}
.datebar .db-date{font-weight:900;flex:0 0 auto;letter-spacing:-.02em}
.datebar .db-sep{color:#D8C6B4;flex:0 0 auto}
.datebar .db-wx{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.datebar .db-wx.loading{color:#A9977F}
.datebar .db-place{flex:0 0 auto;color:#A08C79;font-size:.7rem;font-weight:800}
.datebar .db-go{flex:0 0 auto;color:#B9A491;font-size:.72rem}

/* ── 분류 탭 ───────────────────────────────────────── */
.cats{display:flex;flex-wrap:wrap;gap:.28rem;padding:.55rem .7rem .3rem;
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--cream) 76%,rgba(255,247,233,0))}
.cat{flex:0 0 auto;min-height:2.4rem;padding:0 .52rem;border-radius:2rem;background:#fff;
  border:2px solid var(--line);color:var(--ink2);font-size:.82rem;font-weight:900;letter-spacing:-.035em;
  display:flex;align-items:center;gap:.16rem;box-shadow:var(--shadow)}
.cat[aria-pressed="true"]{background:var(--coffee);border-color:var(--coffee);color:#FFF7E9}
.cat:active{transform:translateY(1px)}

/* ── 메뉴판 ─────────────────────────────────────────── */
main{padding:0 .7rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.28rem}
html.big .grid{grid-template-columns:1fr;gap:.5rem}
html.big .cats{display:grid;grid-template-columns:1fr 1fr;overflow:visible;gap:.4rem;padding-top:.5rem}
html.big .cat{justify-content:center;font-size:.9rem;min-height:2.5rem;letter-spacing:-.03em}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:1.05rem;padding:.42rem .42rem .48rem;
  box-shadow:var(--shadow);min-width:0;transition:transform .1s,box-shadow .15s}
.card:active{transform:scale(.985)}
.card .pic{display:block;border-radius:.75rem;background:var(--hotbg);padding:.1rem .25rem;line-height:0}
.card.t-ice .pic{background:var(--icebg)}
.card.t-food .pic{background:var(--foodbg)}
.card .pic svg{width:100%;height:auto;display:block}
.card .txt{display:block;min-width:0}
.card .emo{display:grid;place-items:center;font-size:2.9rem;height:5.05rem;line-height:1}
.card .nm{display:block;margin-top:.3rem;font-size:1.02rem;font-weight:900;letter-spacing:-.03em;
  line-height:1.24;word-break:keep-all;color:var(--ink)}
.card .pr{display:block;margin-top:.12rem;font-size:.98rem;font-weight:900;color:var(--accent2);letter-spacing:-.02em}
.card .hit{position:absolute;top:.44rem;right:.44rem;background:var(--accent);color:#fff;border-radius:2rem;
  min-width:1.55rem;height:1.55rem;padding:0 .3rem;display:grid;place-items:center;font-size:.86rem;font-weight:900;
  box-shadow:0 2px 6px rgba(0,0,0,.22)}
.card.sold{opacity:.62}
.card.sold .pic{filter:grayscale(.7)}
.card .soldtag{position:absolute;top:.5rem;left:.5rem;background:#4A4038;color:#fff;border-radius:.5rem;
  padding:.1rem .38rem;font-size:.72rem;font-weight:900}
.card .step{margin-top:.35rem;display:grid;grid-template-columns:1fr 1.35fr;gap:.3rem}
.card .step button{min-height:2.35rem;border-radius:.7rem;font-size:1.12rem;font-weight:900;
  border:2px solid var(--line);background:#FAF4E8;color:var(--ink2);display:grid;place-items:center;line-height:1}
.card .step button.plus{background:var(--accent);border-color:var(--accent);color:#fff}
.card .step button:disabled{opacity:.42}

/* 큰 글씨 모드 — 한 줄에 하나, 그림·이름·가격은 크게 + 수량은 아래 가득 */
html.big .card{display:grid;grid-template-columns:4.5rem 1fr;column-gap:.6rem;row-gap:.45rem;align-items:center;
  padding:.55rem .6rem .6rem;border-radius:1.15rem}
html.big .card .pic{grid-column:1;grid-row:1;width:4.5rem;height:4.5rem;display:grid;place-items:center;border-radius:.9rem}
html.big .card .pic svg{width:4.2rem;height:auto}
html.big .card .emo{height:auto;font-size:2.5rem}
html.big .card .txt{grid-column:2;grid-row:1;flex:1 1 auto;min-width:0}
html.big .card .nm{font-size:1.22rem;margin-top:0;line-height:1.22}
html.big .card .pr{font-size:1.06rem;margin-top:.16rem}
html.big .card .step{grid-column:1 / -1;grid-row:2;margin-top:.1rem;grid-template-columns:1fr 1.4fr;gap:.36rem}
html.big .card .step button{min-height:2.9rem;font-size:1.3rem;border-radius:.75rem}
html.big .card .hit{top:.4rem;right:.45rem;min-width:1.7rem;height:1.7rem;font-size:.9rem}

.empty{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:3rem 1rem;color:var(--ink2);text-align:center}
.empty .e{font-size:2.6rem}

/* ── 담은 것 바 ─────────────────────────────────────── */
.basket{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:.55rem;
  padding:.6rem .7rem calc(.6rem + env(safe-area-inset-bottom));background:rgba(255,247,233,.97);
  border-top:2px solid var(--line);box-shadow:0 -6px 18px rgba(58,40,25,.10)}
.basket .info{flex:1 1 auto;min-width:0}
.basket .info b{display:block;font-size:.96rem;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
.basket .info span{display:block;font-size:.82rem;font-weight:700;color:var(--ink2)}
.basket .info span.on{color:var(--accent2);font-weight:900;font-size:.98rem}
.basket .go{flex:0 0 auto;min-height:3.1rem;padding:0 1.15rem;border-radius:1rem;background:#B24A22;
  color:#fff;font-size:1.02rem;font-weight:900;letter-spacing:-.02em;box-shadow:0 4px 12px rgba(192,86,43,.3)}
.basket .go:disabled{background:#D9CBB8;color:#FFFDF4;box-shadow:none}
.basket .go:active:not(:disabled){transform:translateY(1px)}
html.big .basket{display:grid;grid-template-columns:1fr;gap:.4rem;padding-top:.5rem;padding-bottom:calc(.5rem + env(safe-area-inset-bottom))}
html.big .basket .info b{font-size:1rem}
html.big .basket .info span{font-size:.92rem}
html.big .basket .go{width:100%;min-height:3.4rem;font-size:1.14rem}
html.big .basket .go:disabled{display:none}
html.big .basket{padding-bottom:calc(.7rem + env(safe-area-inset-bottom))}
html.big body{padding-bottom:11.4rem}

/* ── 주문서(아래에서 올라오는 시트) ─────────────────── */
.sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheetwrap[hidden]{display:none !important}
.scrim{position:absolute;inset:0;background:rgba(30,20,12,.45)}
.sheet{position:relative;width:100%;max-width:34rem;max-height:92vh;overflow:auto;background:var(--cream);
  border-radius:1.4rem 1.4rem 0 0;padding:.5rem .85rem calc(1rem + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(30,20,12,.3);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet .bar{width:3rem;height:.3rem;border-radius:1rem;background:#DCCDB8;margin:.15rem auto .5rem}
.sheet h2{margin:0 0 .1rem;font-size:1.26rem;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:.35rem}
.sheet .sub{margin:0 0 .7rem;font-size:.84rem;color:var(--ink2);font-weight:700}
.rows{display:flex;flex-direction:column;gap:.42rem}
.row{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--line);
  border-radius:.9rem;padding:.45rem .55rem}
.row .rn{flex:1 1 auto;min-width:0;font-size:.98rem;font-weight:900;letter-spacing:-.02em;line-height:1.25;word-break:keep-all}
.row .rp{flex:0 0 auto;font-size:.92rem;font-weight:900;color:var(--accent2)}
.row .qs{flex:0 0 auto;display:flex;align-items:center;gap:.24rem}
.row .qs button{width:2.35rem;height:2.35rem;border-radius:.62rem;background:#F7EFE0;border:2px solid var(--line);
  font-size:1.16rem;font-weight:900;display:grid;place-items:center;line-height:1;color:var(--ink2)}
.row .qs .q{min-width:1.5rem;text-align:center;font-size:.98rem;font-weight:900}
.tot{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin:.75rem 0 .1rem;
  padding-top:.7rem;border-top:2px dashed #E2D2B9}
.tot .k{font-size:.94rem;font-weight:900;color:var(--ink2)}
.tot .v{font-size:1.72rem;font-weight:900;color:var(--accent2);letter-spacing:-.03em}
.split{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;
  padding:.5rem .6rem;margin-top:.55rem}
.split .t{flex:1 1 auto;min-width:0;font-size:.92rem;font-weight:900;word-break:keep-all;line-height:1.3}
.split .t em{display:block;font-style:normal;font-size:.78rem;font-weight:700;color:var(--ink2);margin-top:.1rem}
.split .q{flex:0 0 auto;display:flex;align-items:center;gap:.26rem}
.split .q button{width:2.35rem;height:2.35rem;border-radius:.62rem;background:#F7EFE0;border:2px solid var(--line);
  font-size:1.16rem;font-weight:900;display:grid;place-items:center;line-height:1;color:var(--ink2)}
.split .q .n{min-width:1.7rem;text-align:center;font-size:1rem;font-weight:900}
.split .per{flex:0 0 auto;font-size:.98rem;font-weight:900;color:var(--green)}
.perline{display:flex;align-items:baseline;justify-content:flex-end;gap:.4rem;margin-top:.4rem;font-size:.9rem;font-weight:900;color:var(--ink2)}
.perline b{font-size:1.12rem;color:var(--green);letter-spacing:-.02em}
.acts{display:grid;grid-template-columns:1fr;gap:.45rem;margin-top:.75rem}
.bigbtn{min-height:3.5rem;border-radius:1rem;font-size:1.12rem;font-weight:900;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem}
.bigbtn.main{background:#B24A22;color:#FFF7E9;box-shadow:0 5px 14px rgba(178,74,34,.32)}
.bigbtn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink2)}
.bigbtn:active{transform:translateY(1px)}
.bigbtn:disabled{background:#D9CBB8;box-shadow:none}
.done{text-align:center;padding:.4rem .2rem .2rem}
.done .ck{font-size:3rem;line-height:1}
.done h2{justify-content:center;font-size:1.5rem}
.done .no{display:inline-block;margin:.5rem auto .1rem;background:var(--coffee);color:#FFF7E9;border-radius:1rem;
  padding:.42rem 1.1rem;font-size:1.5rem;font-weight:900;letter-spacing:.02em}
.done p{margin:.4rem 0 0;font-size:.95rem;color:var(--ink2);font-weight:700;line-height:1.45}
.done .list{text-align:left;margin-top:.7rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.6rem .7rem}
.done .list div{display:flex;justify-content:space-between;gap:.5rem;font-size:.95rem;font-weight:800;padding:.16rem 0}
.done .list div b{color:var(--accent2)}

/* 큰 글씨 모드 주문서 — 이름이 잘리지 않게 (이름·가격 왼쪽 / 수량 오른쪽) */
html.big .row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"nm qs" "pr qs";
  align-items:center;column-gap:.5rem;row-gap:.05rem;padding:.5rem .6rem}
html.big .row .rn{grid-area:nm;font-size:1.02rem}
html.big .row .pr{grid-area:pr;font-size:.92rem}
html.big .row .qs{grid-area:qs;gap:.3rem}
html.big .row .qs button{width:2.6rem;height:2.6rem;font-size:1.24rem}
html.big .row .qs .q{min-width:1.6rem;font-size:1.04rem}
html.big .split{flex-wrap:wrap;row-gap:.42rem}
html.big .split .t{flex:1 1 100%;font-size:.94rem}
html.big .split .q{margin-left:auto}
html.big .split .q button{width:2.6rem;height:2.6rem}

/* 알림 토스트 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:9.2rem;z-index:80;background:rgba(42,33,27,.94);
  color:#FFF7E9;border-radius:1rem;padding:.62rem 1rem;font-size:.92rem;font-weight:900;letter-spacing:-.02em;
  max-width:min(92vw,26rem);text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:pop .18s ease-out}
@keyframes pop{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* 아주 좁은 폰 */
@media (max-width:359px){
  html{font-size:17px}
  .ttl h1{font-size:1.26rem}
  .pill{font-size:.78rem}
}

</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">🐹</span>
    <div class="ttl">
      <h1 id="storeName">와글링 테이블</h1>
      <p id="storeSub">큰 글씨 메뉴판 · 주문</p>
    </div>
    <span class="demo" id="demoTag" hidden>예시</span>
  </div>
  <div class="ctrl">
    <button type="button" class="pill" id="langBtn" aria-pressed="false" aria-label="영어 메뉴판으로 보기">
      <span class="ic" aria-hidden="true">🌐</span><span id="langTxt">EN</span>
    </button>
    <button type="button" class="pill" id="bigBtn" aria-pressed="false" aria-label="큰 글씨 켜기">
      <span class="ic" aria-hidden="true">👴</span><span id="bigTxt">큰 글씨</span><span class="sw" aria-hidden="true"></span>
    </button>
    <button type="button" class="pill" id="soundBtn" aria-pressed="true" aria-label="메뉴 읽어 주기 켜기">
      <span class="ic" id="soundIc" aria-hidden="true">🔊</span><span id="soundTxt">소리</span>
    </button>
  </div>
  <button type="button" class="datebar" id="todayCard" aria-label="오늘 날짜와 날씨">
    <span class="db-date" id="todayDate">오늘</span>
    <span class="db-sep" aria-hidden="true">·</span>
    <span class="db-wx loading" id="todayWx">날씨 확인 중</span>
    <span class="db-place" id="wxPlace">김해</span>
    <span class="db-go" aria-hidden="true">↻</span>
  </button>
</header>

<nav class="cats" id="cats" aria-label="메뉴 분류"></nav>

<main>
  <div class="grid" id="board"></div>
  <div class="empty" id="empty" hidden>
    <span class="e" aria-hidden="true">🍽️</span>
    <b id="emptyT">이 분류에는 메뉴가 없어요</b>
  </div>
</main>

<div class="basket">
  <div class="info">
    <b id="bsCount">메뉴를 눌러 담아 보세요</b>
    <span id="bsTotal">아직 담은 메뉴가 없어요</span>
  </div>
  <button type="button" class="go" id="bsGo" disabled>주문서 보기</button>
</div>

<div class="sheetwrap" id="sheetWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="bar" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ── payload ── */
/* ══════ 와글링 테이블 · 메뉴 데이터 ↔ QR 토큰 (사장님용·손님용 공용 규격) ══════
   · 바이너리 → base64url. 짧게 만들어 QR 한 장에 메뉴가 통째로 들어가게 한다.
   · 형식   'W','T', ver=1, [가게이름], [메뉴 수], 메뉴마다 {분류, 품절, 가격, 이름}
   · 분류   0 = ☕ 따뜻한 / 1 = 🧊 차가운 / 2 = 🍽️ 다른 메뉴  (이름·그림은 앱이 알고 있어 글자로 담지 않는다) */
var WTData = (function(){

/* ══════ 오늘 날짜·요일·날씨 (모든 앱 공통) — 김해 기본, 누르면 현위치 ══════
   · 인터넷이 없거나 막히면 '날씨 정보 없음' 으로 조용히 넘어간다 (메뉴판은 그대로 보인다) */
var WTDay = (function(){
  'use strict';
  var KO_DOW = ['일','월','화','수','목','금','토'];
  var EN_DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var EN_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WMO = {
    0:['☀️','맑음','Clear'], 1:['🌤️','대체로 맑음','Mostly clear'], 2:['⛅','구름 조금','Partly cloudy'], 3:['☁️','흐림','Overcast'],
    45:['🌫️','안개','Fog'], 48:['🌫️','안개','Fog'],
    51:['🌦️','이슬비','Drizzle'], 53:['🌦️','이슬비','Drizzle'], 55:['🌦️','이슬비','Drizzle'],
    56:['🌧️','어는 비','Freezing rain'], 57:['🌧️','어는 비','Freezing rain'],
    61:['🌧️','비','Rain'], 63:['🌧️','비','Rain'], 65:['🌧️','비','Rain'],
    66:['🌧️','어는 비','Freezing rain'], 67:['🌧️','어는 비','Freezing rain'],
    71:['🌨️','눈','Snow'], 73:['🌨️','눈','Snow'], 75:['🌨️','눈','Snow'], 77:['🌨️','눈','Snow'],
    80:['🌦️','소나기','Showers'], 81:['🌦️','소나기','Showers'], 82:['🌧️','소나기','Heavy showers'],
    85:['🌨️','눈 소나기','Snow showers'], 86:['🌨️','눈 소나기','Snow showers'],
    95:['⛈️','천둥번개','Thunderstorms'], 96:['⛈️','천둥번개','Thunderstorms'], 99:['⛈️','천둥번개','Thunderstorms']
  };
  var LAT = 35.23, LON = 128.89;          /* 김해 */
  var KEY = 'wt_weather_v1';
  var wx = null, at = 0, busy = false, failed = false, seq = 0, rank = 0, place = 'gimhae';
  var TTL = 20 * 60 * 1000;

  function EN(){ return window.WTLANG === 'en'; }
  function B(ko, en){ return EN() ? en : ko; }
  function $(s){ return document.querySelector(s); }

  function paint(){
    var d = new Date(), el = $('#todayDate'), wxEl = $('#todayWx'), pl = $('#wxPlace');
    if(el) el.textContent = EN()
      ? EN_DOW[d.getDay()] + ', ' + EN_MON[d.getMonth()] + ' ' + d.getDate()
      : (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + KO_DOW[d.getDay()] + ')';
    var txt, loading = false;
    if(wx) txt = wx.emoji + ' ' + (EN() ? (WMO[wx.code] ? WMO[wx.code][2] : 'Weather') : (WMO[wx.code] ? WMO[wx.code][1] : '날씨')) + ' ' + wx.t + '°';
    else if(failed){ txt = B('날씨 정보 없음', 'No weather'); }
    else { txt = B('날씨 확인 중', 'Checking'); loading = true; }
    if(wxEl){ wxEl.textContent = txt; wxEl.classList.toggle('loading', loading); }
    if(pl) pl.textContent = place === 'here' ? B('내 위치', 'Here') : B('김해', 'Gimhae');
    var card = $('#todayCard');
    if(card) card.setAttribute('aria-label', B('오늘 ' + (el ? el.textContent : '') + ', ' + txt + ' — 누르면 현위치 날씨로 새로고침',
      'Today ' + (el ? el.textContent : '') + ', ' + txt + ' — tap to refresh with my location'));
  }
  function loadCache(){
    try {
      var j = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(!j || typeof j.t !== 'number') return;
      if(Date.now() - j.at > 12 * 60 * 60 * 1000) return;
      wx = { emoji: (WMO[j.code] || ['🌡️'])[0], code: j.code, t: Math.round(j.t) };
      at = j.at;
      place = j.place === 'here' ? 'here' : 'gimhae';
    } catch(e){}
  }
  function saveCache(code, t){
    try { localStorage.setItem(KEY, JSON.stringify({ code: code, t: t, at: Date.now(), place: place })); } catch(e){}
  }
  function fetchWx(lat, lon, r){
    if(!window.fetch || navigator.onLine === false){ failed = true; paint(); return Promise.resolve(false); }
    r = r || 1;
    failed = false;
    var my = seq, ctl = window.AbortController ? new AbortController() : null, to = null;
    if(ctl) to = setTimeout(function(){ try { ctl.abort(); } catch(e){} }, 8000);
    return fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code&timezone=auto',
        ctl ? { cache: 'no-store', signal: ctl.signal } : { cache: 'no-store' })
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(j){
        if(to) clearTimeout(to);
        var c = j && j.current;
        if(!c || typeof c.temperature_2m !== 'number'){ failed = true; paint(); return false; }
        if(my !== seq || r < rank) return false;
        rank = r;
        wx = { emoji: (WMO[c.weather_code] || ['🌡️'])[0], code: c.weather_code, t: Math.round(c.temperature_2m) };
        at = Date.now();
        saveCache(c.weather_code, c.temperature_2m);
        paint();
        return true;
      })
      .catch(function(){ if(to) clearTimeout(to); failed = true; paint(); return false; });
  }
  function refreshHere(){
    if(!navigator.geolocation){ fetchWx(LAT, LON, 1); return; }
    if(navigator.onLine === false){ failed = true; paint(); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      var c = pos && pos.coords;
      if(!c){ fetchWx(LAT, LON, 1); return; }
      place = 'here'; seq++; rank = 2;
      fetchWx(Math.round(c.latitude * 100) / 100, Math.round(c.longitude * 100) / 100, 2);
    }, function(){ fetchWx(LAT, LON, 1); }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
  }
  function init(){
    loadCache();
    paint();
    var card = $('#todayCard');
    if(card) card.addEventListener('click', function(){
      if(busy) return;
      busy = true;
      refreshHere();
      setTimeout(function(){ busy = false; }, 1500);
    });
    if(!at || Date.now() - at > TTL) fetchWx(LAT, LON, 1);
    setInterval(paint, 60 * 1000);
  }
  return { init: init, paint: paint };
})();

function say(text){
  if(!SOUND || !text) return;
  try {
    var ss = window.speechSynthesis;
    if(!ss) return;
    ss.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = LANG === 'en' ? 'en-US' : 'ko-KR';
    u.rate = 0.92;
    u.pitch = 1.02;
    ss.speak(u);
  } catch(e){}
}

    + '<p>' + t('이 화면을 직원에게 보여 주세요.', 'Show this screen to the staff.') + '</p>'
    + '<div class="list">' + rows
      + '<div style="border-top:1px dashed #E2D2B9;margin-top:.35rem;padding-top:.35rem"><span><b>' + t('합계', 'Total') + '</b></span><b>' + money(o.total) + '</b></div>'
      + (o.persons > 1 ? '<div><span>' + o.persons + t('명이서 나누면', ' split ' + o.persons + ' ways') + '</span><b>' + t('1인당 ', 'each ') + money(per) + '</b></div>' : '')
    + '</div>'
    + '<div class="acts">'
      + '<button type="button" class="bigbtn main" data-close="1">' + t('확인', 'Done') + '</button>'
      + '<button type="button" class="bigbtn ghost" id="newOrder">' + t('새로 주문하기', 'Start a new order') + '</button>'
    + '</div></div>';
}
function placeOrder(){
  var keys = Object.keys(cart).filter(function(k){ return cart[k] > 0; });
  if(!keys.length) return;
  var o = { no: nextNo(), items: [], total: total(), persons: persons };
  keys.forEach(function(k){
    var it = store.items[k];
    o.items.push({ n: it.n, p: it.p, q: cart[k] });
  });
  lastOrder = o;
  cart = {};
  renderBoard();
  renderBasket();
  sheet = 'done';
  renderSheet();
  say(t('주문번호 ' + String(o.no).padStart(2, '0') + '번, 합계 ' + money(o.total) + '입니다. 직원에게 보여 주세요.',
        'Order number ' + o.no + ', total ' + money(o.total) + '. Please show this to the staff.'));
}
function nextNo(){
  var n = 1;
  try {
    var today = new Date().toISOString().slice(0, 10);
    var j = JSON.parse(localStorage.getItem(K_NO) || 'null');
    if(j && j.d === today) n = (j.n | 0) + 1;
    localStorage.setItem(K_NO, JSON.stringify({ d: today, n: n }));
  } catch(e){}
  return n;
}

/* ── 알림 ───────────────────────────────────────────── */
var toastT = null;
function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.hidden = true; }, 1900);
}

/* ── 설정 저장 ──────────────────────────────────────── */
function loadPrefs(){
  try {
    LANG = localStorage.getItem(K_LANG) === 'en' ? 'en' : 'ko';
    BIG = localStorage.getItem(K_BIG) === '1';
    SOUND = localStorage.getItem(K_SOUND) !== '0';
  } catch(e){}
  document.documentElement.classList.toggle('big', BIG);
  document.documentElement.lang = LANG;
  window.WTLANG = LANG;
}
function savePrefs(){
  try {
    localStorage.setItem(K_LANG, LANG);
    localStorage.setItem(K_BIG, BIG ? '1' : '0');
    localStorage.setItem(K_SOUND, SOUND ? '1' : '0');
  } catch(e){}
}

/* ── 사건 연결 ──────────────────────────────────────── */
function bind(){
  $('#langBtn').addEventListener('click', function(){
    LANG = LANG === 'en' ? 'ko' : 'en';
    document.documentElement.lang = LANG;
    window.WTLANG = LANG;
    savePrefs();
    render();
    WTDay.paint();
    if(sheet !== 'closed') renderSheet();
  });
  $('#bigBtn').addEventListener('click', function(){
    BIG = !BIG;
    document.documentElement.classList.toggle('big', BIG);
    savePrefs();
    renderHead();
  });
  $('#soundBtn').addEventListener('click', function(){
    SOUND = !SOUND;
    savePrefs();
    renderHead();
    if(SOUND) say(t('소리를 켰어요. 메뉴를 눌러 보세요.', 'Reading is on. Tap a menu item.'));
    else stopSay();
  });
  $('#cats').addEventListener('click', function(e){
    var b = e.target.closest('[data-cat]');
    if(!b) return;
    curCat = b.getAttribute('data-cat');
    if(curCat !== 'all') curCat = parseInt(curCat, 10);
    renderCats();
    renderBoard();
  });
  $('#board').addEventListener('click', function(e){
    var m = e.target.closest('[data-m]'), p = e.target.closest('[data-p]'), c = e.target.closest('.card');
    stopSay();
    if(p){ e.stopPropagation(); addQty(parseInt(p.getAttribute('data-p'), 10), 1); return; }
    if(m){ e.stopPropagation(); addQty(parseInt(m.getAttribute('data-m'), 10), -1); return; }
    if(c) addQty(parseInt(c.getAttribute('data-i'), 10), 1);
  });
  $('#board').addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var c = e.target.closest('.card');
    if(!c) return;
    e.preventDefault();
    addQty(parseInt(c.getAttribute('data-i'), 10), 1);
  });
  $('#bsGo').addEventListener('click', function(){ if(count()) openSheet('cart'); });
  $('#sheetBody').addEventListener('click', function(e){
    var q = e.target.closest('[data-qs]'), pe = e.target.closest('[data-pers]'), cl = e.target.closest('[data-close]');
    if(q){
      var i = parseInt(q.getAttribute('data-qs'), 10), d = parseInt(q.getAttribute('data-d'), 10);
      var nv = (cart[i] || 0) + d;
      if(nv <= 0) delete cart[i]; else cart[i] = nv;
      renderSheet(); renderBasket(); updateCard(i);
      return;
    }
    if(pe){
      persons = Math.max(1, Math.min(20, persons + parseInt(pe.getAttribute('data-pers'), 10)));
      renderSheet();
      return;
    }
    if(cl){ closeSheet(); return; }
    if(e.target.closest('#orderGo')){ placeOrder(); return; }
    if(e.target.closest('#newOrder')){ closeSheet(); }
    if(e.target.closest('#orderRead')){
      var n = count(), sum = total(), per = Math.ceil(sum / Math.max(1, persons));
      var txt = t('주문서입니다. ', 'Your order. ');
      Object.keys(cart).filter(function(k){ return cart[k] > 0; }).forEach(function(k){
        var it = store.items[k];
        txt += it.n + ' ' + cart[k] + t('개, ', ', ') ;
      });
      txt += t('합계 ' + money(sum) + '입니다. ' + persons + '명이서 나누면 1인당 ' + money(per) + '입니다.',
               'Total ' + money(sum) + '. Split ' + persons + ' ways, ' + money(per) + ' each.');
      say(txt);
    }
  });
  $('#scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && sheet !== 'closed') closeSheet();
  });
  window.addEventListener('hashchange', function(){
    store = readStore();
    cart = {};
    persons = 1;
    curCat = 'all';
    render();
  });
}

/* ── 시작 ───────────────────────────────────────────── */
loadPrefs();
store = readStore();
bind();
render();
WTDay.init();
if(DEMO){
  /* 예시 메뉴판 — 사장님 QR로 열면 사라진다 */
  setTimeout(function(){ toast(t('예시 메뉴판이에요 · QR을 찍으면 우리 가게 메뉴가 나와요', 'Sample menu · scan your shop QR for your own menu')); }, 700);
}
})();

</script>
