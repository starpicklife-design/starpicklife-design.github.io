<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#3E2C22" />
<title>와글링 테이블 · 손님용 — 큰 글씨 메뉴판</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="와글링 테이블" />
<style>
/* ══════════════════════════════════════════════════════════════
   와글링 테이블 · 손님용 — 큰 글씨 메뉴판 (고객 앱)
   ══════════════════════════════════════════════════════════════ */
:root{
  --cream:#FFF7E9; --cream2:#FDF0D9; --card:#FFFFFF; --ink:#2A211B; --ink2:#5A4A3F; --ink3:#8B7A6B;
  --coffee:#3E2C22; --accent:#C0562B; --accent2:#A3431F; --gold:#D9A227; --line:#EADFCB;
  --green:#2E7D5B; --shadow:0 2px 10px rgba(58,40,25,.10);
  --hot:#C0562B; --hotbg:#FFF0DF; --ice:#2E7FA6; --icebg:#E8F6FC; --food:#8A6A22; --foodbg:#FBF1D8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;background:var(--cream)}
html.big{font-size:23px}
body{margin:0;background:var(--cream);color:var(--ink);line-height:1.35;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  padding-bottom:8.4rem;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 머리말 ─────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--coffee);color:#FFF7E9;
  padding:.5rem .7rem .6rem;box-shadow:0 3px 12px rgba(40,26,16,.22)}
.brand{display:flex;align-items:center;gap:.5rem;min-width:0}
.logo{flex:0 0 auto;width:2.3rem;height:2.3rem;border-radius:.85rem;background:#FFF3DF;
  display:grid;place-items:center;font-size:1.3rem;line-height:1;box-shadow:inset 0 0 0 2px #E9CFA4}
.ttl{flex:1 1 auto;min-width:0}
.ttl h1{margin:0;font-size:1.42rem;font-weight:900;letter-spacing:-.035em;line-height:1.16;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:.05rem 0 0;font-size:.72rem;font-weight:700;color:#E8D5BC;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{flex:0 0 auto;font-size:.66rem;font-weight:900;color:#3E2C22;background:#F3D391;
  border-radius:2rem;padding:.14rem .45rem;letter-spacing:-.01em}

/* 조작 알약 3개 — 언어 · 큰 글씨 · 소리 */
.ctrl{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:.34rem;margin-top:.5rem}
.pill{display:flex;align-items:center;justify-content:center;gap:.28rem;min-height:2.5rem;
  border-radius:2rem;background:rgba(255,247,233,.13);border:2px solid rgba(255,247,233,.42);
  color:#FFF7E9;font-size:.86rem;font-weight:900;letter-spacing:-.02em;white-space:nowrap;
  padding:0 .4rem;transition:background .15s,border-color .15s}
.pill:active{transform:translateY(1px)}
.pill[aria-pressed="true"]{background:#F3D391;border-color:#F3D391;color:#3A2A1B}
.pill .sw{width:1.55rem;height:.92rem;border-radius:1rem;background:rgba(255,247,233,.3);position:relative;flex:0 0 auto}
.pill .sw::after{content:"";position:absolute;top:.1rem;left:.1rem;width:.72rem;height:.72rem;border-radius:50%;background:#FFF7E9;transition:.15s}
.pill[aria-pressed="true"] .sw{background:#8A6A2E}
.pill[aria-pressed="true"] .sw::after{left:.73rem;background:#FFFDF4}
.pill .ic{font-size:1.02rem;line-height:1}

/* 큰 글씨 모드 머리말은 조금 더 아낀다 (메뉴가 더 보이게) */
html.big .ttl h1{font-size:1.18rem}
html.big .ttl p{display:none}
html.big .logo{width:2rem;height:2rem;font-size:1.1rem}
html.big .top{padding-top:.42rem;padding-bottom:.5rem}
html.big .ctrl{margin-top:.38rem}

/* 날짜·요일·날씨 */
.datebar{display:flex;align-items:center;gap:.3rem;margin-top:.45rem;padding:.34rem .55rem;
  background:#FFFDF6;border-radius:.8rem;color:#4A362B;text-align:left;width:100%;
  font-size:.78rem;box-shadow:inset 0 0 0 1.5px #E7D8BF}
.datebar .db-date{font-weight:900;flex:0 0 auto;letter-spacing:-.02em}
.datebar .db-sep{color:#D8C6B4;flex:0 0 auto}
.datebar .db-wx{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.datebar .db-wx.loading{color:#A9977F}
.datebar .db-place{flex:0 0 auto;color:#A08C79;font-size:.7rem;font-weight:800}
.datebar .db-go{flex:0 0 auto;color:#B9A491;font-size:.72rem}

/* 저장한 가게 띠 */
.shopbar{display:flex;align-items:center;gap:.3rem;margin-top:.3rem;padding:.26rem .55rem;width:100%;
  background:#F6E6C6;border-radius:.8rem;color:#5B3F14;text-align:left;font-size:.78rem;
  box-shadow:inset 0 0 0 1.5px #E4CB9C}
.shopbar .sb-ic{flex:0 0 auto;font-size:.86rem}
.shopbar .sb-nm{flex:1 1 auto;min-width:0;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopbar .sb-n{flex:0 0 auto;font-size:.7rem;font-weight:900;background:#EAD3A6;border-radius:2rem;padding:.05rem .4rem}
.shopbar .sb-go{flex:0 0 auto;font-size:.8rem;color:#8A6A2E}
html.big .shopbar{font-size:.84rem;padding:.3rem .55rem}

/* ── 분류 탭 ───────────────────────────────────────── */
.cats{display:flex;flex-wrap:wrap;gap:.28rem;padding:.55rem .7rem .3rem;
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--cream) 76%,rgba(255,247,233,0))}
.cat{flex:0 0 auto;min-height:2.4rem;padding:0 .52rem;border-radius:2rem;background:#fff;
  border:2px solid var(--line);color:var(--ink2);font-size:.82rem;font-weight:900;letter-spacing:-.035em;
  display:flex;align-items:center;gap:.16rem;box-shadow:var(--shadow)}
.cat[aria-pressed="true"]{background:var(--coffee);border-color:var(--coffee);color:#FFF7E9}
.cat:active{transform:translateY(1px)}

/* ── 메뉴 직접 추가 (접이식) ─────────────────────────── */
.addwrap{margin:.1rem .7rem .05rem}
.addtoggle{display:flex;align-items:center;justify-content:center;gap:.3rem;width:100%;min-height:2.15rem;
  border-radius:.8rem;border:2px dashed #D9C4A6;background:#FFFDF6;color:var(--ink2);
  font-size:.84rem;font-weight:900;letter-spacing:-.03em}
.addtoggle[aria-expanded="true"]{background:#FBF1DE;border-style:solid;border-color:var(--gold);color:#6B4A18}
.addtoggle:active{transform:translateY(1px)}
.addform{margin-top:.4rem;padding:.45rem .55rem .55rem;background:#FFFDF6;border:2px solid var(--line);
  border-radius:.9rem;display:grid;grid-template-columns:1fr 1fr;gap:.36rem;box-shadow:var(--shadow)}
.afld{display:grid;gap:.16rem;min-width:0}
.afld.full{grid-column:1 / -1}
.afld label{font-size:.74rem;font-weight:900;color:var(--ink2);letter-spacing:-.02em}
.afld input,.afld select{width:100%;min-height:2.4rem;border:2px solid var(--line);border-radius:.6rem;background:#fff;
  padding:0 .5rem;font-family:inherit;font-size:.92rem;font-weight:800;color:var(--ink);-webkit-appearance:none;appearance:none}
.afld select{background-image:linear-gradient(45deg,transparent 50%,#8B7A6B 50%),linear-gradient(135deg,#8B7A6B 50%,transparent 50%);
  background-position:calc(100% - .95rem) 1rem,calc(100% - .62rem) 1rem;background-size:.34rem .34rem,.34rem .34rem;
  background-repeat:no-repeat;padding-right:1.5rem}
.afld input::placeholder{color:#B7A692;font-weight:700}
.afld input:focus,.afld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,86,43,.14)}
.addgo{grid-column:1 / -1;min-height:2.6rem;border-radius:.65rem;background:var(--accent);color:#fff;
  font-size:.98rem;font-weight:900;letter-spacing:-.02em;box-shadow:0 3px 10px rgba(192,86,43,.28)}
.addgo:active{transform:translateY(1px)}
.addnote{grid-column:1 / -1;margin:0;font-size:.72rem;font-weight:700;color:var(--ink3);letter-spacing:-.02em;line-height:1.35}
.minewrap{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:.24rem}
.chip{display:flex;align-items:center;gap:.2rem;background:#fff;border:1.5px solid var(--line);border-radius:2rem;
  padding:.18rem .3rem .18rem .5rem;font-size:.74rem;font-weight:900;color:var(--ink2);max-width:100%}
.chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{flex:0 0 auto;width:1.15rem;height:1.15rem;border-radius:50%;background:#F7E7DA;color:#B24A22;
  display:grid;place-items:center;font-size:.66rem;font-weight:900;line-height:1}
html.big .addtoggle{min-height:2.6rem;font-size:.94rem}
html.big .addform{grid-template-columns:1fr}
html.big .afld label{font-size:.82rem}
html.big .afld input,html.big .afld select{min-height:2.9rem;font-size:1rem}
html.big .addgo{min-height:3rem;font-size:1.06rem}
html.big .addnote{font-size:.78rem}

/* ── 메뉴판 ─────────────────────────────────────────── */
main{padding:0 .7rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.44rem;margin-top:.2rem}
html.big .grid{grid-template-columns:1fr;gap:.5rem}
html.big .cats{display:grid;grid-template-columns:1fr 1fr;overflow:visible;gap:.4rem;padding-top:.5rem}
html.big .cat{justify-content:center;font-size:.9rem;min-height:2.5rem;letter-spacing:-.03em}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:.9rem;padding:.3rem .36rem .36rem;
  box-shadow:var(--shadow);min-width:0;transition:transform .1s,box-shadow .15s}
.card:active{transform:scale(.985)}
.card .head{display:grid;grid-template-columns:3.5rem 1fr;align-items:center;gap:.34rem;min-width:0}
.card .pic{position:relative;display:grid;place-items:center;width:3.5rem;height:3.5rem;border-radius:.62rem;
  background:var(--hotbg);padding:.1rem .14rem;line-height:0;overflow:hidden;flex:0 0 auto}
.card.t-ice .pic{background:var(--icebg)}
.card.t-food .pic{background:var(--foodbg)}
.card .pic svg{width:100%;height:auto;display:block}
.card .txt{display:block;min-width:0}
.card .emo{display:grid;place-items:center;font-size:1.9rem;line-height:1}
.card .nm{display:block;font-size:.98rem;font-weight:900;letter-spacing:-.03em;
  line-height:1.2;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
.card .pr{display:block;margin-top:.08rem;font-size:.92rem;font-weight:900;color:var(--accent2);letter-spacing:-.02em}
.card .hit{position:absolute;top:.06rem;left:.06rem;background:var(--accent);color:#fff;border-radius:2rem;
  min-width:1.15rem;height:1.15rem;padding:0 .22rem;display:grid;place-items:center;font-size:.72rem;font-weight:900;
  box-shadow:0 2px 6px rgba(0,0,0,.22)}
.card.sold{opacity:.62}
.card.sold .pic{filter:grayscale(.7)}
.card .soldtag{position:absolute;left:.06rem;bottom:.06rem;background:#4A4038;color:#fff;border-radius:.4rem;
  padding:.03rem .24rem;font-size:.56rem;font-weight:900}
.card .del{position:absolute;right:.06rem;bottom:.06rem;width:1.25rem;height:1.25rem;border-radius:50%;
  background:#F7E7DA;color:#B24A22;border:1.5px solid #E3C6B2;display:grid;place-items:center;
  font-size:.72rem;font-weight:900;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card .step{margin-top:.3rem;display:grid;grid-template-columns:1fr 1.3fr;gap:.28rem}
.card .step button{min-height:2.05rem;border-radius:.55rem;font-size:1.04rem;font-weight:900;
  border:2px solid var(--line);background:#FAF4E8;color:var(--ink2);display:grid;place-items:center;line-height:1}
.card .step button.plus{background:var(--accent);border-color:var(--accent);color:#fff}
.card .step button:disabled{opacity:.42}

/* 큰 글씨 모드 — 한 줄에 하나, 그림·이름·가격은 크게 + 수량은 아래 가득 */
html.big .card{padding:.5rem .55rem .55rem;border-radius:1.05rem}
html.big .card .head{grid-template-columns:4.6rem 1fr;column-gap:.6rem}
html.big .card .pic{width:4.6rem;height:4.6rem;border-radius:.85rem;padding:.12rem .18rem}
html.big .card .emo{font-size:2.6rem}
html.big .card .nm{font-size:1.22rem;line-height:1.22}
html.big .card .pr{font-size:1.06rem;margin-top:.16rem}
html.big .card .step{margin-top:.4rem;grid-template-columns:1fr 1.4fr;gap:.36rem}
html.big .card .step button{min-height:2.9rem;font-size:1.3rem;border-radius:.75rem}
html.big .card .hit{min-width:1.5rem;height:1.5rem;font-size:.84rem}
html.big .card .del{width:1.6rem;height:1.6rem;font-size:.86rem}
html.big .card .soldtag{font-size:.66rem;padding:.05rem .3rem}

.empty{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:3rem 1rem;color:var(--ink2);text-align:center}
.empty .e{font-size:2.6rem}

/* ── 담은 것 바 ─────────────────────────────────────── */
.basket{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:.55rem;
  padding:.6rem .7rem calc(.6rem + env(safe-area-inset-bottom));background:rgba(255,247,233,.97);
  border-top:2px solid var(--line);box-shadow:0 -6px 18px rgba(58,40,25,.10)}
.basket .info{flex:1 1 auto;min-width:0}
.basket .info b{display:block;font-size:.96rem;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
.basket .info span{display:block;font-size:.82rem;font-weight:700;color:var(--ink2)}
.basket .info span.on{color:var(--accent2);font-weight:900;font-size:.98rem}
.basket .go{flex:0 0 auto;min-height:3.1rem;padding:0 1.15rem;border-radius:1rem;background:#B24A22;
  color:#fff;font-size:1.02rem;font-weight:900;letter-spacing:-.02em;box-shadow:0 4px 12px rgba(192,86,43,.3)}
.basket .go:disabled{background:#D9CBB8;color:#FFFDF4;box-shadow:none}
.basket .go:active:not(:disabled){transform:translateY(1px)}
html.big .basket{display:grid;grid-template-columns:1fr;gap:.4rem;padding-top:.5rem;padding-bottom:calc(.5rem + env(safe-area-inset-bottom))}
html.big .basket .info b{font-size:1rem}
html.big .basket .info span{font-size:.92rem}
html.big .basket .go{width:100%;min-height:3.4rem;font-size:1.14rem}
html.big .basket .go:disabled{display:none}
html.big .basket{padding-bottom:calc(.7rem + env(safe-area-inset-bottom))}
html.big body{padding-bottom:11.4rem}

/* ── 주문서(아래에서 올라오는 시트) ─────────────────── */
.sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheetwrap[hidden]{display:none !important}
.scrim{position:absolute;inset:0;background:rgba(30,20,12,.45)}
.sheet{position:relative;width:100%;max-width:34rem;max-height:92vh;overflow:auto;background:var(--cream);
  border-radius:1.4rem 1.4rem 0 0;padding:.5rem .85rem calc(1rem + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(30,20,12,.3);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet .bar{width:3rem;height:.3rem;border-radius:1rem;background:#DCCDB8;margin:.15rem auto .5rem}
.sheet h2{margin:0 0 .1rem;font-size:1.26rem;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:.35rem}
.sheet .sub{margin:0 0 .7rem;font-size:.84rem;color:var(--ink2);font-weight:700}
.rows{display:flex;flex-direction:column;gap:.42rem}
.row{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--line);
  border-radius:.9rem;padding:.45rem .55rem}
.row .rn{flex:1 1 auto;min-width:0;font-size:.98rem;font-weight:900;letter-spacing:-.02em;line-height:1.25;word-break:keep-all}
.row .rp{flex:0 0 auto;font-size:.92rem;font-weight:900;color:var(--accent2)}
.row .qs{flex:0 0 auto;display:flex;align-items:center;gap:.24rem}
.row .qs button{width:2.35rem;height:2.35rem;border-radius:.62rem;background:#F7EFE0;border:2px solid var(--line);
  font-size:1.16rem;font-weight:900;display:grid;place-items:center;line-height:1;color:var(--ink2)}
.row .qs .q{min-width:1.5rem;text-align:center;font-size:.98rem;font-weight:900}
.tot{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin:.75rem 0 .1rem;
  padding-top:.7rem;border-top:2px dashed #E2D2B9}
.tot .k{font-size:.94rem;font-weight:900;color:var(--ink2)}
.tot .v{font-size:1.72rem;font-weight:900;color:var(--accent2);letter-spacing:-.03em}
.split{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;
  padding:.5rem .6rem;margin-top:.55rem}
.split .t{flex:1 1 auto;min-width:0;font-size:.92rem;font-weight:900;word-break:keep-all;line-height:1.3}
.split .t em{display:block;font-style:normal;font-size:.78rem;font-weight:700;color:var(--ink2);margin-top:.1rem}
.split .q{flex:0 0 auto;display:flex;align-items:center;gap:.26rem}
.split .q button{width:2.35rem;height:2.35rem;border-radius:.62rem;background:#F7EFE0;border:2px solid var(--line);
  font-size:1.16rem;font-weight:900;display:grid;place-items:center;line-height:1;color:var(--ink2)}
.split .q .n{min-width:1.7rem;text-align:center;font-size:1rem;font-weight:900}
.split .per{flex:0 0 auto;font-size:.98rem;font-weight:900;color:var(--green)}
.perline{display:flex;align-items:baseline;justify-content:flex-end;gap:.4rem;margin-top:.4rem;font-size:.9rem;font-weight:900;color:var(--ink2)}
.perline b{font-size:1.12rem;color:var(--green);letter-spacing:-.02em}
/* 주문서 입력칸 — 테이블 번호 · 요청사항 */
.fields{display:grid;gap:.42rem;margin-top:.55rem}
.fld{display:grid;gap:.2rem;min-width:0}
.fld > label{font-size:.84rem;font-weight:900;color:var(--ink2);letter-spacing:-.02em}
.fld > label em{font-style:normal;font-weight:800;color:var(--ink3);font-size:.74rem}
.fld input{width:100%;min-height:2.9rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;
  padding:0 .65rem;font-family:inherit;font-size:1rem;font-weight:800;color:var(--ink);-webkit-appearance:none;appearance:none}
.fld input::placeholder{color:#B7A692;font-weight:700;font-size:.9rem}
.fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,86,43,.14)}
.fld.num{max-width:9rem}
html.big .fld > label{font-size:.92rem}
html.big .fld input{min-height:3.1rem;font-size:1.06rem}
html.big .fld.num{max-width:none}
.acts{display:grid;grid-template-columns:1fr;gap:.45rem;margin-top:.75rem}
.bigbtn{min-height:3.5rem;border-radius:1rem;font-size:1.12rem;font-weight:900;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem}
.bigbtn.main{background:#B24A22;color:#FFF7E9;box-shadow:0 5px 14px rgba(178,74,34,.32)}
.bigbtn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink2)}
.bigbtn:active{transform:translateY(1px)}
.bigbtn:disabled{background:#D9CBB8;box-shadow:none}
.done{text-align:center;padding:.4rem .2rem .2rem}
.done .ck{font-size:3rem;line-height:1}
.done h2{justify-content:center;font-size:1.5rem}
.done .no{display:inline-block;margin:.5rem auto .1rem;background:var(--coffee);color:#FFF7E9;border-radius:1rem;
  padding:.42rem 1.1rem;font-size:1.5rem;font-weight:900;letter-spacing:.02em}
.done p{margin:.4rem 0 0;font-size:.95rem;color:var(--ink2);font-weight:700;line-height:1.45}
.done .list{text-align:left;margin-top:.7rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.6rem .7rem}

<script>
/* ── payload ── */
/* ══════ 와글링 테이블 · 메뉴 데이터 ↔ QR 토큰 (사장님용·손님용 공용 규격) ══════
   · 바이너리 → base64url. 짧게 만들어 QR 한 장에 메뉴가 통째로 들어가게 한다.
   · 형식   'W','T', ver=1, [가게이름], [메뉴 수], 메뉴마다 {분류, 품절, 가격, 이름}
   · 분류   0 = ☕ 따뜻한 / 1 = 🧊 차가운 / 2 = 🍽️ 다른 메뉴  (이름·그림은 앱이 알고 있어 글자로 담지 않는다) */
var WTData = (function(){
  'use strict';
  var AB = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  function utf8(s){
    if(window.TextEncoder) return Array.prototype.slice.call(new TextEncoder().encode(String(s == null ? '' : s)));
    var out = [], i, c;
    s = String(s == null ? '' : s);
    for(i = 0; i < s.length; i++){
      c = s.charCodeAt(i);
      if(c < 0x80) out.push(c);
      else if(c < 0x800){ out.push(0xC0 | (c >> 6), 0x80 | (c & 63)); }
      else { out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    return out;
  }
  function fromUtf8(bytes){
    if(window.TextDecoder) return new TextDecoder().decode(new Uint8Array(bytes));
    var s = '', i;
    for(i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    try { return decodeURIComponent(escape(s)); } catch(e){ return s; }
  }
  function b64(bytes){
    var out = '', i, b0, b1, b2;
    for(i = 0; i < bytes.length; i += 3){
      b0 = bytes[i]; b1 = bytes[i + 1]; b2 = bytes[i + 2];
      out += AB.charAt(b0 >> 2);
      out += AB.charAt(((b0 & 3) << 4) | ((b1 === undefined ? 0 : b1) >> 4));
      if(b1 === undefined) break;
      out += AB.charAt(((b1 & 15) << 2) | ((b2 === undefined ? 0 : b2) >> 6));
      if(b2 === undefined) break;
      out += AB.charAt(b2 & 63);
    }
    return out;
  }
  function unb64(s){
    var by = [], i, c, d, e, f;
    s = String(s || '').replace(/[^A-Za-z0-9\-_]/g, '');
    for(i = 0; i < s.length; i += 4){
      c = AB.indexOf(s.charAt(i)); d = AB.indexOf(s.charAt(i + 1));
      e = AB.indexOf(s.charAt(i + 2)); f = AB.indexOf(s.charAt(i + 3));
      if(c < 0 || d < 0) break;
      by.push((c << 2) | (d >> 4));
      if(e >= 0) by.push(((d & 15) << 4) | (e >> 2));
      if(f >= 0) by.push(((e & 3) << 6) | f);
    }
    return by;
  }
  function vint(out, n){
    n = Math.max(0, Math.round(n) || 0);
    while(n >= 128){ out.push((n & 127) | 128); n = Math.floor(n / 128); }
    out.push(n);
  }
  function rvint(bytes, p){
    var n = 0, sh = 0, b;
    do {
      if(p.i >= bytes.length) throw new Error('short');
      b = bytes[p.i++];
      n += (b & 127) * Math.pow(2, sh);
      sh += 7;
    } while(b & 128);
    return n;
  }
  function enc(data){
    var out = [87, 84, 1], nm, items, i, it, b;
    nm = utf8((data && data.name) || '');
    vint(out, nm.length);
    out = out.concat(nm);
    items = (data && data.items) || [];
    vint(out, items.length);
    for(i = 0; i < items.length; i++){
      it = items[i];
      b = utf8(it.n || '');
      out.push(Math.max(0, Math.min(2, it.c | 0)));
      out.push(it.s ? 1 : 0);
      vint(out, Math.max(0, it.p | 0));
      vint(out, b.length);
      out = out.concat(b);
    }
    return b64(out);
  }
  function dec(token){
    try {
      var bytes = unb64(token), p = { i: 0 };
      if(bytes.length < 5 || bytes[0] !== 87 || bytes[1] !== 84 || bytes[2] !== 1) return null;
      p.i = 3;
      var nameLen = rvint(bytes, p), name = fromUtf8(bytes.slice(p.i, p.i + nameLen));
      p.i += nameLen;
      var n = rvint(bytes, p), items = [], k, c, s, price, nl, nm;
      if(n > 400) return null;
      for(k = 0; k < n; k++){
        c = bytes[p.i++]; s = bytes[p.i++];
        price = rvint(bytes, p);
        nl = rvint(bytes, p);
        nm = fromUtf8(bytes.slice(p.i, p.i + nl));
        p.i += nl;
        items.push({ n: nm, p: price, c: (c > 2 ? 2 : c), s: !!s });
      }
      return { name: name, items: items };
    } catch(e){ return null; }
  }
  return { enc: enc, dec: dec, b64: b64, unb64: unb64, utf8: utf8 };
})();

  /* 머그컵 — 아메리카노·라떼 */

  if(!SOUND || !text) return;

    var ss = window.speechSynthesis;
    if(!ss) return;
    ss.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = LANG === 'en' ? 'en-US' : 'ko-KR';
    u.rate = 0.92;
    u.pitch = 1.02;
    ss.speak(u);
  } catch(e){}
}

function whenText(at){
  if(!at) return t('저장됨', 'saved');
  var d = new Date(at), now = new Date();
  var d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var n0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var day = Math.round((n0 - d0) / 86400000);
  if(day <= 0) return t('오늘 저장', 'saved today');
  if(day === 1) return t('어제 저장', 'saved yesterday');
  if(day < 7) return t(day + '일 전 저장', 'saved ' + day + ' days ago');
  return t((d.getMonth() + 1) + '월 ' + d.getDate() + '일 저장', 'saved ' + (d.getMonth() + 1) + '/' + d.getDate());
}

  $('#addPrice').value = '';
  try { $('#addName').focus(); } catch(e){}
  var card = $('#board .card[data-i="' + idx + '"]');
  if(card && card.scrollIntoView) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  toast(t("'" + nm + "' 메뉴를 넣었어요", "'" + nm + "' added"));
  say(nm);
}
function delMyMenu(i){
  var base = store.items.length;
  if(!(i >= base) || !extra[i - base]) return;
  var item = extra[i - base], k = i - base;
  var backCart = {};
  Object.keys(cart).forEach(function(s){ var n = +s; if(n === i) return; backCart[n > i ? n - 1 : n] = cart[s]; });
  cart = backCart;
  extra.splice(k, 1);
  saveExtra();
  render();
  toast(t("'" + item.n + "' 메뉴를 지웠어요", "'" + item.n + "' removed"), function(){
    extra.splice(k, 0, item);
    saveExtra();
    var re = {};
    Object.keys(cart).forEach(function(s){ var n = +s; re[n >= i ? n + 1 : n] = cart[s]; });
    cart = re;
    render();
    if(sheet === 'cart') renderSheet();
  });
}
/* ── 저장한 가게 — 열기 · 지우기 · 예시 ─────────────── */
function openShop(i){
  var s = shops[i];
  if(!s) return;
  var same = !DEMO && lastToken() === s.tok;
  closeSheet();
  if(same){ render(); return; }
  if(location.hash === '#m=' + s.tok){ store = readStore(); loadExtra(); render(); return; }
  location.hash = '#m=' + s.tok;
}
function delShop(i){
  var s = shops[i];
  if(!s) return;
  var wasLast = lastToken() === s.tok;
  var list = readShops();
  list.splice(i, 1);
  writeShops(list);
  if(!list.length && wasLast){ try { localStorage.removeItem(K_LAST); } catch(e){} }
  renderShops();
  if(sheet === 'shops') renderSheet();
  toast(t("'" + s.name + "' 저장을 지웠어요", "Removed '" + s.name + "'"), function(){
    var l = readShops();
    l.splice(i, 0, s);
    writeShops(l);
    if(wasLast){ try { localStorage.setItem(K_LAST, s.tok); } catch(e){} }
    renderShops();
    if(sheet === 'shops') renderSheet();
  });
}
function showDemo(){
  closeSheet();
  if(location.hash){
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ location.hash = ''; }
  }
  store = readStore(true);
  cart = {};
  persons = 1;
  curCat = 'all';
  loadExtra();
  render();
  try { window.scrollTo(0, 0); } catch(e){}
}

var toastT = null;
function toast(msg, undoFn){
  var el = $('#toast');
  el.className = 'toast';
  if(undoFn){
    el.className = 'toast undo';
    el.innerHTML = '<span>' + esc(msg) + '</span><button type="button" id="undoBtn">' + t('되돌리기', 'Undo') + '</button>';
    el.querySelector('#undoBtn').addEventListener('click', function(ev){
      ev.stopPropagation();
      el.hidden = true; el.className = 'toast';
      clearTimeout(toastT);
      undoFn();
    });
  } else {
    el.textContent = msg;
  }
  el.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.hidden = true; el.className = 'toast'; }, undoFn ? 5000 : 1900);
}

/* ── 설정 저장 ──────────────────────────────────────── */
function loadPrefs(){
  try {
    LANG = localStorage.getItem(K_LANG) === 'en' ? 'en' : 'ko';
    BIG = localStorage.getItem(K_BIG) === '1';
    SOUND = localStorage.getItem(K_SOUND) !== '0';
  } catch(e){}
  document.documentElement.classList.toggle('big', BIG);
  document.documentElement.lang = LANG;
  window.WTLANG = LANG;
}
function savePrefs(){
  try {
    localStorage.setItem(K_LANG, LANG);
    localStorage.setItem(K_BIG, BIG ? '1' : '0');
    localStorage.setItem(K_SOUND, SOUND ? '1' : '0');
  } catch(e){}
}

/* ── 사건 연결 ──────────────────────────────────────── */
function bind(){
  $('#langBtn').addEventListener('click', function(){
    LANG = LANG === 'en' ? 'ko' : 'en';
    document.documentElement.lang = LANG;
    window.WTLANG = LANG;
    savePrefs();
    render();
    WTDay.paint();
    if(sheet !== 'closed') renderSheet();
  });
  $('#bigBtn').addEventListener('click', function(){
    BIG = !BIG;
    document.documentElement.classList.toggle('big', BIG);
    savePrefs();
    renderHead();
  });
  $('#soundBtn').addEventListener('click', function(){
    SOUND = !SOUND;
    savePrefs();
    renderHead();
    if(SOUND) say(t('소리를 켰어요. 메뉴를 눌러 보세요.', 'Reading is on. Tap a menu item.'));
    else stopSay();
  });
  $('#cats').addEventListener('click', function(e){
    var b = e.target.closest('[data-cat]');
    if(!b) return;
    curCat = b.getAttribute('data-cat');
    if(curCat !== 'all') curCat = parseInt(curCat, 10);
    renderCats();
    renderBoard();
  });
  $('#board').addEventListener('click', function(e){
    var m = e.target.closest('[data-m]'), p = e.target.closest('[data-p]'), c = e.target.closest('.card');
    var dl = e.target.closest('[data-del]');
    stopSay();
    if(dl){ e.stopPropagation(); delMyMenu(parseInt(dl.getAttribute('data-del'), 10)); return; }
    if(p){ e.stopPropagation(); addQty(parseInt(p.getAttribute('data-p'), 10), 1); return; }
    if(m){ e.stopPropagation(); addQty(parseInt(m.getAttribute('data-m'), 10), -1); return; }
    if(c) addQty(parseInt(c.getAttribute('data-i'), 10), 1);
  });
  $('#board').addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var c = e.target.closest('.card');
    if(!c) return;
    e.preventDefault();
    addQty(parseInt(c.getAttribute('data-i'), 10), 1);
  });
  $('#bsGo').addEventListener('click', function(){ if(count()) openSheet('cart'); });
  $('#sheetBody').addEventListener('click', function(e){
    var op = e.target.closest('[data-shopopen]'), sd = e.target.closest('[data-shopdel]');
    if(op){ openShop(parseInt(op.getAttribute('data-shopopen'), 10)); return; }
    if(sd){ delShop(parseInt(sd.getAttribute('data-shopdel'), 10)); return; }
    if(e.target.closest('#demoGo')){ showDemo(); return; }
    var q = e.target.closest('[data-qs]'), pe = e.target.closest('[data-pers]'), cl = e.target.closest('[data-close]');
    if(q){
      var i = parseInt(q.getAttribute('data-qs'), 10), d = parseInt(q.getAttribute('data-d'), 10);
      var nv = (cart[i] || 0) + d;
      if(nv <= 0) delete cart[i]; else cart[i] = nv;
      renderSheet(); renderBasket(); updateCard(i);
      return;
    }
    if(pe){
      persons = Math.max(1, Math.min(20, persons + parseInt(pe.getAttribute('data-pers'), 10)));
      renderSheet();
      return;
    }
    if(cl){ closeSheet(); return; }
    if(e.target.closest('#orderGo')){ placeOrder(); return; }
    if(e.target.closest('#newOrder')){ closeSheet(); }
    if(e.target.closest('#orderRead')){
      var n = count(), sum = total(), per = Math.ceil(sum / Math.max(1, persons)), list = allItems();
      var txt = t('주문서입니다. ', 'Your order. ');
      if(tblNo) txt += t('테이블 ' + tblNo + '번. ', 'Table ' + tblNo + '. ');
      Object.keys(cart).filter(function(k){ return cart[k] > 0; }).forEach(function(k){
        var it = list[k];
        if(it) txt += it.n + ' ' + cart[k] + t('개, ', ', ') ;
      });
      txt += t('합계 ' + money(sum) + '입니다. ' + persons + '명이서 나누면 1인당 ' + money(per) + '입니다.',
               'Total ' + money(sum) + '. Split ' + persons + ' ways, ' + money(per) + ' each.');
      if(reqTxt.trim()) txt += t(' 요청사항은 ' + reqTxt.trim() + '입니다.', ' Requests: ' + reqTxt.trim() + '.');
      say(txt);
    }
  });
  $('#sheetBody').addEventListener('input', function(e){
    if(e.target.id === 'tblNo'){
      var v = String(e.target.value || '').replace(/[^0-9]/g, '').slice(0, 3);
      if(v !== e.target.value) e.target.value = v;
      tblNo = v;
    } else if(e.target.id === 'reqTxt'){
      reqTxt = String(e.target.value || '').slice(0, 60);
    }
  });
  $('#shopBar').addEventListener('click', function(){ openSheet('shops'); });
  $('#addToggle').addEventListener('click', function(){ toggleAdd(); });
  $('#addGo').addEventListener('click', addMyMenu);
  $('#addForm').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); addMyMenu(); }
  });
  $('#addPrice').addEventListener('input', function(e){
    var v = String(e.target.value || '').replace(/[^0-9]/g, '').slice(0, 7);
    if(v !== e.target.value) e.target.value = v;
  });
  $('#mineWrap').addEventListener('click', function(e){
    var b = e.target.closest('[data-del]');
    if(!b) return;
    delMyMenu(parseInt(b.getAttribute('data-del'), 10));
  });
  $('#scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && sheet !== 'closed') closeSheet();
  });
  window.addEventListener('hashchange', function(){
    store = readStore();
    loadExtra();
    cart = {};
    persons = 1;
    curCat = 'all';
    render();
  });
}

/* ── 시작 ───────────────────────────────────────────── */
loadPrefs();
shops = readShops();
store = readStore();
loadExtra();
bind();
render();
WTDay.init();
if(DEMO){
  /* 예시 메뉴판 — 사장님 QR로 열면 사라진다 */
  setTimeout(function(){ toast(t('예시 메뉴판이에요 · QR을 찍으면 우리 가게 메뉴가 나와요', 'Sample menu · scan your shop QR for your own menu')); }, 700);
}
})();

</script>
