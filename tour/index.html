<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />

<meta name="mobile-web-app-capable" content="yes" />

<meta name="description" content="외국인·내국인을 위한 한국 관광 가이드 — 서울·부산·경주·제주·전주·김해·안동·강릉 명소 30곳, 가는 법·입장료·먹거리·큰 글씨 한국어 카드. 내가 찍은 사진으로 채우는 여행 도감과 인쇄용 여행 앨범. 설치 없이 무료, 오프라인에서도 열립니다." />
<title>와글링 한국여행 · Wagling Korea Travel</title>
<style>
:root{
  --bg:#FFF9F0; --card:#FFFFFF; --ink:#221A12; --ink2:#5E4B3A; --line:#E9DAC2;
  --brand:#0F4C42; --brand2:#0A3A32; --gold:#C8912B; --red:#B4342A;
  --soft:#F5EEDF; --shadow:0 2px 10px rgba(80,55,30,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:19px;-webkit-text-size-adjust:100%}
@media (min-width:390px){ html{font-size:20px} }
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Noto Sans","Noto Sans CJK KR","Noto Sans KR","Liberation Sans","DejaVu Sans","FreeSans",Arial,Helvetica,sans-serif;
  padding-bottom:calc(4.6rem + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none;font-size:inherit}
a{color:inherit}
img,svg{display:block}
[hidden]{display:none !important}
h1,h2,h3,p{margin:0}
.wrap{max-width:620px;margin:0 auto}

/* ── 상단 ── */
.top{background:linear-gradient(180deg,#FFF3DF 0%,#FFF9F0 100%);border-bottom:1px solid var(--line);
  padding:.5rem .7rem .55rem;position:relative;z-index:5}
.hrow{display:flex;align-items:center;gap:.42rem}
.logo{font-size:1.62rem;line-height:1;flex:0 0 auto}
.hrow h1{font-size:1.1rem;font-weight:900;letter-spacing:-.01em;line-height:1.34;padding-block:.06rem;
  flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-lang="en"] .hrow h1{font-size:.99rem}
.pill{display:flex;align-items:center;gap:.18rem;background:#fff;border:2px solid #DCC9A8;color:#3E2E1E;
  border-radius:2rem;padding:.22rem .52rem;font-size:.84rem;font-weight:900;min-height:2.3rem;white-space:nowrap;flex:0 0 auto}
.pill:active{transform:translateY(1px)}
.pill.inst{background:linear-gradient(180deg,#FFD873,#EFB03A);border-color:#A9690A;color:#3B2A1E}
.globe{font-size:.95rem}
.pill .sl{opacity:.45;font-weight:800}
.pill .lg{opacity:.38}
.pill .lg.on{opacity:1}
.hsub{display:flex;align-items:flex-end;gap:.4rem;margin-top:.34rem}
.tag{font-size:.78rem;color:var(--ink2);font-weight:700;line-height:1.4;flex:1 1 auto;min-width:0;word-break:keep-all}
.tools{display:flex;gap:.3rem;flex:0 0 auto}

/* ── 소개 ── */
.intro{margin:.62rem .7rem 0;background:#fff;border:2px solid var(--line);border-radius:1rem;
  padding:.6rem .7rem;font-size:.9rem;line-height:1.5;color:#3A2C1F;box-shadow:var(--shadow)}
.intro b{font-weight:900}

/* ── 지역 칩 ── */
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin:.62rem .7rem 0}
.chip{display:flex;align-items:center;justify-content:center;gap:.22rem;min-width:0;width:100%;
  background:#fff;border:2px solid #E4D3B8;border-radius:.8rem;padding:.42rem .2rem;font-size:.9rem;
  font-weight:900;color:#413122;min-height:2.9rem;line-height:1.2;box-shadow:0 1px 3px rgba(90,60,35,.06)}
.chip .ic{font-size:1rem;line-height:1}
.chip .cn{min-width:0;font-size:.94rem;line-height:1.34;font-weight:900;text-align:left;word-break:keep-all;overflow:hidden;text-overflow:ellipsis}
.chip .cn{padding-block:.06rem}
.chip .ct{font-size:.72rem;font-weight:900;color:#8C6A3D;flex:0 0 auto}
.chip.on{background:var(--brand);border-color:var(--brand2);color:#fff;box-shadow:0 3px 9px rgba(15,76,66,.28)}
.chip.on .ct{color:#FFE6AE}
body[data-lang="en"] .chip .ic{display:none}
body[data-lang="en"] .chip .cn{font-size:.86rem;letter-spacing:-.01em}
@media (max-width:359px){
  .chips{gap:.3rem;margin-left:.55rem;margin-right:.55rem}
  .chip{padding:.36rem .16rem;min-height:2.7rem}
  .chip .ic{display:none}
  .chip .cn{font-size:.84rem;text-align:center}
  body[data-lang="en"] .chip .cn{font-size:.82rem}
}

/* ── 목록 ── */
.secbar{display:flex;align-items:baseline;gap:.4rem;margin:.85rem .7rem .5rem}
.secbar h2{font-size:1.06rem;font-weight:900}
.secbar .cnt{font-size:.82rem;font-weight:900;color:#7A5C33;background:#F6EAD3;border-radius:.6rem;padding:.1rem .42rem}
.list{padding:0 .7rem}
.spot{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
  border-radius:1.1rem;overflow:hidden;margin-bottom:.7rem;box-shadow:var(--shadow)}
.spot:active{transform:translateY(1px)}
.illwrap{position:relative;background:linear-gradient(180deg,#FBF4E5,#F5EAD5)}

/* ── 내 사진 자리(여행 우표 틀) ── */
.shot{position:relative;padding:.55rem .55rem .12rem;background:#FFFDF7;border:1px solid #F2E4CB;
  border-radius:.5rem;box-shadow:0 1px 3px rgba(90,60,35,.07)}
.shot .cnr{position:absolute;width:.62rem;height:.62rem;border:2px solid #DCC9A8;pointer-events:none;border-radius:1px}
.shot .cnr.tl{left:.16rem;top:.16rem;border-right:0;border-bottom:0}
.shot .cnr.tr{right:.16rem;top:.16rem;border-left:0;border-bottom:0}
.shot .cnr.bl{left:.16rem;bottom:.16rem;border-right:0;border-top:0}
.shot .cnr.br{right:.16rem;bottom:.16rem;border-left:0;border-top:0}
.shot .phwrap{position:relative;display:block;width:100%;aspect-ratio:640/380;border-radius:.32rem;overflow:hidden;background:#FBF1DE;margin:0;padding:0;border:0;font:inherit;color:inherit;text-align:center}
.shot .phwrap::after{content:"";position:absolute;inset:0;border-radius:.32rem;pointer-events:none;
  box-shadow:inset 0 0 0 3px #FFFDF7, inset 0 0 0 4px #EBDCBE}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .phwrap.empty{border:2.5px dashed #D9C39C;background:linear-gradient(180deg,#FFFDF6,#F9EEDA);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.26rem;padding:.4rem}
.shot .cam{font-size:1.75rem;line-height:1;opacity:.9}
.shot .et{font-size:.82rem;font-weight:900;color:#8A6A3F;line-height:1.36;text-align:center;word-break:keep-all;padding:0 .6rem}
.shot .eb{display:inline-flex;align-items:center;gap:.2rem;margin-top:.12rem;font-size:.8rem;font-weight:900;color:#0F4C42;
  background:#EAF3EE;border:1.5px solid #BFDBD0;border-radius:2rem;padding:.22rem .62rem;min-height:2rem}
.shot .cap{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.26rem .1rem 0;
  font-size:.66rem;font-weight:900;letter-spacing:.05em;color:#A98B5C;line-height:1.3}
.shot .cap .rgc{color:#8A6A3F}

/* 내 사진 개수 · 인쇄 */
.pcount{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.14rem .45rem;margin:.5rem .7rem 0;
  background:#fff;border:2px solid #EFDFC2;border-radius:.9rem;padding:.32rem .4rem .34rem .6rem;
  font-size:.84rem;font-weight:900;color:#5C4526;box-shadow:var(--shadow)}
.pcount .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pcount .lb b{color:var(--brand);font-size:.95rem}
.pcount .bar{grid-row:2;grid-column:1 / -1;height:.3rem;border-radius:1rem;background:#F2E6CE;overflow:hidden}
.pcount .pbtn{grid-row:1;grid-column:2}
@media (max-width:389px){
  .pcount{font-size:.76rem;padding-left:.48rem}
  .pcount .lb b{font-size:.88rem}
  .pcount .pbtn{padding:.24rem .42rem;font-size:.76rem}
  .pcount .pbtn .pb-tx{display:none}
}
/* 좁은 폰(390~429px)에서 사진 수 줄이 '…'으로 잘리지 않게 글씨만 살짝 줄인다 */
@media (max-width:429px){
  .pcount .lb{font-size:.78rem}
  .pcount .lb b{font-size:.9rem}
}
.pcount .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E7B44C,#0F4C42);border-radius:1rem;transition:width .3s}
.pcount .pbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:.2rem;background:#F4F9F6;border:1.5px solid #C6DED3;
  color:#10493B;border-radius:.7rem;padding:.28rem .5rem;font-size:.8rem;font-weight:900;min-height:2.2rem}

/* 상세 사진 버튼 */
.phacts{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.phbtn{flex:1 1 8rem;display:flex;align-items:center;justify-content:center;gap:.3rem;background:#fff;border:2px solid #DCC9A8;
  border-radius:.8rem;padding:.45rem .5rem;font-size:.9rem;font-weight:900;min-height:2.9rem;color:#3E2E1E}
.phbtn.del{background:#FFF6F2;border-color:#EDCFC0;color:#8A3B24;flex:0 1 auto}
.rg{position:absolute;left:.5rem;top:.5rem;background:rgba(255,255,255,.94);color:#173D34;
  font-size:.78rem;font-weight:900;padding:.18rem .5rem;border-radius:1rem;border:1px solid rgba(0,0,0,.05)}
.heart{position:absolute;right:.45rem;top:.45rem;width:2.9rem;height:2.9rem;border-radius:50%;
  background:rgba(255,255,255,.95);border:2px solid #EADCC6;display:grid;place-items:center;
  font-size:1.35rem;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.10)}
.heart.on{background:#FFEFF0;border-color:#F0B6BA}
.sbody{padding:.6rem .72rem .72rem}
.nm{font-size:1.16rem;font-weight:900;line-height:1.28;letter-spacing:-.01em}
.nm .en{display:block;font-size:.84rem;font-weight:700;color:#6B5847;margin-top:.12rem;letter-spacing:0}
.charm{font-size:1rem;line-height:1.5;margin-top:.34rem;color:#332519;word-break:keep-all}
.tr{font-size:.88rem;line-height:1.45;color:#2F5449;background:#EDF5F1;border-radius:.6rem;
  padding:.4rem .52rem;margin-top:.45rem;word-break:keep-all;
  overflow:visible;display:block;-webkit-line-clamp:none;max-height:none}
.chips2{display:flex;flex-wrap:wrap;gap:.32rem;margin-top:.5rem}
.tag2{font-size:.8rem;font-weight:800;border-radius:.55rem;padding:.2rem .46rem;background:#F7EEDD;
  color:#5A4429;border:1px solid #E7D6BA;text-decoration:none;white-space:nowrap}
.tag2.map{background:#E6F1EC;color:#10493B;border-color:#C3DDD2}
.tag2.more{background:#FFF;color:#7A5C33;border-color:#E7D6BA}

/* ── 상세 ── */
.detail{padding:0 .7rem}
.dhead{display:flex;align-items:center;gap:.5rem;margin:.6rem 0 .5rem}
.dback{display:flex;align-items:center;gap:.3rem;background:#fff;border:2px solid #E4D3B8;border-radius:2rem;
  padding:.3rem .7rem;font-size:.9rem;font-weight:900;min-height:2.6rem;color:#413122}
.dhead .rg2{margin-left:auto;font-size:.82rem;font-weight:900;color:#2F5449;background:#E6F1EC;
  border:1px solid #C3DDD2;border-radius:1rem;padding:.16rem .55rem;white-space:nowrap}
.dhero{position:relative;border-radius:1.1rem;overflow:hidden;box-shadow:var(--shadow)}
.dtitle{font-size:1.42rem;font-weight:900;line-height:1.25;margin-top:.7rem;letter-spacing:-.015em;word-break:keep-all}
.dtitle .en{display:block;font-size:.92rem;font-weight:700;color:#6B5847;margin-top:.14rem;letter-spacing:0}
.dcharm{font-size:1.02rem;line-height:1.55;margin-top:.4rem;color:#302215;word-break:keep-all}

/* 큰 글씨 한국어 손짓 카드 */
.taxi{margin-top:.8rem;background:linear-gradient(160deg,#0F4C42,#18695B);color:#fff;border-radius:1.1rem;
  padding:.8rem .85rem .85rem;box-shadow:0 6px 18px rgba(15,76,66,.26)}
.taxi .lb{font-size:.85rem;font-weight:800;opacity:.94;line-height:1.4}
.taxi .big{font-size:1.72rem;font-weight:900;line-height:1.22;margin:.3rem 0 .1rem;
  word-break:keep-all;letter-spacing:-.015em}
.taxi .say{font-size:1.2rem;font-weight:900;color:#FFE39B;line-height:1.35;word-break:keep-all}
.taxi .trow{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.tbtn{display:flex;align-items:center;gap:.28rem;background:#fff;color:#0F4C42;border-radius:2rem;
  padding:.34rem .72rem;font-size:.88rem;font-weight:900;min-height:2.6rem}

.maps{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:.7rem}
.mbtn{display:flex;align-items:center;justify-content:center;gap:.3rem;background:#fff;border:2px solid #DCC9A8;
  border-radius:.8rem;padding:.5rem .3rem;font-size:.9rem;font-weight:900;min-height:3rem;color:#3E2E1E;text-decoration:none}
.mbtn.g{background:#EAF3EC;border-color:#C6DED3;color:#10493B}
.mbtn.n{background:#EAF0FA;border-color:#C7D6F0;color:#1B3F7A}

.rows{margin-top:.85rem;background:#fff;border:2px solid var(--line);border-radius:1.05rem;padding:.2rem .8rem}
.row{padding:.62rem 0;border-bottom:1px solid #F1E6D2}
.row:last-child{border-bottom:0}
.row .k{font-size:.83rem;font-weight:900;color:#2F5449;letter-spacing:.01em}
.row .v{font-size:1rem;line-height:1.55;margin-top:.16rem;color:#2A1E14;word-break:keep-all}

.memo{margin-top:.85rem;background:#fff;border:2px solid var(--line);border-radius:1.05rem;padding:.7rem .8rem}
.memo .k{font-size:.92rem;font-weight:900}
.memo textarea{width:100%;min-height:5.2rem;margin-top:.45rem;border:2px solid #EADBC4;border-radius:.75rem;
  padding:.55rem .6rem;font-family:inherit;font-size:.98rem;line-height:1.5;color:#2A1E14;background:#FFFDF8;resize:vertical}
.memo .hint{font-size:.78rem;color:#7A6349;margin-top:.34rem;min-height:1.1rem}

.dfoot{display:flex;gap:.45rem;margin:.8rem 0 .4rem;flex-wrap:wrap}
.bigbtn{flex:1 1 12rem;display:flex;align-items:center;justify-content:center;gap:.35rem;background:var(--brand);
  color:#fff;border-radius:.9rem;padding:.75rem .8rem;font-size:1rem;font-weight:900;min-height:3.3rem}

/* ── 찜 화면 ── */
.empty{margin:.9rem .7rem;background:#fff;border:2px dashed #E0CDB0;border-radius:1rem;padding:1.1rem .9rem;
  text-align:center;font-size:.95rem;line-height:1.6;color:#5E4B3A}
.favrow{display:flex;gap:.6rem;background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.55rem;
  margin-bottom:.6rem;align-items:center;width:100%;text-align:left}
.favrow .th{width:5.2rem;height:3.9rem;border-radius:.7rem;overflow:hidden;flex:0 0 auto;background:#F7EEDD;
  display:grid;place-items:center;border:1.5px dashed #E0CDB0}
.favrow .th img{width:100%;height:100%;object-fit:cover;border:0}
.favrow .th .thnone{font-size:1.45rem;opacity:.55;line-height:1}
.favrow .fx{flex:1 1 auto;min-width:0}
.favrow .fn{display:block;font-size:1rem;font-weight:900;line-height:1.3}
.favrow .fr{display:block;font-size:.8rem;color:#2F5449;font-weight:800;margin-top:.12rem}
.favrow .fm{display:block;font-size:.86rem;color:#6B5847;margin-top:.24rem;word-break:keep-all;
  display:block;-webkit-line-clamp:none;overflow:visible}
.favrow .x{flex:0 0 auto;background:#F7EEDD;border:1px solid #E7D6BA;border-radius:.6rem;padding:.3rem .5rem;font-size:.86rem;font-weight:900}

/* ── 손짓 카드 ── */
.pc{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:#fff;border:2px solid #E9DAC2;
  border-radius:1rem;padding:.62rem .66rem;margin-bottom:.55rem;box-shadow:0 1px 5px rgba(90,60,35,.07)}
.pc:active{transform:translateY(1px)}
.pc .ic{font-size:1.5rem;width:2.95rem;height:2.95rem;flex:0 0 auto;display:grid;place-items:center;
  background:#F3EBDC;border-radius:.8rem;line-height:1}
.pc .tx{flex:1 1 auto;min-width:0}
.pc .ko{display:block;font-size:1.28rem;font-weight:900;line-height:1.3;letter-spacing:-.01em;word-break:keep-all}
.pc .en{display:block;font-size:.84rem;color:#6B5847;margin-top:.14rem;line-height:1.35}
.pc .sp{flex:0 0 auto;font-size:1.15rem;width:2.7rem;height:2.7rem;display:grid;place-items:center;
  background:#EAF3EE;border-radius:50%}

/* ── 큰 카드(전체 화면) ── */
.bigcard{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column;
  padding:calc(.7rem + env(safe-area-inset-top)) .8rem calc(.8rem + env(safe-area-inset-bottom))}
.bigcard .bx{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.bigcard .bt{font-size:.9rem;font-weight:900;color:#2F5449}
.bigcard .cl{background:#F1E7D5;border-radius:2rem;padding:.34rem .8rem;font-size:.9rem;font-weight:900;min-height:2.6rem}
.bigcard .mid{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;text-align:center;padding:.4rem 0}
.bigcard .iko{font-size:2.6rem;line-height:1}
.bigcard .bko{font-size:clamp(2rem,10.5vw,3.2rem);font-weight:900;line-height:1.22;letter-spacing:-.02em;color:#120C07;word-break:keep-all}
.bigcard .ben{font-size:1.02rem;color:#4A3A2A;line-height:1.4;word-break:keep-all}
.bigcard .brm{font-size:.86rem;color:#7A6349;font-style:italic}
.bigcard .bact{display:flex;flex-direction:column;gap:.5rem}
.bigcard .spk{display:flex;align-items:center;justify-content:center;gap:.4rem;background:var(--brand);color:#fff;
  border-radius:1rem;padding:.85rem;font-size:1.05rem;font-weight:900;min-height:3.4rem}
.bigcard .tip{font-size:.8rem;color:#6B5847;text-align:center;line-height:1.4}

/* ── 하단 탭 ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#FFFDF7;
  border-top:2px solid #E9DAC2;padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:flex;width:100%;max-width:620px;margin:0 auto}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;
  padding:.4rem .1rem .38rem;font-size:.76rem;font-weight:900;color:#7A6349;min-height:3.5rem;position:relative}
.tab .ti{font-size:1.35rem;line-height:1}
.tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);background:#F4F9F6}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--brand);border-radius:0 0 3px 3px}
.tab .badge{position:absolute;top:.25rem;right:calc(50% - 1.5rem);background:var(--red);color:#fff;font-size:.66rem;
  font-weight:900;border-radius:1rem;padding:.04rem .3rem;line-height:1.4}

/* ── 설치 모달 · 토스트 ── */
.modal{position:fixed;inset:0;z-index:70;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;border-radius:1.2rem 1.2rem 0 0;padding:1rem .9rem calc(1.1rem + env(safe-area-inset-bottom));

var LS_FAV='wagle-korea-travel:favs', LS_NOTE='wagle-korea-travel:notes', LS_LANG='wagle-korea-travel:lang', LS_PHOTO='wagle-korea-travel:photos';
function lsGet(k, d){ try{ var v=localStorage.getItem(k); return v? JSON.parse(v): d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function detectLang(){
  var saved = lsGet(LS_LANG, null);
  if(saved === 'ko' || saved === 'en') return saved;
  var n = (navigator.language || 'ko').toLowerCase();
  return n.indexOf('ko') === 0 ? 'ko' : 'en';
}
var lang = detectLang(), li = lang === 'ko' ? 0 : 1;
var favs = lsGet(LS_FAV, []); if(!Array.isArray(favs)) favs = [];
var notes = lsGet(LS_NOTE, {}); if(!notes || typeof notes !== 'object') notes = {};
var photos = lsGet(LS_PHOTO, {}); if(!photos || typeof photos !== 'object' || Object.prototype.toString.call(photos) === '[object Array]') photos = {};
var st = {tab:'list', rg:'all', id:null};
var listScroll = 0;

function t(k){ return (T[lang] && T[lang][k] !== undefined) ? T[lang][k] : (T.ko[k] || ''); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function spotById(id){ for(var i=0;i<SPOTS.length;i++){ if(SPOTS[i].id===id) return SPOTS[i]; } return null; }
function regionById(id){ for(var i=0;i<REGIONS.length;i++){ if(REGIONS[i].id===id) return REGIONS[i]; } return REGIONS[0]; }
function isFav(id){ return favs.indexOf(id) >= 0; }
function $(s){ return document.querySelector(s); }
function toast(msg, actLabel, actFn){
  var el=$('#toast'); if(!el) return;
  el.textContent = msg;
  if(actLabel && actFn){
    var b=document.createElement('button'); b.type='button'; b.className='tundo'; b.textContent=actLabel;
    b.addEventListener('click', function(e){ e.stopPropagation(); el.hidden=true; actFn(); });
    el.appendChild(b);
  }
  el.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.hidden=true; }, actLabel ? 4200 : 1900);
}

function photoN(){ var n=0, k; for(k in photos){ if(photos[k]) n++; } return n; }
function noteN(){ var n=0, k; for(k in notes){ if(notes[k] && String(notes[k]).replace(/\s/g,'')) n++; } return n; }

/* 사진 고르기 → 720×428 JPEG로 줄여 저장 */
var photoInput = null;
function openPhotoPicker(id){
  photoTarget = id;
  if(!photoInput){
    photoInput = document.createElement('input');
    photoInput.type = 'file'; photoInput.accept = 'image/*';
    photoInput.setAttribute('aria-label', t('shotPick'));
    photoInput.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
    photoInput.addEventListener('change', onPhotoChosen);
    document.body.appendChild(photoInput);
  }
  try{ photoInput.value = ''; }catch(e){}
  photoInput.click();
}
function onPhotoChosen(){
  var f = photoInput && photoInput.files && photoInput.files[0];
  var id = photoTarget; photoTarget = null;
  if(!f || !id) return;
  if(f.type && f.type.indexOf('image/') !== 0){ toast(t('photoErr')); return; }
  compressPhoto(f, function(dataUrl){
    if(!dataUrl){ toast(t('photoErr')); return; }
    var before = photos[id];
    photos[id] = dataUrl;
    if(!lsSave(LS_PHOTO, photos)){
      if(before) photos[id] = before; else delete photos[id];
      toast(t('photoFull')); renderAll(); return;
    }
    lastDel = null;
    renderAll();
    toast(t('photoSaved'));
  });
}
function compressPhoto(file, cb){
  var url = null, done = false;
  function finish(v){ if(done) return; done = true; try{ if(url) URL.revokeObjectURL(url); }catch(e){} cb(v); }
  try{ url = URL.createObjectURL(file); }catch(e){ finish(null); return; }
  var img = new Image();
  img.onload = function(){
    try{
      var TW = 720, TH = 428;
      var c = document.createElement('canvas'); c.width = TW; c.height = TH;
      var ctx = c.getContext('2d');
      var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      if(!iw || !ih) { finish(null); return; }
      var tr = TW / TH, sr = iw / ih, sw, sh, sx, sy;
      if(sr > tr){ sh = ih; sw = Math.round(ih * tr); sx = Math.round((iw - sw) / 2); sy = 0; }
      else { sw = iw; sh = Math.round(iw / tr); sx = 0; sy = Math.round((ih - sh) * 0.42); }
      if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, TW, TH);
      finish(c.toDataURL('image/jpeg', 0.78));
    }catch(e){ finish(null); }
  };
  img.onerror = function(){ finish(null); };
  img.src = url;
}
function delPhoto(id){
  var before = photos[id]; if(!before) return;
  delete photos[id];
  if(!lsSave(LS_PHOTO, photos)){ photos[id] = before; toast(t('photoFull')); return; }
  lastDel = { id: id, data: before };
  renderAll();
  toast(t('photoDeleted'), t('photoUndo'), undoDel);
}
function undoDel(){
  if(!lastDel) return;
  var d = lastDel; lastDel = null;
  photos[d.id] = d.data;
  if(!lsSave(LS_PHOTO, photos)){ delete photos[d.id]; toast(t('photoFull')); renderAll(); return; }
  renderAll(); toast(t('photoSaved'));
}

        + '<p class="k">📝 ' + (lang === 'ko' ? '나의 여행 메모' : 'My travel notes') + '</p>'
        + (hasNote(sp.id) ? '<p class="v">' + esc(note) + '</p>'

      + '<p class="pb-num">' + (idx+1) + ' / ' + total + '</p>'
      + '</section>';
  });

  html += '<section class="pb pb-end">' + pbHoles()

    + '</section>';
  box.innerHTML = html;
}
function printAlbum(){
  buildPrintBook();
  if(photoN() === 0 && noteN() === 0) toast(t('printAll'));
  var imgs = Array.prototype.slice.call(document.querySelectorAll('#printBook img'));
  var left = imgs.length, fired = false;
  function fire(){ if(fired) return; fired = true; try{ window.print(); }catch(e){} }
  if(!left) { setTimeout(fire, 40); return; }
  imgs.forEach(function(im){
    function one(){ if(--left <= 0) fire(); }
    if(im.complete) one(); else { im.onload = one; im.onerror = one; }
  });
  setTimeout(fire, 1800);
}

      + (note ? '<span class="fm">📝 '+esc(note)+'</span>' : '')
      + '</span>'
      + '<button type="button" class="x" data-heart="'+s.id+'" aria-label="'+esc(t('delFav'))+'">✕</button>'
      + '</div>';
  });
  $('#favList').innerHTML = html;
}

function renderPhrases(){
  var html = '';
  PHRASES.forEach(function(p, i){
    html += '<button type="button" class="pc" data-ph="'+i+'">'
      + '<span class="ic" aria-hidden="true">'+p.ic+'</span>'
      + '<span class="tx"><span class="ko">'+esc(p.ko)+'</span><span class="en">'+esc(p.en)+'</span>'
      + '<span class="en" style="color:#8A7357;font-style:italic">'+esc(p.rom)+'</span></span>'
      + '<span class="sp" aria-hidden="true">🔊</span></button>';
  });
  $('#phraseList').innerHTML = html;
}

function renderDetail(){
  var s = spotById(st.id);
  if(!s){ st.tab='list'; st.id=null; renderAll(); return; }
  var r = regionById(s.rg), fav = isFav(s.id);
  var note = notes[s.id] || '';
  var html = ''
    + '<div class="dhead"><button type="button" class="dback" data-act="back">← '+t('back')+'</button>'
    + '<span class="rg2">'+r.ic+' '+esc(r[lang])+'</span></div>'
    + '<div class="dhero">'+frameHTML(s)
    + '<button type="button" class="heart'+(fav?' on':'')+'" data-heart="'+s.id+'" aria-pressed="'+fav+'" aria-label="❤️">'+(fav?'❤️':'🤍')+'</button></div>'
    + photoActionsHTML(s)
    + '<h2 class="dtitle">'+esc(s.nm[li])+(li===1?'':'<span class="en">'+esc(s.nm[1])+'</span>')+'</h2>'
    + '<p class="dcharm">'+esc(s.charm[li])+'</p>'
    + '<div class="taxi"><p class="lb">'+t('taxiLbl')+'</p>'
    +   '<p class="big" lang="ko">'+esc(s.nm[0])+'</p>'
    +   '<p class="say" lang="ko">여기 가 주세요</p>'
    +   '<div class="trow"><button type="button" class="tbtn" data-speak="'+esc(s.nm[0])+', 여기 가 주세요">🔊 '+t('speak')+'</button></div></div>'
    + '<div class="maps"><a class="mbtn g" href="'+gmap(s)+'" target="_blank" rel="noopener">🗺️ '+t('mapG')+'</a>'
    +   '<a class="mbtn n" href="'+nmap(s)+'" target="_blank" rel="noopener">🧭 '+t('mapN')+'</a></div>'
    + '<div class="rows">'
    +   row(t('howto'), s.tr[li]) + row(t('best'), s.tm[li]) + row(t('fee'), s.fee[li])
    +   row(t('closed'), s.cl[li]) + row(t('eat'), s.eat[li])
    + '</div>'
    + '<div class="memo"><p class="k">'+t('memo')+'</p>'
    +   '<textarea id="memoBox" placeholder="'+esc(t('memoPh'))+'" aria-label="'+esc(t('memo'))+'">'+esc(note)+'</textarea>'
    +   '<p class="hint" id="memoHint">'+t('memoHint')+'</p></div>'
    + '<div class="dfoot"><button type="button" class="bigbtn" data-tab="card">💬 '+t('bigMore')+'</button></div>';
  $('#detail').innerHTML = html;
}
function row(k, v){ return '<div class="row"><p class="k">'+k+'</p><p class="v">'+esc(v)+'</p></div>'; }

function renderTabs(){
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    var on = tabs[i].getAttribute('data-tab') === st.tab;
    tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
  }
}

function renderAll(){
  renderHeader();
  var isSpot = !!st.id && st.tab === 'list';
  $('#view-list').hidden = !(st.tab === 'list' && !isSpot);
  $('#view-fav').hidden = !(st.tab === 'fav' && !isSpot);
  $('#view-card').hidden = !(st.tab === 'card' && !isSpot);
  $('#view-spot').hidden = !isSpot;
  renderTabs();
  if(st.tab === 'list' && !isSpot) { renderChips(); renderList(); }
  if(st.tab === 'fav') renderFav();
  if(st.tab === 'card') renderPhrases();
  if(isSpot) renderDetail();
}

/* ══════════ 뒤로가기 · 이동 ══════════ */
function code(){ return JSON.stringify(st); }
function pushState(){ try{ history.pushState({wg:1, st:code()}, '', location.href); }catch(e){} }
function replaceState(){ try{ history.replaceState({wg:1, st:code()}, '', location.href); }catch(e){} }
function nav(patch){
  if(st.tab === 'list' && !st.id) listScroll = window.scrollY || 0;
  Object.assign(st, patch);
  renderAll(); pushState();
  if(st.id || st.tab !== 'list'){ window.scrollTo(0, 0); }
}
function goBack(){ try{ history.back(); }catch(e){ st.id = null; renderAll(); } }
window.addEventListener('popstate', function(ev){
  var raw = ev.state && ev.state.st;
  var prev = st;
  hideBig();  /* 큰 카드는 겹쳐 띄우는 화면이라 뒤로가기에서 늘 닫는다 */
  if(raw){ try{ st = JSON.parse(raw); }catch(e){ st = {tab:'list', rg:'all', id:null}; } }
  else { st = {tab:'list', rg:'all', id:null}; }
  renderAll();
  if(prev.id && !st.id && st.tab === 'list'){ setTimeout(function(){ window.scrollTo(0, listScroll || 0); }, 0); }
  else window.scrollTo(0, 0);
});

/* ══════════ 소리(TTS) ══════════ */
function speak(text){
  try{
    if(!('speechSynthesis' in window)) { toast(lang==='ko'?'이 브라우저는 소리를 지원하지 않아요.':'This browser has no speech.'); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = .92; u.pitch = 1;
    var v = window.speechSynthesis.getVoices().filter(function(x){ return (x.lang||'').toLowerCase().indexOf('ko') === 0; })[0];
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ══════════ 큰 카드 ══════════ */
var bigIdx = -1;
function openBig(i){
  var p = PHRASES[i]; if(!p) return;
  bigIdx = i;
  $('#bcIcon').textContent = p.ic;
  $('#bcKo').textContent = p.ko;
  $('#bcEn').textContent = p.en;
  $('#bcRom').textContent = p.rom;
  $('#bcTip').textContent = p.tip[li];
  $('#bcSpeakLbl').textContent = t('sayLbl');
  $('#bcClose').textContent = t('close');
  $('#bigCard').hidden = false;
  document.body.style.overflow = 'hidden';
  pushState();
}
function closeBig(){
  if(!$('#bigCard').hidden){
    goBack();
    setTimeout(function(){ if(!$('#bigCard').hidden) hideBig(); }, 260);
    return;
  }
  hideBig();
}
function hideBig(){ $('#bigCard').hidden = true; document.body.style.overflow = ''; bigIdx = -1; }

/* ══════════ 클릭 처리 ══════════ */
document.addEventListener('click', function(ev){
  var el = ev.target;
  function closest(sel){ var n = el; while(n && n !== document.body){ if(n.matches && n.matches(sel)) return n; n = n.parentNode; } return null; }
  var pb = closest('[data-photo]');
  if(pb){ ev.preventDefault(); ev.stopPropagation(); openPhotoPicker(pb.getAttribute('data-photo')); return; }
  var dph = closest('[data-delphoto]');
  if(dph){ ev.preventDefault(); ev.stopPropagation(); delPhoto(dph.getAttribute('data-delphoto')); return; }
  var heart = closest('[data-heart]');
  if(heart){
    ev.preventDefault(); ev.stopPropagation();
    var id = heart.getAttribute('data-heart');
    var i = favs.indexOf(id);
    if(i >= 0){ favs.splice(i,1); lsSet(LS_FAV, favs); toast(t('delFav')); }
    else { favs.push(id); lsSet(LS_FAV, favs); toast(t('addFav')); }
    renderAll();
    return;
  }
  var rg = closest('[data-rg]');
  if(rg){
    if(rg.getAttribute('data-rg') === st.rg) return;
    nav({rg: rg.getAttribute('data-rg')});
    return;
  }
  var tab = closest('[data-tab]');
  if(tab){
    var tv = tab.getAttribute('data-tab');
    if(st.tab === tv && !st.id) { window.scrollTo(0,0); return; }
    nav({tab: tv, id: null});
    return;
  }
  var ph = closest('[data-ph]');
  if(ph){ openBig(parseInt(ph.getAttribute('data-ph'), 10)); return; }
  var sp = closest('[data-speak]');
  if(sp){ speak(sp.getAttribute('data-speak')); return; }
  var act = closest('[data-act]');
  if(act){ if(act.getAttribute('data-act') === 'back') goBack(); return; }
  var card = closest('.spot[data-id], .favrow[data-id]');
  if(card && !closest('a')){
    var cid = card.getAttribute('data-id');
    nav({tab: 'list', id: cid});
    return;
  }
  var m = closest('.mbtn');
  if(m) return;
});
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Enter'){
    var el = ev.target;
    if(el && el.matches && el.matches('.spot[data-id], .favrow[data-id]')){
      nav({tab:'list', id: el.getAttribute('data-id')});
    }
  }
  if(ev.key === 'Escape'){
    if(!$('#bigCard').hidden) closeBig();
    else if(!$('#installModal').hidden) closeInstall();
  }
});

/* ══════════ 메모 저장 ══════════ */
document.addEventListener('input', function(ev){
  var t2 = ev.target;
  if(t2 && t2.id === 'memoBox'){
    var id = st.id; if(!id) return;
    var v = t2.value;
    notes[id] = v;
    if(!v) delete notes[id];
    lsSet(LS_NOTE, notes);
    var hint = $('#memoHint');
    if(hint){ hint.textContent = t('noteSaved'); clearTimeout(speak._mt);
      speak._mt = setTimeout(function(){ if($('#memoHint')) $('#memoHint').textContent = t('memoHint'); }, 1400); }
  }
});

/* ══════════ 언어 ══════════ */
$('#langBtn').addEventListener('click', function(){
  lang = (lang === 'ko') ? 'en' : 'ko'; li = lang === 'ko' ? 0 : 1;
  lsSet(LS_LANG, lang);
  renderAll(); pushState();
});

/* ══════════ 설치 · 공유 ══════════ */
function isStandalone(){ try{ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }catch(e){ return false; } }
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){ if(e && e.preventDefault) e.preventDefault(); deferredPrompt = e; });
function showInstall(){ $('#installModal').hidden = false; }
function closeInstall(){ if($('#installModal').hidden) return; $('#installModal').hidden = true; }
$('#inClose').addEventListener('click', closeInstall);
$('#installModal').addEventListener('click', function(e){ if(e.target === $('#installModal')) closeInstall(); });
$('#installBtn').addEventListener('click', function(){
  if(isStandalone()){ toast(t('already')); return; }
  if(deferredPrompt){ var d = deferredPrompt; deferredPrompt = null;
    try{ d.prompt(); if(d.userChoice && d.userChoice.then) d.userChoice.then(function(r){ if(r && r.outcome === 'accepted') toast(t('installing')); }, function(){}); return; }catch(e){}
  }
  showInstall();
});
window.addEventListener('appinstalled', function(){ toast(t('installed')); deferredPrompt = null; });

var SHARE_URL = 'https://starpicklife-design.github.io/tour/';
function legacyCopy(text, done, fail){
  try{ var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy'); document.body.removeChild(ta); (ok ? done : fail)(); }catch(e){ fail(); }
}
function shareApp(){
  var payload = {title: t('app'), text: t('shareText'), url: SHARE_URL};
  var usable = true;
  try{ if(navigator.canShare && !navigator.canShare(payload)) usable = false; }catch(e){}
  if(navigator.share && usable){
    try{ navigator.share(payload).then(function(){}, function(err){ if(err && err.name === 'AbortError') return; copyShare(payload); }); return; }catch(e){}
  }
  copyShare(payload);
}
function copyShare(p){
  var full = p.text + '\n\n' + p.url;
  var done = function(){ toast(t('toastCopy')); }, fail = function(){ toast(t('toastShareFail')); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(full).then(done, function(){ legacyCopy(full, done, fail); }); }
  else legacyCopy(full, done, fail);
}
$('#shareBtn').addEventListener('click', shareApp);
$('#printTop').addEventListener('click', printAlbum);
$('#printBtn').addEventListener('click', printAlbum);
window.addEventListener('beforeprint', buildPrintBook);
$('#bcClose').addEventListener('click', closeBig);
$('#bcSpeak').addEventListener('click', function(){
  if(bigIdx >= 0) speak(PHRASES[bigIdx].ko);
});

/* ══════════ 시작 ══════════ */
if(!history.state || !history.state.st){ replaceState(); }
renderAll();
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
