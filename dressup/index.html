<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF3">
<meta name="description" content="와글 옷입히기 — 설치 없이 브라우저에서 바로 즐기는 무료 가상 인형 옷입히기. 데일리·계절 코디와 동화 속 드레스 두 가지 테마, 색상 바꾸기·랜덤 코디·코디 카드 저장(PNG). 회원가입 없이 바로, 광고 없음.">
<title>와글 옷입히기 · 가상 인형 옷입히기 (무료)</title>
<style>
  :root{
    --bg:#FFFBF3; --bg2:#FFF4E6;
    --ink:#2E2420; --ink-soft:#6E5C50;
    --card:#FFFFFF; --line:#EEDFC8;
    --rose:#D2685B; --rose-d:#AF4B40; --rose-l:#FBE7E2;
    --sage:#3F7C61; --sage-l:#E8F1EA;
    --gold:#D9A94C; --lav:#8E62A6; --lav-l:#F2E9F8;
    --shadow:0 10px 26px rgba(96,72,42,.11);
    --shadow-sm:0 3px 10px rgba(96,72,42,.10);
    --r:1.05rem;
  }
  body[data-theme="fairy"]{
    --bg:#FBF6FF; --bg2:#F6ECFF;
    --line:#E7DAF2;
    --rose:#8B5CA8; --rose-d:#6D4488; --rose-l:#F1E7F8;
    --sage:#4E6FA6; --sage-l:#E9EEF8;
    --gold:#C99A3E;
    --shadow:0 10px 26px rgba(96,70,120,.13);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%;font-size:16px}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;word-break:keep-all;overflow-wrap:break-word;
    min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
    transition:background-color .25s ease;
  }
  .wrap{max-width:31rem;margin:0 auto;
    padding:calc(.4rem + env(safe-area-inset-top)) .6rem calc(2rem + env(safe-area-inset-bottom));}

  /* ── 위쪽 바 ─────────────── */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-bottom:.15rem}
  .brand{display:flex;align-items:center;gap:.3rem;font-size:.66rem;font-weight:800;letter-spacing:.01em;color:var(--ink-soft);opacity:.9}
  .brand b{color:var(--rose-d)}
  .tgs{display:flex;gap:.28rem}
  .tg{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;
      padding:.26rem .5rem;font-family:inherit;font-size:.66rem;font-weight:800;line-height:1;
      display:inline-flex;align-items:center;gap:.2rem;min-height:1.9rem;cursor:pointer}
  .tg:active{transform:scale(.97)}

  /* ── 제목 ────────────────── */
  .hero{text-align:center;margin:.15rem 0 .45rem}
  h1{margin:0;font-size:1.3rem;line-height:1.15;letter-spacing:-.03em;font-weight:900;color:var(--ink)}
  h1 .c{color:var(--rose-d)}
  .hero p{margin:.15rem auto 0;max-width:20rem;font-size:.72rem;color:var(--ink-soft);line-height:1.4}

  /* ── 테마 탭 ─────────────── */
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;margin:.3rem 0 .45rem}
  .thm{
    display:flex;align-items:center;justify-content:center;gap:.25rem;
    border:1.6px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:999px;padding:.42rem .2rem;font-family:inherit;font-size:.72rem;font-weight:800;
    min-height:2.35rem;cursor:pointer;letter-spacing:-.02em;line-height:1.1;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .thm .em{font-size:.95rem}
  .thm[aria-selected="true"]{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:var(--shadow-sm)}
  body[data-theme="fairy"] .thm[aria-selected="true"]{background:linear-gradient(180deg,#9A6CB8,#7E5299)}

  /* ── 무대(인형) ───────────── */
  .stage{position:sticky;top:0;z-index:30;background:var(--bg);
    padding:.1rem 0 .3rem;margin:0 -.1rem;box-shadow:0 10px 10px -12px rgba(90,66,40,.45);
    transition:background-color .25s ease}
  .scene{position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--line);
    background:var(--bg2);box-shadow:var(--shadow);display:flex;justify-content:center}
  .scene svg{display:block;width:100%;max-width:21rem;height:auto}
  .acts{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:.32rem;margin-top:.32rem}
  .act{
    display:flex;align-items:center;justify-content:center;gap:.22rem;
    border:1.6px solid var(--line);background:#fff;color:var(--ink);
    border-radius:.7rem;padding:.42rem .1rem;font-family:inherit;font-size:.72rem;font-weight:800;
    min-height:2.3rem;cursor:pointer;line-height:1.1;letter-spacing:-.02em;
  }
  .act .em{font-size:.9rem}
  .act:active{transform:scale(.98)}
  .act.primary{background:var(--sage);border-color:var(--sage);color:#fff}
  body[data-theme="fairy"] .act.primary{background:var(--gold);border-color:var(--gold);color:#3B2A08}

  /* ── 옷장 ─────────────────── */
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:.28rem;margin:.6rem 0 .1rem}
  .cat{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.08rem;
    border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:.7rem;padding:.3rem .05rem;font-family:inherit;font-size:.6rem;font-weight:800;
    min-height:2.9rem;cursor:pointer;line-height:1.1;letter-spacing:-.03em;
  }
  .cat .em{font-size:.95rem;line-height:1}
  .cat[aria-selected="true"]{background:var(--sage-l);border-color:var(--sage);color:#25543E}
  body[data-theme="fairy"] .cat[aria-selected="true"]{background:var(--lav-l);border-color:var(--lav);color:#5B3672}

  .pan{margin-top:.5rem}
  .pal{display:flex;align-items:center;gap:.34rem;margin:0 0 .5rem;flex-wrap:wrap}
  .pal .lbl{font-size:.66rem;font-weight:800;color:var(--ink-soft);margin-right:.05rem}
  .dot{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;
    box-shadow:0 0 0 1.4px var(--line),0 2px 5px rgba(0,0,0,.10);position:relative}
  .dot.on{box-shadow:0 0 0 2.4px var(--rose)}
  .dot.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:.7rem;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.5)}

  .items{display:grid;grid-template-columns:repeat(3,1fr);gap:.32rem}
  .it{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);
    border-radius:.7rem;padding:.4rem .15rem;font-family:inherit;font-size:.62rem;font-weight:700;
    min-height:3.6rem;cursor:pointer;line-height:1.15;letter-spacing:-.03em;text-align:center;
    word-break:keep-all;
  }
  .it .em{font-size:1.05rem;line-height:1}
  .it[aria-selected="true"]{border-color:var(--rose);background:var(--rose-l);color:var(--rose-d);box-shadow:inset 0 0 0 1px var(--rose)}
  .it.dim{opacity:.5}
  .it:active{transform:scale(.98)}
  .hint{margin:.5rem 0 0;font-size:.66rem;color:var(--ink-soft);line-height:1.4;
    background:var(--bg2);border-radius:.6rem;padding:.4rem .55rem;border:1px dashed var(--line)}

  footer{margin-top:1.1rem;text-align:center;font-size:.63rem;color:var(--ink-soft);opacity:.85;line-height:1.6}
  footer .sep{opacity:.5;margin:0 .18rem}

  /* ── 알림 ─────────────────── */
  .toast{
    position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translate(-50%,1.2rem);
    background:rgba(46,36,32,.94);color:#FFF8F0;font-size:.74rem;font-weight:800;
    padding:.55rem .9rem;border-radius:999px;z-index:60;opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (min-width:34rem){
    html{font-size:17px}
    .items{grid-template-columns:repeat(4,1fr)}
    .cats{grid-template-columns:repeat(4,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>

    }

};
const D = () => (app.theme === 'daily' ? DAILY : FAIRY);
const $ = id => document.getElementById(id);

function itemOf(cat, id){
  const box = D()[cat];
  return box.items.find(i => i.id === id) || box.items[0];
}
function paletteOf(cat){ return D()[cat].pal; }

/* 색을 실제 값으로 박아 넣어(브라우저·캔버스 모두 동일하게 렌더) */
function paint(groupId, svg, pal, ci){
  const g = $(groupId);
  g.innerHTML = svg || '';
  if(!pal || !svg) return;
  const c = pal[ci] || pal[0];
  const map = {'var(--c1)':c.c1, 'var(--c2)':c.c2, 'var(--c3)':c.c3};
  g.querySelectorAll('*').forEach(n => {
    ['fill','stroke','stop-color'].forEach(a => {
      const v = n.getAttribute && n.getAttribute(a);
      if(v && map[v]) n.setAttribute(a, map[v]);
    });
  });
}

function draw(){
  const st = app.state[app.theme];
  const hair = itemOf('hair', st.hair.id);
  const top  = itemOf('top',  st.top.id);
  const dress = !!top.dress;

  paint('L_bg', itemOf('bg', st.bg.id).svg + '<ellipse cx="210" cy="500" rx="72" ry="11" fill="#4A3222" opacity=".10"/>', null, 0);
  paint('L_friend', itemOf('friend', st.friend.id).svg, D().friend.pal, st.friend.ci);
  paint('L_hairBack', hair.back, D().hair.pal, st.hair.ci);
  paint('L_shoes', itemOf('shoes', st.shoes.id).svg, D().shoes.pal, st.shoes.ci);
  paint('L_bottom', dress ? '' : itemOf('bottom', st.bottom.id).svg, D().bottom.pal, st.bottom.ci);
  paint('L_top', top.svg, D().top.pal, st.top.ci);

  const outer = itemOf('outer', st.outer.id);
  if(outer.behind){
    paint('L_outer', '', null, 0);
    paint('L_behind', outer.svg, D().outer.pal, st.outer.ci);
  }else{
    paint('L_behind', '', null, 0);
    paint('L_outer', outer.svg, D().outer.pal, st.outer.ci);
  }
  paint('L_hairFront', hair.front, D().hair.pal, st.hair.ci);
  paint('L_acc', itemOf('acc', st.acc.id).svg, D().acc.pal, st.acc.ci);

  $('doll').setAttribute('aria-label', app.lang === 'ko'
    ? '옷을 입히는 인형 — ' + (hair[app.lang] || '') + ', ' + (top[app.lang] || '')
    : 'Dress-up doll — ' + (hair[app.lang] || '') + ', ' + (top[app.lang] || ''));
}

function renderCats(){
  $('cats').innerHTML = CATS.map(c =>
    `<button class="cat" role="tab" aria-selected="${c.key === app.cat}" data-cat="${c.key}">` +
    `<span class="em">${c.em}</span><span>${c[app.lang]}</span></button>`).join('');
}

function renderPal(){
  const box = $('pal');
  const pal = paletteOf(app.cat);
  if(!pal){ box.innerHTML = ''; box.hidden = true; return; }
  box.hidden = false;
  const ci = app.state[app.theme][app.cat].ci;
  box.innerHTML = `<span class="lbl">${t('color')}</span>` + pal.map((c, i) =>
    `<button class="dot${i === ci ? ' on' : ''}" data-ci="${i}" aria-label="${c[app.lang]}" ` +
    `aria-pressed="${i === ci}" style="background:linear-gradient(150deg, ${c.c2}, ${c.c1} 62%, ${c.c3})"></button>`
  ).join('');
}

function renderItems(){
  const box = $('items');
  const st = app.state[app.theme];
  const data = D()[app.cat];
  const cur = st[app.cat];
  const dressNow = !!itemOf('top', st.top.id).dress;

  box.innerHTML = data.items.map(it => {
    const on = it.id === cur.id;
    const dim = (app.cat === 'bottom' && dressNow);
    return `<button class="it${on ? ' on' : ''}${dim ? ' dim' : ''}" data-item="${it.id}" ` +
      `aria-selected="${on}" aria-pressed="${on}"><span class="em">${it.em}</span>` +
      `<span>${it[app.lang]}</span></button>`;
  }).join('');

  const hint = $('hint');
  if(app.cat === 'bottom' && dressNow){
    hint.hidden = false; hint.textContent = t('hintDress');
  }else{
    hint.hidden = true; hint.textContent = '';
  }
}

function renderUI(){
  renderCats(); renderPal(); renderItems();
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if(T[app.lang][k]) el.textContent = T[app.lang][k];
  });
  $('langTxt').textContent = app.lang === 'ko' ? 'EN' : '한';
  $('soundTxt').textContent = app.sound ? t('soundOn') : t('soundOff');
  $('soundIcon').textContent = app.sound ? '🔈' : '🔇';
  $('soundBtn').setAttribute('aria-pressed', String(app.sound));
  document.querySelectorAll('[data-theme-btn]').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.themeBtn === app.theme)));
  document.documentElement.lang = app.lang;
  document.title = app.lang === 'ko'
    ? '와글 옷입히기 · 가상 인형 옷입히기 (무료)'
    : 'Wagle Dress-Up · Free virtual paper doll';
}

/* ── 소리 (기본 무음, 켤 때만) ── */
let actx = null;
function sfx(freq){
  if(!app.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq || 660;
    g.gain.value = .05;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .16);
    o.stop(actx.currentTime + .18);
  }catch(e){}
}

let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
}

/* ── 동작 ── */
function pickItem(cat, id){
  const st = app.state[app.theme];
  if(cat === 'bottom' && itemOf('top', st.top.id).dress){
    const plain = D().top.items.find(i => !i.dress);
    st.top.id = plain.id;
    st.top.ci = plain.d;
    toast(t('pickBottom'));
  }
  st[cat].id = id;
  sfx(720);
  draw(); renderItems();
}
function pickColor(ci){
  app.state[app.theme][app.cat].ci = ci;
  sfx(880);
  draw(); renderPal();
}
function switchTheme(theme){
  if(app.theme === theme) return;
  app.theme = theme;
  document.body.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'daily' ? '#FFFBF3' : '#FBF6FF');
  sfx(560);
  renderUI(); draw();
}
function randomLook(){
  const st = app.state[app.theme], d = D();
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  const rndPal = cat => { const p = d[cat].pal; return p ? Math.floor(Math.random() * p.length) : 0; };

  const hair = rnd(d.hair.items);        st.hair.id = hair.id; st.hair.ci = rndPal('hair');
  const wantDress = Math.random() < .55;
  const tops = d.top.items.filter(i => !!i.dress === wantDress);
  const top = rnd(tops.length ? tops : d.top.items);
  st.top.id = top.id; st.top.ci = rndPal('top');
  if(!top.dress){ const b = rnd(d.bottom.items); st.bottom.id = b.id; st.bottom.ci = rndPal('bottom'); }
  const outer = Math.random() < .6 ? rnd(d.outer.items.filter(i => i.id !== 'none')) : itemOf('outer', 'none');
  st.outer.id = outer.id; st.outer.ci = rndPal('outer');
  const sh = rnd(d.shoes.items); st.shoes.id = sh.id; st.shoes.ci = rndPal('shoes');
  const ac = Math.random() < .7 ? rnd(d.acc.items.filter(i => i.id !== 'none')) : itemOf('acc', 'none');
  st.acc.id = ac.id; st.acc.ci = rndPal('acc');
  const fr = Math.random() < .45 ? rnd(d.friend.items.filter(i => i.id !== 'none')) : itemOf('friend', 'none');
  st.friend.id = fr.id; st.friend.ci = rndPal('friend');
  const bg = rnd(d.bg.items); st.bg.id = bg.id;

  sfx(940);
  draw(); renderItems(); renderPal();
  toast(t('randomDone'));
}
function resetLook(){
  const fresh = {
    daily:{hair:{id:'bob',ci:0}, top:{id:'knit',ci:1}, bottom:{id:'jeans',ci:3},
           outer:{id:'none',ci:0}, shoes:{id:'loafer',ci:4}, acc:{id:'none',ci:0},
           friend:{id:'none',ci:5}, bg:{id:'cafe',ci:0}},
    fairy:{hair:{id:'princess',ci:1}, top:{id:'gown',ci:4}, bottom:{id:'tulle',ci:4},
           outer:{id:'wings',ci:4}, shoes:{id:'glass',ci:0}, acc:{id:'crown',ci:5},
           friend:{id:'none',ci:5}, bg:{id:'forest',ci:0}}
  };
  app.state[app.theme] = JSON.parse(JSON.stringify(fresh[app.theme]));
  app.cat = 'hair';
  sfx(420);
  renderUI(); draw();
  toast(t('resetDone'));
}

/* ── 코디 카드 PNG 저장 ── */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function stamp(d){
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

async function saveCard(){
  if(app.busy) return;
  app.busy = true;
  const btn = $('saveBtn');
  const label = btn.innerHTML;
  btn.disabled = true;
  try{
    const svg = $('doll').cloneNode(true);
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    svg.setAttribute('width', '420');
    svg.setAttribute('height', '560');
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = src; });

    const W = 1080, H = 1350;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const fairy = app.theme === 'fairy';

    const bg = ctx.createLinearGradient(0, 0, W, H);
    if(fairy){ bg.addColorStop(0, '#FBF6FF'); bg.addColorStop(.55, '#F4EBFB'); bg.addColorStop(1, '#EDE2F6'); }
    else{ bg.addColorStop(0, '#FFFBF3'); bg.addColorStop(.55, '#FDEFE0'); bg.addColorStop(1, '#F8E7D2'); }
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = fairy ? 'rgba(139,92,168,.07)' : 'rgba(210,104,91,.07)';
    for(let i = 0; i < 26; i++){
      ctx.beginPath();
      ctx.arc(60 + (i * 137) % 980, 60 + (i * 219) % 1230, 12 + (i % 3) * 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = fairy ? '#6D4488' : '#2E2420';
    ctx.font = '900 60px "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillText(t('cardTitle'), W / 2, 96);
    ctx.font = '700 27px "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillStyle = fairy ? '#8C6FA3' : '#8A7364';
    ctx.fillText((fairy ? t('themeNameFairy') : t('themeName')) + '  ·  ' + t('cardSub'), W / 2, 138);

    const pw = 840, ph = 1120, px = (W - pw) / 2, py = 168;
    ctx.save();
    ctx.shadowColor = 'rgba(70,50,30,.22)';
    ctx.shadowBlur = 30;
    ctx.shadowOffsetY = 12;
    roundRect(ctx, px, py, pw, ph, 34);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.restore();
    ctx.save();
    roundRect(ctx, px, py, pw, ph, 34);
    ctx.clip();
    ctx.drawImage(img, px, py, pw, ph);
    ctx.restore();
    ctx.save();
    roundRect(ctx, px + 1.5, py + 1.5, pw - 3, ph - 3, 32);
    ctx.strokeStyle = fairy ? 'rgba(201,154,62,.55)' : 'rgba(210,104,91,.35)';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.restore();

    const now = new Date();
    const date = now.getFullYear() + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');
    ctx.textAlign = 'left';
    ctx.fillStyle = fairy ? '#6D4488' : '#6E5C50';
    ctx.font = '800 26px "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillText(date, px + 8, 1326);
    ctx.textAlign = 'right';
    ctx.fillStyle = fairy ? '#8C6FA3' : '#8A7364';
    ctx.font = '700 24px "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillText('@starpick_life  ·  Wagle Dress-Up', px + pw - 8, 1326);

    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if(!blob) throw new Error('toBlob failed');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'wagle-dressup-' + stamp(now) + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 6000);
    sfx(1040);
    toast(t('saved'));
  }catch(e){
    toast(t('saveFail'));
  }finally{
    app.busy = false;
    btn.disabled = false;
    btn.innerHTML = label;
  }
}

/* ── 이벤트 ── */
$('cats').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if(!b) return;
  app.cat = b.dataset.cat;
  sfx(620);
  renderCats(); renderPal(); renderItems();
  window.scrollBy({top: 1, behavior: 'auto'});
});
$('items').addEventListener('click', e => {
  const b = e.target.closest('[data-item]');
  if(!b) return;
  pickItem(app.cat, b.dataset.item);
});
$('pal').addEventListener('click', e => {
  const b = e.target.closest('[data-ci]');
  if(!b) return;
  pickColor(Number(b.dataset.ci));
});
document.querySelectorAll('[data-theme-btn]').forEach(b =>
  b.addEventListener('click', () => switchTheme(b.dataset.themeBtn)));

$('randomBtn').addEventListener('click', randomLook);
$('resetBtn').addEventListener('click', resetLook);
$('saveBtn').addEventListener('click', saveCard);
$('soundBtn').addEventListener('click', () => {
  app.sound = !app.sound;
  $('soundTxt').textContent = app.sound ? t('soundOn') : t('soundOff');
  $('soundIcon').textContent = app.sound ? '🔈' : '🔇';
  $('soundBtn').setAttribute('aria-pressed', String(app.sound));
  if(app.sound) sfx(700);
});
$('langBtn').addEventListener('click', () => {
  app.lang = app.lang === 'ko' ? 'en' : 'ko';
  sfx(660);
  renderUI();
});

/* ── 시작 ── */
renderUI();
draw();
</script>
