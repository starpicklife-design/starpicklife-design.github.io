<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
<meta name="theme-color" content="#B32433" />
<meta name="description" content="2027 정미년 새해·설날, 크리스마스, 생일·감사·응원 카드를 스스로 꾸며서 카톡·문자로 바로 보내는 무료 카드 만들기 앱. 한국 전통 문양과 크리스마스, 십이지신 스티커 89종." />
<title>💌 와글링 카드 · 스스로 꾸미는 카드 만들기</title>
<!-- build: 2026-11-27 와글링 카드 (card-maker) v2
     · 2D 일러스트 / 3D 입체 / 내 사진 3가지 모드 유지
     · 테마 13종: 정미년 한지·신년 해돋이·설날 창호지·새해 새벽별·크리스마스 3종·생일·축하·감사·효도·응원·위로
     · 중국식 홍등·금색 구름문양 제거 → 청사초롱·까치·소나무·매화·한옥 처마·창호지·색동·한지·해돋이·복주머니
     · 스티커 89종(2D/3D 두 벌): 한국 새해 18 · 십이지신 12 · 크리스마스 15 · 꽃·자연 10 · 별 5 · 마음 7 · 리본 6 · 파티 8 · 동물 5 · 말풍선 3
     · 글씨 탭 개선 + 카드 글씨 눌러 바로 편집, 테마별 추천 문구 한국어/English 78+78
     · 한 / EN UI 전환, 큰 글씨, Canvas 1080×1440 PNG 저장·공유 -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="와글링 카드" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1F2433; --ink2:#3B4152; --muted:#565C6E;
    --red:#B32433; --red-d:#8E1626; --gold:#C99A2C; --paper:#FFF7EF;
    --line:#EADACB; --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow-x:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Gowun Dodum",-apple-system,"Malgun Gothic",system-ui,sans-serif;
    font-size:19px; line-height:1.52;
    word-break:keep-all;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  [hidden]{display:none !important}
  .view{display:flex;flex-direction:column;height:100dvh;height:100vh}
  @supports(height:100dvh){.view{height:100dvh}}

  /* ── 상단 바 ── */
  .topbar{
    display:flex;align-items:center;gap:8px;padding:8px 11px;
    padding-top:calc(8px + env(safe-area-inset-top));
    background:#FFFDF9;border-bottom:1.5px solid var(--line);
    position:relative;z-index:5;flex:0 0 auto;min-height:62px;
  }
  .brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
  .brand .logo{font-size:28px;line-height:1}
  .brand > div{min-width:0}
  .brand b{display:block;font-family:"Jua",sans-serif;font-size:22px;color:var(--ink);line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:13.5px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;gap:5px;flex:0 0 auto}
  .acts button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-width:50px;height:50px;padding:0 5px;border-radius:14px;
    border:1.5px solid #E6D3BF;background:#FFF9F0;font-size:19px;line-height:1;
  }
  .acts button span{font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;max-width:100%}
  .acts button:active{background:#F7EADA}
  .acts .lang{font-family:"Jua",sans-serif;font-size:15px;font-weight:700;color:#8E1626;background:#FFF1E6;border-color:#E8CDB4}
  #viewEdit .brand b{font-size:18.5px;white-space:normal;overflow:visible;text-overflow:clip;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.16}
  #viewEdit .brand small{display:none}
  .iconbtn{
    width:46px;height:46px;border-radius:14px;border:1.5px solid #E6D3BF;background:#FFF9F0;
    font-size:23px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }

  /* ── 홈 ── */
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:13px 14px calc(24px + env(safe-area-inset-bottom))}
  .hero{
    position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;
    background:radial-gradient(120% 120% at 20% 0%,#C93A46 0%,#A81C2C 45%,#7A0F1C 100%);
    color:#FFF3D6;box-shadow:0 10px 24px rgba(122,15,28,.22);
  }
  .hero .tag{display:inline-block;background:rgba(255,240,190,.18);border:1px solid rgba(246,214,143,.55);
    color:#FFE9B8;font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.01em}
  .hero h1{font-family:"Jua",sans-serif;font-size:28px;line-height:1.26;margin:11px 0 8px;color:#FFF6DE;letter-spacing:-.01em}
  .hero p{margin:0;font-size:15.5px;color:#FBE7C2;line-height:1.55;max-width:74%}
  .hero p b{color:#FFF3D6}
  .hero .sheep{position:absolute;right:0;bottom:12px;width:94px;height:94px;opacity:.99;filter:drop-shadow(0 8px 14px rgba(60,0,0,.28))}
  .hero .glow{position:absolute;right:-40px;top:-40px;width:210px;height:210px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,226,150,.35),rgba(255,226,150,0) 70%)}
  .ddays{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .ddays .dd{display:inline-flex;align-items:center;gap:6px;background:#FFF3D6;color:#8E1626;
    font-weight:700;font-size:14.5px;padding:8px 12px;border-radius:12px}
  .ddays .dd.x{background:#FFE9C4}
  .hero .cta{
    margin-top:14px;width:calc(100% - 104px);min-height:56px;border:0;border-radius:15px;background:#FFE7A8;color:#6E0F1B;
    font-family:"Jua",sans-serif;font-size:21px;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 4px 0 #C08B30;
  }
  .hero .cta:active{transform:translateY(1px);box-shadow:0 2px 0 #C08B30}

  .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:15px 0 6px}
  .modes button{
    min-height:66px;border-radius:17px;border:2px solid var(--line);background:#FFFDF9;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:17.5px;font-weight:700;color:var(--ink2);padding:4px;
  }
  .modes button small{font-size:11.5px;color:var(--muted);font-weight:400;line-height:1.15;text-align:center}
  .modes button.on{border-color:var(--red);background:#FFF1F1;color:var(--red-d);box-shadow:0 0 0 3px rgba(179,36,51,.08)}
  .modes button.on small{color:#9C3A42}

  .filters{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;border:1.6px solid #EAD9C6;
    background:#FFFDF9;font-size:15.5px;font-weight:700;color:#5A4632}
  .filters button.on{background:#B32433;border-color:#B32433;color:#FFF3D6}

  .sect{display:flex;align-items:baseline;gap:8px;margin:14px 2px 9px}
  .sect h2{font-family:"Jua",sans-serif;font-size:23px;margin:0;color:var(--ink)}
  .sect span{font-size:14px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tpl{
    position:relative;border:2px solid #EFE1D2;border-radius:19px;background:#fff;padding:0;overflow:hidden;
    display:flex;flex-direction:column;text-align:left;box-shadow:0 3px 10px rgba(90,60,30,.06);min-width:0;
  }
  .tpl:active{transform:scale(.985)}
  .tpl .pic{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:#F6EADA;display:block}
  .tpl .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .tpl .pic .fr{position:absolute;inset:0;width:100%;height:100%}
  .tpl .cap{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 11px 11px;background:#FFFDF9;min-width:0}
  .tpl .cap b{font-size:16.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tpl .cap i{font-style:normal;font-size:12.5px;font-weight:700;color:#8A3E2A;background:#FFF1E3;border-radius:999px;padding:4px 8px;flex:0 0 auto}
  .tpl .new{position:absolute;top:8px;left:8px;background:#B32433;color:#FFF3D6;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(120,10,20,.3)}
  .tpl .new.x{background:#1F5A8A}

  .draft{margin-top:15px;display:flex;align-items:center;gap:10px;background:#FFF4E4;border:2px solid #F2DDBF;
    border-radius:17px;padding:13px 14px}
  .draft .txt{flex:1;min-width:0}
  .draft b{display:block;font-size:16.5px;color:#6E4412}
  .draft small{display:block;font-size:13.5px;color:#8A6A3E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .draft button{min-height:48px;padding:0 15px;border-radius:13px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:16.5px;flex:0 0 auto}

  .note{margin:18px 2px 0;font-size:14.5px;color:var(--muted);line-height:1.65}
  .foot{margin-top:18px;text-align:center;font-size:14px;color:#7A6A5A}

  /* ── 꾸미기 ── */
  .editMain{flex:1;display:flex;flex-direction:column;min-height:0;padding:9px 11px 0}
  .stageWrap{flex:1;min-height:200px;display:flex;align-items:center;justify-content:center;padding:4px 0 4px}
  .stageBox{position:relative;border-radius:14px;overflow:visible;filter:drop-shadow(0 10px 22px rgba(90,50,30,.22))}
  .stageBox canvas{display:block;border-radius:12px;touch-action:none}
  .overlay{position:absolute;inset:0;pointer-events:none}
  .selbox{position:absolute;border:2.5px dashed #FF5A78;border-radius:8px;box-shadow:0 0 0 2px rgba(255,255,255,.7) inset;pointer-events:none}
  .delbtn,.rsbtn{position:absolute;width:38px;height:38px;border-radius:50%;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;pointer-events:auto;font-size:17px;font-weight:700;
    box-shadow:0 3px 8px rgba(60,10,20,.3);z-index:3;touch-action:none}
  .delbtn{background:#E23B4E;color:#fff}
  .rsbtn{background:#2E7BF0;color:#fff;font-size:19px;border-radius:12px;cursor:nwse-resize}
  .photoPrompt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(255,250,244,.88);border-radius:12px;text-align:center;padding:14px}
  .photoPrompt p{margin:0;font-size:15.5px;color:var(--ink2);line-height:1.5}
  .photoPrompt button{min-height:52px;padding:0 18px;border:0;border-radius:14px;background:var(--red);color:#fff;
    font-size:18px;font-weight:700;box-shadow:0 3px 0 #7A0F1C}

  .quickRow{display:flex;gap:8px;overflow-x:auto;padding:3px 0 7px;scrollbar-width:none;flex:0 0 auto}
  .quickRow::-webkit-scrollbar{display:none}
  .q{
    flex:0 0 auto;width:56px;height:56px;padding:5px;border-radius:15px;border:1.5px solid #EAD9C6;background:#FFFDF9;
    display:flex;align-items:center;justify-content:center;
  }
  .q img{width:100%;height:100%;object-fit:contain}
  .q.more{font-size:13.5px;font-weight:700;color:#7A4A22;flex-direction:column;gap:1px;width:60px;background:#FFF3E2}
  .q.more span{font-size:20px;line-height:1}
  .q.txt{flex-direction:column;gap:0;width:62px;background:#FFF0F3;border-color:#F3BFCB;font-size:12.5px;font-weight:700;color:#A8324A;line-height:1.1}
  .q.txt span{font-size:21px;line-height:1.15}
  .textHint{flex:0 0 auto;font-size:13px;color:#8A6A3E;padding:0 2px 3px;text-align:center}

  .editBar{
    flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 1.3fr;gap:7px;
    padding:8px 10px calc(9px + env(safe-area-inset-bottom));background:#FFFDF9;border-top:1.5px solid var(--line);
  }
  .editBar button{min-height:58px;border-radius:15px;border:1.5px solid #EAD9C6;background:#FFF9F1;
    font-size:15.5px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.12;padding:2px}
  .editBar button em{font-style:normal;font-size:21px;line-height:1}
  .editBar .txBtn{background:#FFF0F3;border-color:#F3BFCB;color:#A8324A}
  .editBar .txBtn em{font-size:22px}
  .editBar .cta{background:linear-gradient(#C8343F,#A81C2C);color:#FFF3D6;border-color:#8E1626;
    font-family:"Jua",sans-serif;font-size:18px;box-shadow:0 3px 0 #7A0F1C;gap:0}
  .editBar .cta em{font-size:21px}

  /* ── 완성 ── */
  .doneScroll{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));text-align:center}
  .doneHead{font-family:"Jua",sans-serif;font-size:27px;color:var(--red-d);margin:4px 0 2px}
  .doneSub{font-size:15px;color:var(--muted);margin:0 0 12px}
  .doneCard{display:flex;justify-content:center;margin:6px 0 14px}
  .doneCard canvas{width:min(78vw,320px);height:auto;border-radius:12px;box-shadow:0 14px 30px rgba(90,50,30,.28);background:#fff}
  .big{width:100%;max-width:430px;min-height:60px;border-radius:17px;border:0;font-size:19px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 10px}
  .big.save{background:#FFF3D6;color:#7A3A12;border:2px solid #E6C583;box-shadow:0 3px 0 #D9B26A}
  .big.kakao{background:#FEE500;color:#231F20;box-shadow:0 3px 0 #D9C400}
  .big:active{transform:translateY(1px)}
  .doneTip{font-size:14.8px;color:var(--ink2);line-height:1.62;margin:6px 2px 16px;background:#FFF4E6;
    border:1.5px solid #F0DCC0;border-radius:15px;padding:12px 13px;text-align:left}
  .doneLinks{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  .doneLinks button{min-height:50px;padding:0 16px;border-radius:13px;border:1.5px solid #E6D3BF;background:#FFFDF9;
    font-size:15.5px;font-weight:700;color:#6B4A32}

  /* ── 시트 ── */
  .sheetWrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
  .sheetBack{position:absolute;inset:0;background:rgba(35,15,25,.34)}
  .sheet{position:relative;background:#FFFDF9;border-radius:24px 24px 0 0;max-height:78vh;display:flex;flex-direction:column;
    box-shadow:0 -12px 30px rgba(60,20,20,.2);animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheetHead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;flex:0 0 auto;
    border-bottom:1.5px solid #F2E5D7}
  .sheetHead b{font-family:"Jua",sans-serif;font-size:22px;color:var(--ink)}
  .sheetHead button{width:42px;height:42px;border-radius:50%;border:0;background:#F4E9DC;font-size:18px;color:#5A4632}
  .sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 15px 22px}
  .lbl{font-size:15px;font-weight:700;color:#7A5A3E;margin:15px 2px 8px;letter-spacing:.01em}
  .lbl:first-child{margin-top:2px}
  .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button{min-height:50px;border-radius:13px;border:1.8px solid #EAD9C6;background:#FFF9F1;font-size:16px;font-weight:700;color:#5A4632}
  .seg button.on{border-color:var(--red);background:#FFF0F0;color:var(--red-d)}
  .chipRow{display:flex;flex-wrap:wrap;gap:7px}
  .chipRow.hscroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -15px;padding-left:15px;padding-right:15px}
  .chipRow.hscroll::-webkit-scrollbar{display:none}
  .chip{min-height:46px;padding:7px 13px;border-radius:13px;border:1.6px solid #EAD9C6;background:#FFFDF9;
    font-size:16px;color:#3B3546;line-height:1.28;text-align:left}
  .chip:active{background:#FFF1E4}
  .chip.on{border-color:var(--red);background:#FFF0F0;color:var(--red-d);font-weight:700}
  .tplRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tplRow button{border:2px solid #EFE1D2;border-radius:13px;padding:0;overflow:hidden;background:#FFFDF9;text-align:center;min-width:0}
  .tplRow button.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(179,36,51,.1)}
  .tplRow .ph{position:relative;display:block;width:100%;aspect-ratio:3/4;background:linear-gradient(160deg,#FFD9A0,#F7A8B8 45%,#8FB8F2);overflow:hidden}
  .tplRow .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tplRow .nm{display:block;font-size:13px;font-weight:700;padding:6px 3px;color:#4A3A32;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .field{width:100%;font-family:inherit;font-size:18px;color:var(--ink);padding:13px 13px;border-radius:14px;
    border:1.8px solid #E4D3C0;background:#fff}
  textarea.field{min-height:110px;resize:vertical;line-height:1.5}
  .field:focus{outline:none;border-color:#C8324F;border-width:2.4px;box-shadow:0 0 0 3px rgba(179,36,51,.1)}
  .cnt{text-align:right;font-size:13px;color:var(--muted);margin:4px 2px 0}
  .fontRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .fontRow button{min-height:60px;border-radius:13px;border:1.8px solid #EAD9C6;background:#FFFDF9;font-size:19px;color:#2E2A3A;padding:2px}
  .fontRow button.on{border-color:var(--red);background:#FFF0F0}
  .swRow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .sw{width:42px;height:42px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px #DCCBB8;padding:0}
  .sw.on{box-shadow:0 0 0 3px var(--red)}
  .swCustom{width:48px;height:42px;border-radius:11px;border:1.5px solid #DCCBB8;background:#fff;padding:2px}
  .sizeRow{display:flex;align-items:center;gap:10px}
  .sizeRow button{width:52px;height:52px;border-radius:14px;border:1.8px solid #EAD9C6;background:#FFFDF9;font-size:26px;font-weight:700;color:#5A4632}
  .sizeRow .val{flex:1;text-align:center;font-size:16.5px;font-weight:700;color:#4A3A32}
  .sizeRow input[type=range]{flex:1;height:34px;accent-color:#B32433}
  .posRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .posRow button{min-height:48px;border-radius:13px;border:1.8px solid #EAD9C6;background:#FFF9F1;font-size:15.5px;font-weight:700;color:#5A4632}
  .posRow button.on{border-color:var(--red);background:#FFF0F0;color:var(--red-d)}
  .stTabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .stTabs::-webkit-scrollbar{display:none}

    var n = state.stickers.length;
    var slots = [[.27, .205], [.73, .205], [.27, .795], [.73, .795], [.5, .15], [.5, .85]];
    var slot = slots[n % slots.length];
    var s = {
      id: 's' + (++seq), key: key, gloss: !!gloss,
      x: slot[0], y: slot[1],
      s: (meta.s || .22) * .84
    };
    state.stickers.push(s);
    selId = s.id;
    render(); persist();
    toast(t('toastAdd'));
  }

      if (!d.stickers.length && !(d.text && (d.text.msg || d.text.to || d.text.from))) return null;

  /* ── 홈 그리기 ── */

  var TAGS = ['새해', '설날', '크리스마스', '생일', '축하', '감사', '효도', '응원', '위로'];
  var TAG_EN = { '새해': 'New Year', '설날': 'Seollal', '크리스마스': 'Christmas', '생일': 'Birthday', '축하': 'Congrats', '감사': 'Thanks', '효도': 'Parents', '응원': 'Cheer', '위로': 'Comfort' };
  function sortedThemes() {
    return ART.themes.slice().sort(function (a, b) { return ORDER.indexOf(a.id) - ORDER.indexOf(b.id); });
  }
  function tagName(th) { return LANG === 'en' ? (th.tagEn || TAG_EN[th.tag] || th.tag) : th.tag; }
  function buildFilters() {

    $('#inTo').addEventListener('input', function (e) { tx.to = e.target.value; render(); persist(); });
    msg.addEventListener('input', function (e) {
      tx.msg = e.target.value; cnt.textContent = Array.from(tx.msg).length; render(); persist();
    });
    $('#inFrom').addEventListener('input', function (e) { tx.from = e.target.value; render(); persist(); });
    $$('#sheetBody [data-chip]').forEach(function (b) {
      b.addEventListener('click', function () {
        tx.msg = b.dataset.chip; msg.value = tx.msg; cnt.textContent = Array.from(tx.msg).length;
        render(); persist(); toast(t('toastChip'));
      });
    });
    $$('#sheetBody [data-plang]').forEach(function (b) {
      b.addEventListener('click', function () { phraseLang = b.dataset.plang; buildSheet('tx'); });
    });
    $$('#sheetBody [data-pth]').forEach(function (b) {
      b.addEventListener('click', function () { phraseTheme = b.dataset.pth; buildSheet('tx'); });
    });
    $$('#sheetBody [data-font]').forEach(function (b) {
      b.addEventListener('click', function () {
        tx.font = b.dataset.font;
        $$('#sheetBody [data-font]').forEach(function (x) { x.classList.toggle('on', x === b); });
        render(); persist();
      });
    });
    $$('#sheetBody [data-color]').forEach(function (b) {
      b.addEventListener('click', function () {
        tx.color = b.dataset.color;
        $$('#sheetBody .sw').forEach(function (x) { x.classList.toggle('on', x === b); });
        render(); persist();
      });
    });
    $('#swCustom').addEventListener('input', function (e) {
      tx.color = e.target.value;
      $$('#sheetBody .sw').forEach(function (x) { x.classList.remove('on'); });
      render(); persist();
    });
    function setSize(v) {
      tx.size = Math.max(.046, Math.min(.12, v));
      var p = Math.round(tx.size / .072 * 100);
      $('#szVal').textContent = p + '%';
      var rg = $('#szRange'); if (rg) rg.value = p;
      render(); persist();
    }
    $('#szDown').addEventListener('click', function () { setSize(tx.size - .007); });
    $('#szUp').addEventListener('click', function () { setSize(tx.size + .007); });
    $('#szRange').addEventListener('input', function (e) { setSize(Number(e.target.value) / 100 * .072); });
    $$('#sheetBody [data-pos]').forEach(function (b) {
      b.addEventListener('click', function () {
        tx.pos = b.dataset.pos;
        $$('#sheetBody [data-pos]').forEach(function (x) { x.classList.toggle('on', x === b); });
        render(); persist();
      });
    });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ── 완성 이미지 ── */
  function sourcesFor(st) {
    var arr = [];
    if (st.mode === 'photo') {
      if (st.photo) arr.push(st.photo);
      var f = ART.frame(st.frame); if (f) arr.push(svgUrl(f));
    } else arr.push(svgUrl(ART.bg(st.theme, st.mode === '3d')));
    st.stickers.forEach(function (s) { arr.push(svgUrl(STK.svg(s.key, s.gloss))); });
    return arr;
  }
  async function preloadAll() {
    await Promise.all(sourcesFor(state).map(loadImg));
    try { await document.fonts.ready; } catch (e) {}
    await Promise.all(Object.keys(FONT_STACK).map(function (k) {
      try { return document.fonts.load('60px ' + FONT_STACK[k].split(',')[0]); } catch (e) { return null; }
    }));
  }
  async function buildPNG() {
    await preloadAll();
    var c = document.createElement('canvas');
    c.width = CW; c.height = CH;
    var ctx = c.getContext('2d');
    drawCard(ctx, CW, CH, state, {});
    return await new Promise(function (res) { c.toBlob(function (b) { res(b); }, 'image/png'); });
  }
  function fileName() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    var base = state.mode === 'photo' ? frameName() : titleOf();
    return (LANG === 'en' ? 'WaglingCard_' : '와글링카드_') + base + '_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.png';
  }
  function downloadBlob(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fileName();
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  async function saveImage() {
    try {
      var blob = await buildPNG();
      if (!blob) { toast(t('toastSaveFail')); return; }
      downloadBlob(blob);
      toast(t('toastSaved'));
      return blob;
    } catch (e) { toast(t('toastSaveFail')); return null; }
  }
  async function shareCard() {
    try {
      var blob = await buildPNG();
      if (!blob) { toast(t('toastSaveFail')); return; }
      var file;
      try { file = new File([blob], fileName(), { type: 'image/png' }); } catch (e) { file = null; }
      if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        try {
          await navigator.share({
            files: [file],
            title: t('brand'),
            text: (state.text.msg || t('brand')) + ' 💌'
          });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      downloadBlob(blob);
      openSheet('howto');
    } catch (e) { toast(t('toastShareFail') + (e && e.message ? e.message : '')); }
  }
  function howtoHTML() {
    return '<div class="memo">' + t('howtoMemo') + '</div>' +
      '<ol class="steps">' +
      '<li><span class="num">1</span><div>' + t('howto1') + '</div></li>' +
      '<li><span class="num">2</span><div>' + t('howto2') + '</div></li>' +
      '<li><span class="num">3</span><div>' + t('howto3') + '</div></li>' +
      '</ol>' +
      '<p class="hint">' + t('howtoHint') + '</p>' +
      '<button class="big save mini" id="retrySave">' + t('retrySave') + '</button>';
  }
  function wireHowto() {
    var b = $('#retrySave'); if (b) b.addEventListener('click', saveImage);
  }

  /* ── 앱 공유·설치 ── */
  function appUrl() {
    var h = location.hostname || '';
    if (location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || !h) return SITE;
    return location.href.split('#')[0];
  }
  function copyText(txt, ok, fail) {
    function legacy() {
      try {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        try { ta.setSelectionRange(0, txt.length); } catch (e) {}
        var done = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
        done ? ok() : fail();
      } catch (e) { fail(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText && location.protocol !== 'file:') {
      navigator.clipboard.writeText(txt).then(ok, legacy); return;
    }
    legacy();
  }
  function shareApp() {
    var url = appUrl();
    var payload = { title: t('shareTitle'), text: t('shareAppText'), url: url };
    function fallback() {
      copyText(payload.text + '\n' + url, function () { toast(t('toastLinkCopy')); }, function () { toast(t('toastLinkFail')); });
    }
    var usable = true;
    try { if (navigator.canShare && !navigator.canShare(payload)) usable = false; } catch (e) {}
    if (navigator.share && usable) {
      try {
        var r = navigator.share(payload);
        if (r && r.then) r.then(function () {}, function (err) { if (!err || err.name !== 'AbortError') fallback(); });
        return;
      } catch (e) {}
    }
    fallback();
  }
  var instPrompt = null, instDone = false;
  function isStandalone() {
    try {
      if (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: minimal-ui)').matches) return true;
    } catch (e) {}
    if (navigator.standalone === true) return true;
    return false;
  }
  function uaIsIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1); }
  function uaIsSamsung() { return /SamsungBrowser/i.test(navigator.userAgent || ''); }
  function inAppBrowser() { return /KAKAOTALK|Instagram|NAVER|FBAN|FBAV|Line\//i.test(navigator.userAgent || ''); }
  function chromeIntent() {
    var host = location.host || 'starpicklife-design.github.io';
    var path = (location.pathname || '/card-maker/') + (location.search || '');
    return 'intent://' + host + path + '#Intent;scheme=https;package=com.android.chrome;end';
  }
  function syncInstallBtn() {
    $$('.js-inst').forEach(function (b) { b.hidden = instDone || isStandalone(); });
  }
  function installHTML() {
    var steps;
    if (uaIsIOS()) steps = [t('instIos1'), t('instIos2'), t('instIos3')];
    else if (uaIsSamsung()) steps = [t('instSam1'), t('instSam2'), t('instSam3')];
    else steps = [t('instChr1'), t('instChr2'), t('instChr3')];
    var h = '<div class="memo">' + t('instMemo') + '</div><ol class="steps">' +
      steps.map(function (s, i) { return '<li><span class="num">' + (i + 1) + '</span><div>' + s + '</div></li>'; }).join('') + '</ol>';
    if (inAppBrowser()) {
      h += '<div class="memo">' + t('instInApp') + '</div>' +
        '<a href="' + chromeIntent() + '" style="display:block;text-align:center;min-height:54px;line-height:54px;border-radius:14px;background:#2E7BF0;color:#fff;font-weight:700;text-decoration:none">' + t('openChrome') + '</a>';
    }
    h += '<p class="hint">' + t('instHint') + '</p>';
    return h;
  }
  function wireInstall() {}
  function installTap() {
    if (instPrompt) {
      try {
        instPrompt.prompt();
        var p = instPrompt; instPrompt = null;
        if (p.userChoice && p.userChoice.then) p.userChoice.then(function (c) {
          if (c && c.outcome === 'accepted') { instDone = true; syncInstallBtn(); }
        });
        return;
      } catch (e) {}
    }
    openSheet('install');
  }
  window.addEventListener('beforeinstallprompt', function (e) { try { e.preventDefault(); } catch (err) {} instPrompt = e; });
  window.addEventListener('appinstalled', function () { instDone = true; instPrompt = null; syncInstallBtn(); toast(t('toastInstalled')); });

  /* ── 사진 ── */
  function pickPhoto() {
    var inp = $('#photoInput'); if (!inp) return;
    inp.value = '';
    inp.click();
  }
  function usePhotoFile(file) {
    if (!file || !/^image\//.test(file.type)) { toast(t('toastPhotoPick')); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 1400;
        var s = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        var url;
        try { url = c.toDataURL('image/jpeg', .86); } catch (e) { url = reader.result; }
        state.photo = url; state.mode = 'photo';
        selId = null;
        if (!state.text.msg) state.text.msg = LANG === 'en' ? 'Wishing you health and happiness' : '늘 건강하고 행복하세요';
        persist(); render(); syncPhotoPrompt();
        $('#edTitle').textContent = frameName();
        $('#edSub').textContent = LANG === 'en' ? 'Decorate your photo' : '사진 위에 꾸며 보세요';
        if (view === 'edit' && sheetKind === 'bg' && !sheetWrap.hidden) buildSheet('bg');
        toast(t('toastPhotoAdded'));
      };
      im.onerror = function () { toast(t('toastPhotoFail')); };
      im.src = reader.result;
    };
    reader.onerror = function () { toast(t('toastPhotoFail')); };
    reader.readAsDataURL(file);
  }
  $('#photoInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) usePhotoFile(f);
  });
  $('#promptPick').addEventListener('click', pickPhoto);

  /* ── 이벤트 연결 ── */
  $('#backBtn').addEventListener('click', function () { if (history.state && history.state.v === 'edit') history.back(); else showHome(); });
  $('#doneBack').addEventListener('click', function () { if (history.state && history.state.v === 'done') history.back(); else openEditor(false); });
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetBack').addEventListener('click', closeSheet);
  $('#doneBtn').addEventListener('click', function () { openDone(true); });
  $('#saveBtn').addEventListener('click', saveImage);
  $('#kakaoBtn').addEventListener('click', shareCard);
  $('#againBtn').addEventListener('click', function () { if (history.state && history.state.v === 'done') history.back(); else openEditor(false); });
  $('#newBtn').addEventListener('click', function () {
    localStorage.removeItem(KEY);
    state.stickers = []; selId = null;
    if (navDepth > 0) { try { history.go(-navDepth); } catch (e) {} }
    else { try { history.replaceState({ v: 'home' }, '', location.pathname + location.search); } catch (e) {} showHome(); }
    navDepth = 0;
    toast(t('toastNew'));
  });
  $('#heroNew').addEventListener('click', function () {
    if (homeMode === 'photo') startPhoto('hanji'); else startTheme('jeongmi');
  });
  $$('.modes button').forEach(function (b) {
    b.addEventListener('click', function () {
      homeMode = b.dataset.mode;
      $$('.modes button').forEach(function (x) {
        var on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      if (homeMode !== 'photo') homeFilter = 'all';
      buildHome();
    });
  });
  $('#draftGo').addEventListener('click', function () {
    var d = readDraft();
    if (!d) { toast(t('toastNoDraft')); return; }
    state = {
      mode: d.mode || '2d', theme: d.theme || 'jeongmi', frame: d.frame || 'hanji', photo: d.photo || null,
      scrim: d.scrim !== false,
      stickers: (d.stickers || []).map(function (s) { s.id = 's' + (++seq); return s; }),
      text: Object.assign({ to: '', msg: '', from: '', font: 'jua', color: '#FFF3D6', size: .072, pos: 'mid' }, d.text || {})
    };
    openEditor(true);
  });
  $$('[data-sheet]').forEach(function (b) {
    b.addEventListener('click', function () { openSheet(b.dataset.sheet); });
  });
  $$('.js-inst').forEach(function (b) { b.addEventListener('click', installTap); });
  $$('.js-share').forEach(function (b) { b.addEventListener('click', shareApp); });
  $$('#langBtn, #langBtn2, #langBtn3').forEach(function (b) {
    b.addEventListener('click', function () {
      LANG = LANG === 'ko' ? 'en' : 'ko';
      try { localStorage.setItem('wagleCard.lang', LANG); } catch (e) {}
      applyLang();
      toast(LANG === 'en' ? t('toastLang') : t('toastLangKo'));
    });
  });

  window.addEventListener('popstate', function (e) {
    var s = e.state;
    navDepth = !s || s.v === 'home' ? 0 : (s.v === 'edit' ? 1 : (s.v === 'done' ? 2 : 3));
    if (!s || s.v === 'home') { hideSheet(); setView('home'); showHome(); }
    else if (s.v === 'edit') { hideSheet(); setView('edit'); selId = null; buildQuick(); requestAnimationFrame(layoutStage); }
    else if (s.v === 'done') { hideSheet(); setView('done'); drawDone(); }
    else if (s.v === 'sheet') { buildSheet(s.k); sheetWrap.hidden = false; }
  });
  window.addEventListener('resize', function () { layoutStage(); if (view === 'done') drawDone(); });
  window.addEventListener('orientationchange', function () { setTimeout(layoutStage, 220); });

  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('on'); }, 2600);
  }

  /* ── 언어 적용 ── */
  function applyLang() {
    document.documentElement.lang = LANG === 'en' ? 'en' : 'ko';
    document.title = view === 'home' ? t('appTitle') : ('💌 ' + (state.mode === 'photo' ? frameName() : titleOf()));
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    $$('.lang').forEach(function (b) { b.textContent = LANG === 'ko' ? '🌐 EN' : '🌐 한'; });
    $('#heroH1').innerHTML = t('heroH1');
    $('#heroP').innerHTML = t('heroP');
    $('#photoPromptP').innerHTML = t('photoPromptP');
    $('#doneTip').innerHTML = t('doneTip');
    $('#textHint').textContent = t('textHint');
    syncDDay();
    if (view === 'home') buildHome();
    else if (view === 'edit') {
      $('#edTitle').textContent = state.mode === 'photo' ? frameName() : titleOf();
      $('#edSub').textContent = state.mode === 'photo' ? (LANG === 'en' ? 'Decorate your photo' : '사진 위에 꾸며 보세요') : (LANG === 'en' ? themeOf().subEn : themeOf().sub);
      buildQuick();
    } else if (view === 'done') {
      $('#doneSub').textContent = (state.mode === 'photo' ? frameName() : titleOf()) + ' · ' + t('doneSuffix');
    }
    if (sheetKind && !sheetWrap.hidden) buildSheet(sheetKind);
  }
  function syncDDay() {
    var now = new Date().setHours(0, 0, 0, 0);
    var seol = Math.ceil((new Date(2027, 1, 7) - now) / 86400000);
    var xmas = Math.ceil((new Date(2026, 11, 25) - now) / 86400000);
    $('#ddaySeollal').textContent = seol > 0 ? t('dSeollal', { n: seol }) : (seol === 0 ? t('dSeollalToday') : t('dSeollalPast'));
    $('#ddayXmas').textContent = xmas > 0 ? t('dXmas', { n: xmas }) : (xmas === 0 ? t('dXmasToday') : t('dXmasPast'));
  }

  /* ── 시작 ── */
  function init() {
    try { history.replaceState({ v: 'home' }, '', location.pathname + location.search); } catch (e) {}
    $('#heroSheep').src = svgUrl(STK.svg('sheepHanbok', false));
    applyLang();
    buildQuick();
    syncInstallBtn();
    document.fonts.ready.then(function () { if (view === 'edit') render(); if (view === 'done') drawDone(); });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () { try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {} });
    }
    /* 테스트·확인용 */
    window.__card = {
      state: function () {
        return JSON.parse(JSON.stringify({
          mode: state.mode, theme: state.theme, frame: state.frame, hasPhoto: !!state.photo,
          scrim: state.scrim, stickers: state.stickers, text: state.text, view: view,
          boxW: boxW, boxH: boxH, selId: selId, lang: LANG
        }));
      },
      themes: function () { return ART.themes.map(function (x) { return x.id; }); },
      stickers: function () { return STK.meta.length; },
      theme: function (id) { startTheme(id); },
      frame: function (id) { startPhoto(id); },
      add: addSticker,
      render: render,
      openTx: function () { openSheet('tx', true, true); },
      setLang: function (l) { LANG = l; applyLang(); },
      textHit: function () { return TEXT_HIT; },
      png: async function () { var b = await buildPNG(); return b ? { type: b.type, bytes: b.size } : null; },
      overflow: function () { return document.documentElement.scrollWidth - document.documentElement.clientWidth; }
    };
  }
  init();
})();
</script>
</body>
</html>
