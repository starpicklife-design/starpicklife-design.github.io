<!-- build: 2026-11-26 해미족 전구 켜기 v2 (Hamii Bulb Puzzle · bright day edition)

     · 저글링 시티 전기 담당 와트메이커(해미족)와 함께하는 전선 연결 퍼즐
     · v2: 밝고 화사한 낮/크림·스카이블루 톤, 1단계 3~5번이면 클리어, 💡 힌트 버튼
     · 격자 전선 타일을 손가락으로 톡톡 눌러 90도 회전 → 발전소에서 마을 전구까지 연결
     · 6단계(아주 쉬움 4×4 → 보통 5×5 → 도전 5×5 다중 전구), 이동 횟수·초기화·힌트·다음 단계
     · 클리어: 전구가 반짝 켜지고, 천사가 내려와 와트메이커 머리에 황금 왕관을 씌워 줌
     · 사람 출연 없음 · 외부 라이브러리 0개 · 광고 없음 · 기록은 이 기기에만
     · v3: 📤 공유 버튼(모바일 공유 시트 / PC는 링크 복사) · 📲 홈 화면에 바로가기 추가 버튼
           (안드로이드 크롬은 설치 창 바로, 그 밖에는 2초 안내 팝업 · 뒤로가기로 닫힘)
           + manifest.webmanifest·아이콘·sw.js(오프라인 껍데기) 추가 -->
<title>해미족 전구 켜기 · 와트메이커 전선 퍼즐</title>
<meta name="description" content="해미족 전구 켜기 — 저글링 시티 전기 담당 와트메이커와 함께 전선 타일을 돌려 발전소에서 마을 전구까지 불을 켜는 무료 두뇌 퍼즐. 1단계는 몇 번이면 클리어, 막히면 힌트까지. 6단계, 설치·광고 없이 폰에서 바로." />
<style>
:root{
  --ink:#1E3550; --ink2:#5E7C99; --ink3:#8CA6BC;
  --card:#FFFFFF; --line:#D8EAF8; --line2:#C2DDF0;
  --gold:#FFB020; --gold2:#FF8A00; --amber:#FFD97A;
  --mint:#3FB98C; --skyblue:#5FAEE0;
  --shadow:0 8px 22px rgba(70,120,160,.16);
  --warm:0 8px 20px rgba(226,158,44,.22);
  /* 단계별 파스텔 테마 기본값 (0단계 = 상큼한 스카이블루) */
  --t-sun:#D3EDFF; --t-1:#E2F4FF; --t-2:#F3FBFF; --t-3:#FDFAF2;
  --t-board:#B7E0FA; --t-boardbg1:#FFFFFF; --t-boardbg2:#E8F7FF;
  --t-accent:#2FA4E7; --t-accent2:#136FA3; --t-soft:#E1F4FF;
  --t-pri1:#96DCFF; --t-pri2:#3CADEA; --t-priink:#06364D;
  --t-ring:rgba(47,164,231,.28);
}
/* ── 6단계 색 테마: 단계가 올라갈 때마다 화면 색감이 바뀝니다 ── */
html[data-lv="1"]{--t-sun:#CFF7E6;--t-1:#E1FAF0;--t-2:#F3FDF8;--t-3:#FDFBF2;
  --t-board:#ADE7D0;--t-boardbg1:#FFFFFF;--t-boardbg2:#E9FBF3;
  --t-accent:#2BB98A;--t-accent2:#0E7A56;--t-soft:#E2F9EF;
  --t-pri1:#8FE8C6;--t-pri2:#3AC494;--t-priink:#06382A;--t-ring:rgba(43,185,138,.26)}
html[data-lv="2"]{--t-sun:#FFF0BE;--t-1:#FFF8DF;--t-2:#FFFDF0;--t-3:#FFFBF2;
  --t-board:#F3DFA0;--t-boardbg1:#FFFEFA;--t-boardbg2:#FFF9E4;
  --t-accent:#E8AE21;--t-accent2:#8A5E00;--t-soft:#FFF6DA;
  --t-pri1:#FFE492;--t-pri2:#FFC44F;--t-priink:#4A3206;--t-ring:rgba(232,174,33,.28)}
html[data-lv="3"]{--t-sun:#FFD8C9;--t-1:#FFEBE2;--t-2:#FFF7F2;--t-3:#FFFBF2;
  --t-board:#F8C9B7;--t-boardbg1:#FFFFFF;--t-boardbg2:#FFF0E9;
  --t-accent:#F07A5F;--t-accent2:#A33C24;--t-soft:#FFE8DF;
  --t-pri1:#FFC3B1;--t-pri2:#F58268;--t-priink:#5C1E0F;--t-ring:rgba(240,122,95,.26)}
html[data-lv="4"]{--t-sun:#E4DCFF;--t-1:#EFEBFF;--t-2:#F8F5FF;--t-3:#FFFAF2;
  --t-board:#CCC1F1;--t-boardbg1:#FFFFFF;--t-boardbg2:#F3EFFF;
  --t-accent:#8A79DF;--t-accent2:#4C3C9C;--t-soft:#EEE9FF;
  --t-pri1:#CDC2FF;--t-pri2:#8F7FE4;--t-priink:#2C2160;--t-ring:rgba(138,121,223,.26)}
html[data-lv="5"]{--t-sun:#FFE1AE;--t-1:#FFEFD3;--t-2:#FFF8EC;--t-3:#FFFBF2;
  --t-board:#F6CD8A;--t-boardbg1:#FFFEFA;--t-boardbg2:#FFF4DE;
  --t-accent:#EE9420;--t-accent2:#8F5008;--t-soft:#FFF2D9;
  --t-pri1:#FFD37C;--t-pri2:#F09A2E;--t-priink:#573005;--t-ring:rgba(238,148,32,.3)}
html{background:#F3FBFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;-webkit-text-size-adjust:100%;overflow-x:hidden}
html.big{font-size:21px}
body{margin:0;overflow-x:hidden;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  line-height:1.42;word-break:keep-all;overflow-wrap:break-word;
  background:
    radial-gradient(95% 44% at 50% -8%, var(--t-sun) 0%, rgba(255,255,255,0) 66%),
    linear-gradient(180deg,var(--t-1) 0%,var(--t-2) 42%,var(--t-3) 100%) fixed}
[hidden]{display:none !important}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--t-accent);outline-offset:2px}
p{margin:0}
.app{padding:0 .8rem calc(.9rem + env(safe-area-inset-bottom));max-width:430px;margin:0 auto}

/* ── 날짜·요일·날씨 (모든 앱 공통 기본) ── */
.datebar{width:100%;display:flex;align-items:center;gap:.4rem;justify-content:space-between;
  margin-top:calc(.35rem + env(safe-area-inset-top));padding:.42rem .7rem;border-radius:14px;
  background:rgba(255,255,255,.92);border:1px solid var(--line);font-size:.82rem;font-weight:800;
  box-shadow:0 3px 10px rgba(90,140,180,.1)}
.db-date{color:#24425F;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-right{display:flex;align-items:center;gap:.35rem;min-width:0}
.db-wx{color:#C47800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-wx.loading{color:var(--ink2)}
.db-place{font-size:.66rem;font-weight:800;color:var(--t-accent2);background:var(--t-soft);
  padding:.12rem .38rem;border-radius:999px;flex:0 0 auto;transition:color .45s ease,background .45s ease}

/* ── 머리말 ── */
.head{display:flex;align-items:center;gap:.5rem;padding:.6rem .1rem .45rem}
.head .badge{width:2.5rem;height:2.5rem;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%,#FFFDF4,#FFE6B4);
  box-shadow:inset 0 0 0 2px rgba(255,176,32,.55),0 3px 10px rgba(180,140,60,.25);overflow:hidden}
.head .badge svg{width:100%;height:100%;display:block}
.head h1{margin:0;font-size:1.16rem;font-weight:900;letter-spacing:-.03em;line-height:1.16;color:#16304C}
.head .sub{margin:.06rem 0 0;font-size:.72rem;font-weight:800;color:var(--ink2)}
.head .snd{margin-left:auto;flex:0 0 auto;width:2.2rem;height:2.2rem;border-radius:50%;
  background:#FFFFFF;border:1px solid var(--line);font-size:1rem;line-height:1;
  box-shadow:0 2px 8px rgba(90,140,180,.12)}
/* 공유·설치 아이콘 줄 (v3) — 세로 높이를 늘리지 않게 머리말 오른쪽에 작게 */
.head .htools{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:.3rem}
.head .htools .snd{margin-left:0;width:2.1rem;height:2.1rem;font-size:.98rem;
  display:flex;align-items:center;justify-content:center;padding:0}
.head .htools .snd:active{transform:scale(.94)}
.head .ttlwrap{flex:1 1 auto;min-width:0}
@media (max-width:372px){
  .head .htools{gap:.24rem}
  .head .htools .snd{width:1.98rem;height:1.98rem;font-size:.92rem}
  .head h1{font-size:1.02rem}
  .head .sub{font-size:.68rem}
}

/* ── 단계 칩 ── */
.stages{display:flex;gap:.34rem;padding:.1rem 0 .55rem;overflow-x:auto;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stageChip{flex:1 0 auto;min-width:2.5rem;padding:.34rem .2rem;border-radius:12px;font-size:.82rem;font-weight:900;
  background:#FFFFFF;border:1px solid var(--line);color:#6B88A6;text-align:center;
  box-shadow:0 2px 6px rgba(90,140,180,.09)}
.stageChip.done{color:#0E4331;background:linear-gradient(180deg,#A6ECCE,#63CFA8);border-color:transparent}
.stageChip.on{color:var(--t-priink);background:linear-gradient(180deg,var(--t-pri1),var(--t-pri2));border-color:transparent;
  box-shadow:0 4px 12px var(--t-ring)}

/* ── 판 ── */
.boardwrap{position:relative;margin:0 auto;width:100%}
.board{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:5px;padding:7px;border-radius:20px;
  background:linear-gradient(180deg,var(--t-boardbg1),var(--t-boardbg2));border:2px solid var(--t-board);
  box-shadow:0 10px 26px var(--t-ring),inset 0 1px 0 #FFFFFF;
  transition:border-color .45s ease,box-shadow .45s ease,background .45s ease}
.cell{position:relative;aspect-ratio:1/1;border-radius:12px;padding:0;display:block;overflow:hidden;
  background:linear-gradient(180deg,#FFFFFF,#F5FBFF);border:1px solid #E3EFF8;
  transition:transform .12s ease,box-shadow .2s ease,background .25s ease}
.cell.empty{border-color:rgba(140,180,210,.25);
  background-image:radial-gradient(circle,rgba(120,165,200,.22) 1.3px,transparent 1.5px);
  background-size:13px 13px;background-color:#FBFDFF}
.cell:disabled{cursor:default;opacity:1}
.cell.path:active{transform:scale(.94)}
.cell.path{box-shadow:inset 0 1px 0 #FFFFFF}
.cell.pw{background:linear-gradient(180deg,#FFFBF0,#FFF4DC)}
.cell.tapped{animation:pop .16s ease}
.cell.hintglow{animation:hintGlow 1s ease 2}
@keyframes hintGlow{
  0%{box-shadow:0 0 0 0 rgba(255,176,32,0),inset 0 0 0 0 rgba(255,176,32,0)}
  35%{box-shadow:0 0 0 4px rgba(255,176,32,.55),inset 0 0 14px rgba(255,206,92,.75)}
  100%{box-shadow:0 0 0 0 rgba(255,176,32,0),inset 0 0 0 0 rgba(255,176,32,0)}
}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(.92)}100%{transform:scale(1)}}

.pipes{position:absolute;inset:0;width:100%;height:100%;display:block;
  transition:transform .2s cubic-bezier(.3,1.4,.5,1);will-change:transform}
.pipeOut{fill:none;stroke:#CCDDEB;stroke-width:19;stroke-linecap:round}
.pipeIn{fill:none;stroke:#9CB6CB;stroke-width:9;stroke-linecap:round}
.hub{fill:#CCDDEB}
.cell.pw .pipeOut{stroke:#F0A62E}
.cell.pw .pipeIn{stroke:#FFCB57;filter:drop-shadow(0 0 5px rgba(255,170,30,.75))}
.cell.pw .hub{fill:#F0A62E}

/* 발전소 */
.cell.source{background:linear-gradient(180deg,#FFF8DE,#FFE8B0);border-color:rgba(255,176,32,.55)}
.srcbg{fill:#FFFCF0;stroke:#FFB020;stroke-width:3}
.bolt{fill:#FFA800;filter:drop-shadow(0 0 6px rgba(255,168,0,.6))}

/* 전구 */
.bulbpipe{pointer-events:none}
.cell.bulb{background:linear-gradient(180deg,#F6FCFF,#E7F3FF)}
.glass{fill:#E6F1FA;stroke:#A9C3D8;stroke-width:3;transition:fill .35s ease,stroke .35s ease}
.fil{fill:none;stroke:#A9C3D8;stroke-width:3.2;stroke-linecap:round;transition:stroke .35s ease}
.cap{fill:#D9C7A2;transition:fill .35s ease}
.rays{opacity:0;transition:opacity .4s ease}
.cell.lit .glass{fill:#FFE386;stroke:#FFC24A}
.cell.lit .fil{stroke:#D98A00}
.cell.lit .cap{fill:#C9A05A}
.cell.lit .rays{opacity:1}
.cell.lit{background:linear-gradient(180deg,#FFFBE8,#FFF0C4);box-shadow:0 0 0 2px rgba(255,194,74,.65),0 0 18px rgba(255,190,70,.45)}
.cell.lit .glasswrap{animation:bulbPulse 1.5s ease-in-out infinite}
@keyframes bulbPulse{0%,100%{filter:drop-shadow(0 0 5px rgba(255,196,74,.55))}50%{filter:drop-shadow(0 0 14px rgba(255,196,74,.95))}}
.glasswrap{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board.win .cell.lit .glasswrap{animation:bulbBurst .8s ease-out}
@keyframes bulbBurst{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ── 기록 줄 ── */
.stats{display:flex;gap:.4rem;margin:.55rem 0 .5rem}
.stat{flex:1;text-align:center;padding:.32rem .2rem;border-radius:12px;background:#FFFFFF;
  border:1px solid var(--line);font-size:.74rem;font-weight:800;color:var(--ink2);
  box-shadow:0 2px 8px rgba(90,140,180,.08)}
.stat b{display:block;font-size:1rem;color:var(--ink);font-weight:900;letter-spacing:-.02em;margin-top:.05rem}
.stat.hot b{color:var(--t-accent2)}

/* ── 버튼 ── */
.actions{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:.4rem}
.btn{width:100%;min-height:3.05rem;border-radius:16px;font-size:.9rem;font-weight:900;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;gap:.2rem;white-space:nowrap;
  transition:transform .12s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#FFFFFF;border:1.5px solid #CFE6F7;color:#2B5273;
  box-shadow:0 3px 10px rgba(90,140,180,.12)}
.btn.hint{background:linear-gradient(180deg,#FFFFFF,var(--t-soft));border:1.5px solid var(--t-board);color:var(--t-accent2);
  box-shadow:0 3px 10px var(--t-ring)}
.btn.primary{background:linear-gradient(180deg,var(--t-pri1),var(--t-pri2));color:var(--t-priink);
  box-shadow:0 6px 18px var(--t-ring)}
.btn:disabled{opacity:.42}

/* ── 와트메이커 말풍선 ── */
.mascot{display:flex;align-items:center;gap:.55rem;margin-top:.6rem;padding:.5rem .65rem;border-radius:16px;
  background:linear-gradient(180deg,#F1FCF7,#E8FAF2);
  border:1px solid #C9EDDC;box-shadow:0 3px 12px rgba(80,180,140,.1)}
.mface{width:3rem;height:3rem;flex:0 0 auto}
.mface svg{width:100%;height:100%;display:block}
.bubble{margin:0;font-size:.84rem;font-weight:800;line-height:1.35;color:#1F5140}
.bubble b{color:#0F8A63}
.mascot.cheer .mface{animation:cheer .55s ease 2}
.foot{margin:.4rem 0 .1rem;text-align:center;font-size:.7rem;font-weight:800;color:#93AAC0;letter-spacing:-.01em}
/* 다른 게임·홈으로 가기 칩 (v3) — 한 줄로 작게, 세로 공간 적게 */
.mgrow{display:flex;align-items:center;justify-content:center;gap:.34rem;margin-top:.5rem;flex-wrap:wrap}
.mg{display:inline-flex;align-items:center;justify-content:center;gap:.16rem;
  padding:.3rem .62rem;border-radius:999px;background:#FFFFFF;border:1.5px solid var(--line2);
  font-size:.75rem;font-weight:900;letter-spacing:-.02em;color:#2B5273;text-decoration:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(90,140,180,.11);transition:transform .12s ease,border-color .2s ease,color .2s ease}
.mg:active{transform:scale(.96)}
.mg[data-state="soon"]{border-style:dashed;color:#6B88A6}
.mg.now{background:linear-gradient(180deg,var(--t-pri1),var(--t-pri2));border-color:transparent;color:var(--t-priink);
  box-shadow:0 4px 12px var(--t-ring)}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-6px) rotate(-7deg)}70%{transform:translateY(-3px) rotate(7deg)}}

/* ── 클리어 축하 화면 (황금빛 낮하늘) ── */
.overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(.8rem + env(safe-area-inset-top)) .9rem calc(.8rem + env(safe-area-inset-bottom));
  background:radial-gradient(115% 72% at 50% 2%,#FFFDF3 0%,var(--t-sun) 30%,var(--t-2) 62%,var(--t-1) 100%);
  animation:overlayIn .35s ease both;overflow:hidden}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.sky{position:absolute;inset:0;pointer-events:none}
.sky i{position:absolute;width:4px;height:4px;border-radius:50%;background:#F0B62A;
  box-shadow:0 0 6px rgba(240,182,42,.55);animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.18;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}

.clearCard{position:relative;z-index:2;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center}
.cheer{font-size:1.32rem;font-weight:900;letter-spacing:-.03em;color:#6A4410;text-align:center;
  text-shadow:0 2px 12px rgba(255,255,255,.9);animation:cheerPop .6s .1s cubic-bezier(.2,1.4,.4,1) both}
.cheer small{display:block;margin-top:.16rem;font-size:.78rem;font-weight:800;color:#8A6535;text-shadow:none}
@keyframes cheerPop{from{opacity:0;transform:scale(.8) translateY(8px)}to{opacity:1;transform:none}}

.stage3d{position:relative;width:100%;height:298px;margin-top:.1rem}
.stage3d:after{content:'';position:absolute;z-index:0;left:50%;bottom:-4px;width:176px;height:24px;margin-left:-88px;border-radius:50%;
  background:radial-gradient(circle,rgba(150,110,50,.3),rgba(150,110,50,0) 72%)}
.hero{position:absolute;z-index:1;left:50%;bottom:0;width:174px;height:214px;margin-left:-87px;transform-origin:50% 100%;
  animation:hop .9s 1.85s cubic-bezier(.3,1.5,.5,1) both}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.03)}65%{transform:translateY(0) scale(.99)}100%{transform:translateY(0) scale(1)}}
.hero svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 14px rgba(140,100,50,.4))}
.hero .armL,.hero .armR{transform-box:fill-box;transform-origin:50% 90%}
.overlay.show .hero{animation:hop .9s 1.85s cubic-bezier(.3,1.5,.5,1) both}

.angel{position:absolute;right:-2px;top:0;width:132px;height:148px;opacity:0;z-index:4;
  transform-origin:50% 100%;
  animation:angelIn 1s .12s cubic-bezier(.2,.9,.3,1) both, angelFloat 3.4s 1.3s ease-in-out infinite alternate}
@keyframes angelIn{
  0%{opacity:0;transform:translate(52px,-96px) scale(.72) rotate(10deg)}
  55%{opacity:1;transform:translate(10px,-24px) scale(.94) rotate(2deg)}
  100%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}
}
@keyframes angelFloat{from{transform:translateY(0)}to{transform:translateY(-9px)}}

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

  /* ═════════ 날짜·요일·날씨 (모두 공통 기본) ═════════ */
  var KO_DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var WMO = {
    0: ['☀️', '맑음'], 1: ['🌤️', '대체로 맑음'], 2: ['⛅', '구름 조금'], 3: ['☁️', '흐림'],
    45: ['🌫️', '안개'], 48: ['🌫️', '안개'],
    51: ['🌦️', '이슬비'], 53: ['🌦️', '이슬비'], 55: ['🌦️', '이슬비'],
    56: ['🌧️', '어는 비'], 57: ['🌧️', '어는 비'],
    61: ['🌧️', '비'], 63: ['🌧️', '비'], 65: ['🌧️', '비'],
    66: ['🌧️', '어는 비'], 67: ['🌧️', '어는 비'],
    71: ['🌨️', '눈'], 73: ['🌨️', '눈'], 75: ['🌨️', '눈'], 77: ['🌨️', '눈'],
    80: ['🌦️', '소나기'], 81: ['🌦️', '소나기'], 82: ['🌧️', '소나기'],
    85: ['🌨️', '눈 소나기'], 86: ['🌨️', '눈 소나기'],
    95: ['⛈️', '천둥번개'], 96: ['⛈️', '천둥번개'], 99: ['⛈️', '천둥번개']
  };
  var WX_DEFAULT = { lat: 35.23, lon: 128.89, place: '김해' };
  var LS_WX = 'hamiiBulb.wx';
  var wxNow = null, wxAt = 0, wxBusy = false, wxSeq = 0, wxRank = 0, wxPlace = WX_DEFAULT.place, wxFailed = false;
  var WX_TTL = 20 * 60 * 1000;

  function renderToday() {
    var d = new Date();
    $('#todayDate').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + KO_DOW[d.getDay()] + ')';
    var txt, loading = false;
    if (wxNow) txt = wxNow.emoji + ' ' + wxNow.ko + ' ' + wxNow.t + '°';
    else if (wxFailed) txt = '날씨 정보 없음';
    else { txt = '날씨 확인 중'; loading = true; }
    var el = $('#todayWx');
    el.textContent = txt;
    el.classList.toggle('loading', loading);
    $('#wxPlace').textContent = wxPlace;
    $('#todayCard').setAttribute('aria-label',
      '오늘 ' + $('#todayDate').textContent + ', ' + txt + ' — 누르면 현위치 날씨로 새로고침');
  }
  function loadWxCache() {
    try {
      var raw = localStorage.getItem(LS_WX);
      if (!raw) return;
      var j = JSON.parse(raw);
      if (!j || typeof j.t !== 'number') return;
      if (Date.now() - j.at > 12 * 60 * 60 * 1000) return;
      var m = WMO[j.code] || ['🌡️', '날씨'];
      wxNow = { emoji: m[0], ko: m[1], t: Math.round(j.t) };
      wxAt = j.at;
      wxPlace = j.place || WX_DEFAULT.place;
    } catch (e) {}
  }
  function saveWxCache(code, t) {
    try { localStorage.setItem(LS_WX, JSON.stringify({ code: code, t: t, at: Date.now(), place: wxPlace })); } catch (e) {}
  }
  function wxUrl(lat, lon) {
    return 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code&timezone=auto';
  }
  function fetchWx(lat, lon, rank) {
    if (!window.fetch || navigator.onLine === false) { wxFailed = true; renderToday(); return Promise.resolve(false); }
    rank = rank || 1;
    wxFailed = false;
    var seq = wxSeq;
    var ctl = window.AbortController ? new AbortController() : null;
    var to = null;
    if (ctl) to = setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 8000);
    return fetch(wxUrl(lat, lon), ctl ? { cache: 'no-store', signal: ctl.signal } : { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (to) clearTimeout(to);
        var c = j && j.current;
        if (!c || typeof c.temperature_2m !== 'number') { wxFailed = true; renderToday(); return false; }
        if (seq !== wxSeq || rank < wxRank) return false;
        wxRank = rank;
        var m = WMO[c.weather_code] || ['🌡️', '날씨'];
        wxNow = { emoji: m[0], ko: m[1], t: Math.round(c.temperature_2m) };
        wxAt = Date.now();
        saveWxCache(c.weather_code, c.temperature_2m);
        renderToday();
        return true;
      })
      .catch(function () { if (to) clearTimeout(to); wxFailed = true; renderToday(); return false; });
  }
  function geoCoords() {
    return new Promise(function (resolve) {
      if (!navigator.geolocation) return resolve(null);
      try {
        navigator.geolocation.getCurrentPosition(function (pos) {
          var c = pos && pos.coords;
          if (!c) return resolve(null);
          resolve({ lat: Math.round(c.latitude * 100) / 100, lon: Math.round(c.longitude * 100) / 100 });
        }, function () { resolve(null); }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
      } catch (e) { resolve(null); }
    });
  }
  function loadWeather() {
    renderToday();
    if (!wxAt || Date.now() - wxAt > WX_TTL) {
      if (wxBusy) return;
      wxBusy = true; wxSeq++;
      fetchWx(WX_DEFAULT.lat, WX_DEFAULT.lon, 1).then(function () { wxBusy = false; });
    }
    try {
      if (navigator.geolocation && navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'geolocation' }).then(function (st) {
          if (!st || st.state !== 'granted') return;
          geoCoords().then(function (c) {
            if (c) { wxPlace = '내 위치'; fetchWx(c.lat, c.lon, 2); }
          });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function refreshWeather() {
    if (navigator.onLine === false) { toast('인터넷이 없어 날씨를 새로 받지 못했어요.'); return; }
    function fallback() {
      wxPlace = WX_DEFAULT.place;
      return fetchWx(WX_DEFAULT.lat, WX_DEFAULT.lon, 1).then(function (ok) {
        toast(ok ? '김해 날씨로 보여 드려요.' : '날씨를 받지 못했어요. 잠시 뒤 다시 눌러 주세요.');
      });
    }
    wxSeq++;
    if (!navigator.geolocation) { fallback(); return; }
    toast('현위치 날씨를 확인하는 중…');
    geoCoords().then(function (c) {
      if (!c) { fallback(); return; }
      fetchWx(c.lat, c.lon, 2).then(function (ok) {
        if (ok) { wxPlace = '내 위치'; renderToday(); toast('현위치 날씨로 새로 불러왔어요.'); }
        else fallback();
      });
    });
  }
  $('#todayCard').addEventListener('click', refreshWeather);

  var toastEl = null, toastTo = 0;
  function toast(msg) {
    if (!toastEl) {

    var srcKey = idx(S[0], S[1]);
    var bulbKeys = {};
    bulbs.forEach(function (b) { bulbKeys[idx(b[0], b[1])] = true; });

    var tree = {};             /* key -> {이웃 key: true} */
    var occ = {};
    tree[srcKey] = {};
    occ[srcKey] = true;

    function findPath(startKey, targetKey) {
      var seen = {}, prev = {}, stack = [startKey], found = false;
      seen[startKey] = true;
      while (stack.length) {
        var cur = stack.pop();
        if (cur === targetKey) { found = true; break; }
        var cr = Math.floor(cur / n), cc = cur % n;
        var nb = [];
        for (var d = 0; d < 4; d++) {
          var nr = cr + D4[d][0], nc = cc + D4[d][1];
          if (nr < 0 || nr >= n || nc < 0 || nc >= n) continue;
          var nk = nr * n + nc;
          if (seen[nk]) continue;
          if (occ[nk] && nk !== targetKey) continue;         /* 이미 깔린 길과 겹치지 않게 */
          if (bulbKeys[nk] && nk !== targetKey) continue;     /* 다른 전구는 통과 금지 */
          nb.push(nk);
        }
        shuffle(nb);
        for (var b2 = 0; b2 < nb.length; b2++) {
          var k2 = nb[b2];
          if (seen[k2]) continue;
          seen[k2] = true; prev[k2] = cur;
          stack.push(k2);
        }
      }
      if (!found) return null;
      var path = [], cur2 = targetKey;
      while (cur2 !== startKey && prev[cur2] !== undefined) { path.push(cur2); cur2 = prev[cur2]; }
      if (cur2 !== startKey) return null;
      return path.reverse();
    }

    for (var bi = 0; bi < bulbs.length; bi++) {
      var targetKey = idx(bulbs[bi][0], bulbs[bi][1]);
      var starts = shuffle(Object.keys(tree).map(Number)).slice(0, 10);
      var got = null;
      /* 여러 번 시도해 가장 긴 길을 고릅니다(너무 쉬운 판 방지) */
      for (var si = 0; si < starts.length; si++) {
        for (var tr = 0; tr < 4; tr++) {
          var path = findPath(starts[si], targetKey);
          if (path && path.length && (!got || path.length > got.path.length)) {
            got = { start: starts[si], path: path };
          }
        }
        if (got && got.path.length >= n * 2) break;
      }
      if (!got) return null;
      var prevKey = got.start;
      for (var pi = 0; pi < got.path.length; pi++) {
        var kk = got.path[pi];
        if (!tree[prevKey]) tree[prevKey] = {};
        if (!tree[kk]) tree[kk] = {};
        tree[prevKey][kk] = true;
        tree[kk][prevKey] = true;
        occ[kk] = true;
        prevKey = kk;
      }
    }

    function dirTo(a, b) {
      var ar = Math.floor(a / n), ac = a % n, br = Math.floor(b / n), bc = b % n;
      if (br === ar - 1 && bc === ac) return 0;
      if (br === ar && bc === ac + 1) return 1;
      if (br === ar + 1 && bc === ac) return 2;
      if (br === ar && bc === ac - 1) return 3;
      return -1;
    }

    var arr = new Array(n * n).fill(null);
    Object.keys(tree).forEach(function (ks) {
      var k = +ks, mask = 0;
      Object.keys(tree[k]).forEach(function (ns) {
        var d = dirTo(k, +ns);
        if (d >= 0) mask |= BIT[d];
      });
      var kind = 'path';
      if (k === srcKey) kind = 'source';
      else if (bulbKeys[k]) kind = 'bulb';
      arr[k] = { kind: kind, base: mask, rot: 0, spin: 0 };
    });

    var sc = scramblePath(arr, cfg);

    var pathCount = 0;
    arr.forEach(function (x) { if (x && x.kind === 'path') pathCount++; });
    return { n: n, cells: arr, pathCount: pathCount, taps: sc.total };
  }

  /* 목표 길이·탭 수에 맞는 판이 나올 때까지 여러 번 만들고, 최선의 판을 씁니다 */
  function genPuzzle(cfg) {
    var mid = (cfg.taps[0] + cfg.taps[1]) / 2;
    var bestP = null, bestScore = 1e9, anyP = null;
    for (var t = 0; t < 90; t++) {
      var pz = genOnce(cfg);
      if (!pz) continue;
      if (!anyP || pz.pathCount > anyP.pathCount) anyP = pz;
      if (pz.pathCount < (cfg.minCells || 0)) continue;
      if (pz.taps >= cfg.taps[0] && pz.taps <= cfg.taps[1]) return pz;
      var score = Math.abs(pz.taps - mid);
      if (score < bestScore) { bestScore = score; bestP = pz; }
    }
    return bestP || anyP;
  }

  function startLevel(i, silent) {
    var cfg = LEVELS[i], puzzle = null, tries = 0, last = null;
    while (tries++ < 40) {
      var cand = genPuzzle(cfg);
      if (!cand) continue;
      last = cand;
      cells = cand.cells; N = cand.n;
      if (litCount() > 0) continue;              /* 처음부터 켜져 있으면 다시 */
      if (i === 0 && tapsNeeded() > cfg.taps[1]) continue;
      puzzle = cand; break;
    }
    if (!puzzle) puzzle = last;
    if (!puzzle) { toast('판을 만들지 못했어요. 다시 눌러 주세요.'); return; }

    level = i;
    N = puzzle.n;
    cells = puzzle.cells;
    moves = 0;
    cleared = false;
    hintsUsed = 0;
    setTheme(i);
    hideOverlay(true);
    board.classList.remove('win');
    $('#mascot').classList.remove('cheer');

    /* 처음 상태 저장 */
    initialRots = cells.map(function (c) { return c && c.kind === 'path' ? c.rot : 0; });

    buildBoard();
    renderStages();
    update(true);
    try { localStorage.setItem('hamiiBulb.stage', String(i)); } catch (e) {}
    if (!silent) { /* 조용히 시작 */ }
  }

  function litCount() {
    var p = poweredSet(), n = 0;
    cells.forEach(function (c, k) { if (c && c.kind === 'bulb' && p[k]) n++; });
    return n;
  }
  function bulbTotal() {
    var n = 0;
    cells.forEach(function (c) { if (c && c.kind === 'bulb') n++; });
    return n;
  }

  function pipeSVG(mask, cls) {
    var dirs = [], i;
    if (mask & 1) dirs.push('M50 50 L50 -8');
    if (mask & 2) dirs.push('M50 50 L108 50');
    if (mask & 4) dirs.push('M50 50 L50 108');
    if (mask & 8) dirs.push('M50 50 L-8 50');
    var out = '', inn = '';
    for (i = 0; i < dirs.length; i++) {
      out += '<path class="pipeOut" d="' + dirs[i] + '"/>';
      inn += '<path class="pipeIn" d="' + dirs[i] + '"/>';
    }
    return '<svg class="pipes ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
      out + inn + '<circle class="hub" cx="50" cy="50" r="10"/></svg>';
  }

  function sourceSVG(mask) {
    var d = 'M50 50 L50 -8';
    if (mask & 2) d = 'M50 50 L108 50';
    else if (mask & 4) d = 'M50 50 L50 108';
    else if (mask & 8) d = 'M50 50 L-8 50';
    return '<svg class="pipes" viewBox="0 0 100 100" aria-hidden="true">' +
      '<path class="pipeOut" d="' + d + '"/><path class="pipeIn" d="' + d + '"/></svg>' +
      '<svg class="glasswrap" viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle class="srcbg" cx="50" cy="50" r="27"/>' +
      '<path class="bolt" d="M55 26 L37 56 H49 L45 74 L63 44 H51 Z"/></svg>';
  }

  function bulbSVG(mask) {
    var d = 'M50 50 L50 -8';
    if (mask & 2) d = 'M50 50 L108 50';
    else if (mask & 4) d = 'M50 50 L50 108';
    else if (mask & 8) d = 'M50 50 L-8 50';
    var rays = '';
    for (var a = 0; a < 8; a++) {
      var ang = a * 45 * Math.PI / 180;
      var x1 = 50 + Math.cos(ang) * 25, y1 = 41 + Math.sin(ang) * 25;
      var x2 = 50 + Math.cos(ang) * 35, y2 = 41 + Math.sin(ang) * 35;
      rays += '<path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' L' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
        '" stroke="#FFC24A" stroke-width="4.5" stroke-linecap="round"/>';
    }
    return '<svg class="pipes bulbpipe" viewBox="0 0 100 100" aria-hidden="true">' +
      '<path class="pipeOut" d="' + d + '"/><path class="pipeIn" d="' + d + '"/></svg>' +
      '<svg class="glasswrap" viewBox="0 0 100 100" aria-hidden="true">' +
      '<g class="rays">' + rays + '</g>' +
      '<path class="glass" d="M50 15 a23 23 0 0 1 13.5 41.6 c-2.6 3.2-3.6 6.2-3.6 9.4 H40.1 c0-3.2-1-6.2-3.6-9.4 A23 23 0 0 1 50 15 Z"/>' +
      '<path class="fil" d="M42 45 q4 -9 8 0 q4 9 8 0"/>' +
      '<path class="fil" d="M50 66 v8"/>' +
      '<rect class="cap" x="40" y="74" width="20" height="4.6" rx="2.3"/>' +
      '<rect class="cap" x="42.5" y="81" width="15" height="4.6" rx="2.3"/>' +
      '</svg>';
  }

  function buildBoard() {
    board.style.setProperty('--n', N);
    board.innerHTML = '';
    cellEls = [];
    cells.forEach(function (c, k) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.k = String(k);
      if (!c) { b.className = 'cell empty'; b.disabled = true; b.setAttribute('aria-hidden', 'true'); }
      else if (c.kind === 'path') {
        b.className = 'cell path';
        b.innerHTML = pipeSVG(c.base);
        b.querySelector('.pipes').style.transform = 'rotate(' + c.spin + 'deg)';
        b.setAttribute('aria-label', (Math.floor(k / N) + 1) + '줄 ' + (k % N + 1) + '칸 전선 돌리기');
      } else if (c.kind === 'source') {
        b.className = 'cell source'; b.disabled = true;
        b.innerHTML = sourceSVG(c.base);
        b.setAttribute('aria-label', '발전소');
      } else if (c.kind === 'bulb') {
        b.className = 'cell bulb'; b.disabled = true;
        b.innerHTML = bulbSVG(c.base);
        b.setAttribute('aria-label', '마을 전구');
      }
      board.appendChild(b);
      cellEls.push(b);
    });
  }

  function renderStages() {
    stagesEl.innerHTML = '';
    LEVELS.forEach(function (lv, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'stageChip' + (i === level ? ' on' : '') + (done[i] ? ' done' : '');
      b.textContent = done[i] && i !== level ? '✓' : String(i + 1);
      b.setAttribute('aria-label', (i + 1) + '단계 ' + lv.diff + (done[i] ? ' (완료)' : ''));
      b.addEventListener('click', function () { if (i !== level) startLevel(i); });
      stagesEl.appendChild(b);
    });
    var on = stagesEl.querySelector('.stageChip.on');
    if (on && on.scrollIntoView) { try { on.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {} }
  }

  var tipEl = $('#tipText');
  function setHintEnabled(on) { hintBtn.disabled = !on; }

  function update(first) {
    var p = poweredSet(), lit = 0, total = 0;
    cells.forEach(function (c, k) {
      var el = cellEls[k];
      if (!c || !el) return;
      var on = !!p[k];
      if (c.kind === 'bulb') {
        total++;
        if (on) lit++;
        el.classList.toggle('lit', on);
        el.classList.toggle('pw', on);
        el.setAttribute('aria-label', on ? '켜진 마을 전구' : '꺼진 마을 전구');
      } else if (c.kind === 'path') {
        el.classList.toggle('pw', on);
      }
    });
    $('#statMoves').textContent = moves + '회';
    $('#statLit').textContent = lit + '/' + (total || 1);
    var b = best[level];
    $('#statBest').textContent = b ? b + '회' : '-';
    setHintEnabled(!cleared && hasWrongTile());

    /* 말풍선 */
    if (!cleared) {
      if (lit > 0 && lit < total) tipEl.innerHTML = '좋아요! <b>' + lit + '개</b> 켜졌어요. 전구 <b>' + (total - lit) + '개</b>만 남았어요!';
      else if (moves === 0) tipEl.innerHTML = LEVEL_TIPS[level] || LEVEL_TIPS[0];
      else if (lit === 0) tipEl.innerHTML = '발전소 ⚡ 에서 출발해 전구 💡 까지 <b>끊김 없이</b> 이어지게 맞춰 보세요.';
      else tipEl.innerHTML = '한 칸씩 <b>톡톡</b> 돌려 보세요. 굽은 전선은 네 번 돌면 제자리로 돌아와요.';
    }
    if (lit === total && total > 0 && !cleared) onWin();
  }

  function onWin() {
    cleared = true;
    board.classList.add('win');
    $('#mascot').classList.add('cheer');
    if (hintsUsed === 0 && (!best[level] || moves < best[level])) {
      best[level] = moves;
      try { localStorage.setItem('hamiiBulb.best', JSON.stringify(best)); } catch (e) {}
    }
    done[level] = true;
    try { localStorage.setItem('hamiiBulb.done', JSON.stringify(done)); } catch (e) {}
    renderStages();
    setHintEnabled(false);
    $('#statBest').textContent = best[level] ? best[level] + '회' : '-';
    winChime();
    setTimeout(function () { showOverlay(); }, 850);
  }

  /* ── 클리어 축하 (천사가 왕관 씌우기) ── */
  function makeSky() {
    var sky = $('#sky'), html = '';
    for (var i = 0; i < 34; i++) {
      html += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 78).toFixed(1) +
        '%;animation-delay:' + (Math.random() * 2.6).toFixed(2) + 's;opacity:.6"></i>';
    }
    sky.innerHTML = html;
  }
  function makeSparks() {
    var sp = $('#sparks'), html = '';
    var pts = [
      [16, 30], [30, 12], [44, 4], [58, 6], [72, 16], [84, 30],
      [8, 52], [92, 50], [24, 56], [66, 58], [40, 62], [78, 64]
    ];
    for (var i = 0; i < pts.length; i++) {
      html += '<i style="left:' + pts[i][0] + '%;top:' + (14 + pts[i][1] * 0.55).toFixed(0) +
        '%;animation-delay:' + (1.62 + (i % 6) * 0.22).toFixed(2) + 's"></i>';
    }
    sp.innerHTML = html;

    /* 왕관 둘레에 늘 반짝이는 별가루 */
    var tw = $('#twinkles'), th = '';
    var ring = [[40, 14], [50, 10], [60, 14], [34, 22], [66, 22], [44, 6], [57, 5], [28, 30], [72, 30]];
    for (var j = 0; j < ring.length; j++) {
      th += '<i style="left:' + ring[j][0] + '%;top:' + (ring[j][1] + 20) +
        '%;animation-delay:' + (j * 0.26).toFixed(2) + 's"></i>';
    }
    tw.innerHTML = th;
  }
  function showOverlay() {
    var st = $('#cheerText');
    var isLast = level === LEVELS.length - 1;
    st.innerHTML = '불이 다 켜졌어요!<small>' + (isLast ? '천사가 왕관을 씌워 줬어요 · 모든 단계 완료!' : '천사가 반짝이는 왕관을 씌워 줬어요') + '</small>';
    $('#clearResult').innerHTML = '<b>' + (level + 1) + '단계</b> · ' + moves + '번 만에 성공' +
      (hintsUsed ? ' · 힌트 ' + hintsUsed + '회' : '') +
      (best[level] ? ' · 최고 ' + best[level] + '번' : '');
    $('#nextBtn2').textContent = isLast ? '🏁 처음부터' : '다음 단계 →';
    var pl = PRAISE[level] || PRAISE[0];
    var pr = pl[Math.floor(Math.random() * pl.length)];
    $('#praiseEn').textContent = pr.en;
    $('#praiseKo').textContent = pr.ko;
    $('#heroBox').innerHTML = hamsterSVG(true);
    $('#angelBox').innerHTML = angelSVG();
    /* 왕관은 와트메이커 머리 위 슬롯에 */
    var hero = $('#heroBox');
    var slot = document.createElement('div');
    slot.className = 'crownSlot';
    slot.innerHTML = '<div class="crown">' + crownSVG() + '</div>';
    hero.appendChild(slot);

    makeSky();
    makeSparks();

    overlay.hidden = false;
    /* 애니메이션 매번 처음부터 */
    overlay.classList.remove('show');
    void overlay.offsetWidth;
    overlay.classList.add('show');
    try { history.pushState({ bulbClear: 1 }, ''); overlayPushed = true; } catch (e) {}
  }
  var overlayPushed = false;
  function hideOverlay() {
    if (overlay.hidden) return;
    overlay.hidden = true;
    overlay.classList.remove('show');
  }
  /* 버튼으로 닫을 때는 우리가 쌓은 기록 한 칸도 같이 되돌립니다 */
  function closeOverlayByButton() {
    hideOverlay();
    if (overlayPushed) {
      overlayPushed = false;
      try { history.back(); } catch (e) {}
    }
  }
  function nextLevel() {
    var isLast = level === LEVELS.length - 1;
    closeOverlayByButton();
    startLevel(isLast ? 0 : level + 1);
  }
  function againLevel() {
    closeOverlayByButton();
    resetLevel();
  }

  function resetLevel() {
    moves = 0;
    cleared = false;
    board.classList.remove('win');
    $('#mascot').classList.remove('cheer');
    cells.forEach(function (c, k) {
      if (!c || c.kind !== 'path') return;
      c.rot = initialRots[k] || 0;
      c.spin = c.rot * 90;
      var el = cellEls[k];
      if (el) {
        var svg = el.querySelector('.pipes');
        if (svg) svg.style.transform = 'rotate(' + c.spin + 'deg)';
      }
    });
    update(true);
    beep(420, 0.1, 'sine', 0.04);
  }

  /* 💡 힌트 — 방향이 안 맞은 전선 하나를 정답으로 맞추고 반짝입니다 */
  function useHint() {
    if (cleared) return;
    var p = poweredSet();
    var pool = [], any = [], frontier = [];
    cells.forEach(function (c, k) {
      if (!isWrong(c)) return;
      any.push(k);
      if (p[k]) return;
      pool.push(k);
      /* 전기가 이미 들어온 칸과 맞닿은 곳을 먼저 (더 직관적인 도움) */
      var r = Math.floor(k / N), col = k % N;
      for (var d = 0; d < 4; d++) {
        var nr = r + D4[d][0], nc = col + D4[d][1];
        if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
        if (p[nr * N + nc]) { frontier.push(k); break; }
      }
    });
    var use = frontier.length ? frontier : (pool.length ? pool : any);
    if (!use.length) {
      toast('지금은 모든 전선 방향이 맞아 있어요. 발전소에서 전구까지 길만 확인해 보세요.');
      setHintEnabled(false);
      return;
    }
    var k = use[Math.floor(Math.random() * use.length)];
    var c = cells[k];
    c.rot = 0;
    var s = ((c.spin % 360) + 360) % 360;
    c.spin += (360 - s) % 360;          /* 앞으로 돌아가며 맞춰집니다 */
    var el = cellEls[k];
    if (el) {
      var svg = el.querySelector('.pipes');
      if (svg) svg.style.transform = 'rotate(' + c.spin + 'deg)';
      el.classList.remove('hintglow');
      void el.offsetWidth;
      el.classList.add('hintglow');
      setTimeout(function () { el.classList.remove('hintglow'); }, 2200);
    }
    hintsUsed++;
    beep(880, 0.14, 'sine', 0.05);
    toast('💡 전선 하나를 맞춰 드렸어요. 이어서 가 볼까요?');
    update();
  }

  /* 타일 돌리기 */
  board.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.cell') : null;
    if (!el || el.disabled) return;
    var k = parseInt(el.dataset.k, 10);
    var c = cells[k];
    if (!c || c.kind !== 'path' || cleared) return;
    c.rot = (c.rot + 1) % 4;
    c.spin += 90;
    moves++;
    var svg = el.querySelector('.pipes');
    if (svg) svg.style.transform = 'rotate(' + c.spin + 'deg)';
    el.classList.remove('tapped');
    void el.offsetWidth;
    el.classList.add('tapped');
    beep(520 + (c.rot * 40), 0.06, 'square', 0.028);
    update();
  });

  $('#resetBtn').addEventListener('click', function () { resetLevel(); });
  hintBtn.addEventListener('click', useHint);
  $('#nextBtn').addEventListener('click', function () { startLevel(level === LEVELS.length - 1 ? 0 : level + 1); });
  $('#nextBtn2').addEventListener('click', nextLevel);
  $('#againBtn').addEventListener('click', againLevel);

  /* ═════════ 📤 공유 · 📲 홈 화면에 바로가기 (v3) ═════════ */
  var shareBtn = $('#shareBtn'), installBtn = $('#installBtn');
  var instWrap = $('#instWrap'), instPushed = false;
  var INST_SITE = 'https://starpicklife-design.github.io/bulb-game/';

  function copyText(txt, ok, fail) {
    function legacy() {
      try {
        var ta = document.createElement('textarea');
        ta.value = txt;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        try { ta.setSelectionRange(0, txt.length); } catch (e) {}
        var done = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
        if (done) ok(); else fail();
      } catch (e) { fail(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText && location.protocol !== 'file:') {
      try { navigator.clipboard.writeText(txt).then(ok, legacy); return; } catch (e) {}
    }
    legacy();
  }

  function shareGame() {
    var url = location.protocol === 'file:' ? INST_SITE : location.href;
    var payload = {
      title: '해미족 전구 켜기 · 와트메이커 전선 퍼즐',
      text: '전선 타일을 톡톡 돌려 발전소에서 마을 전구까지 불을 켜는 무료 퍼즐이에요. 설치·광고 없이 폰에서 바로! ⚡',
      url: url
    };
    function copyFallback() {
      copyText(payload.text + '\n' + url,
        function () { toast('🔗 게임 링크가 복사됐어요!'); },
        function () { toast('링크를 복사하지 못했어요. 주소창의 주소를 길게 눌러 복사해 주세요.'); });
    }
    var usable = true;
    try { if (navigator.canShare && !navigator.canShare(payload)) usable = false; } catch (e) {}
    if (navigator.share && usable) {
      try {
        var r = navigator.share(payload);
        if (r && r.then) r.then(function () {}, function (err) {
          if (err && err.name === 'AbortError') return;
          copyFallback();
        });
        return;
      } catch (e) {}
    }
    copyFallback();
  }

  var instPrompt = null, instDone = false;
  function isStandaloneNow() {
    try {
      if (window.matchMedia('(display-mode: standalone)').matches) return true;
      if (window.matchMedia('(display-mode: minimal-ui)').matches) return true;
    } catch (e) {}
    if (navigator.standalone === true) return true;
    if (/^android-app:\/\//i.test(document.referrer || '')) return true;
    return false;
  }
  function uaIsIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1); }
  function uaIsAndroid() { return /Android/i.test(navigator.userAgent || ''); }
  function uaIsSamsung() { return /SamsungBrowser/i.test(navigator.userAgent || ''); }
  function inAppBrowser() { return /KAKAOTALK|Instagram|NAVER|FBAN|FBAV|Line\//i.test(navigator.userAgent || ''); }
  function chromeIntentUrl() {
    var host = location.host || 'starpicklife-design.github.io';
    var path = (location.pathname || '/bulb-game/') + (location.search || '');
    return 'intent://' + host + path + '#Intent;scheme=https;package=com.android.chrome;end';
  }
  function syncInstallBtn() {
    if (installBtn) installBtn.hidden = instDone || isStandaloneNow();
  }

  function instStepsHTML() {
    var rows;
    if (uaIsIOS()) {
      rows = [
        ['화면 아래(또는 위)의 <b>공유 버튼 ⤴</b>을 눌러요', '⤴'],
        ['목록을 내려 <b>홈 화면에 추가</b>를 눌러요', '➕'],
        ['오른쪽 위 <b>추가</b>를 누르면 끝!', '✅']
      ];
    } else if (uaIsSamsung()) {
      rows = [
        ['화면 아래의 <b>메뉴 ≡</b>를 눌러요', '≡'],
        ['<b>홈 화면에 추가</b>를 눌러요', '➕'],
        ['<b>추가</b>를 누르면 끝!', '✅']
      ];
    } else if (uaIsAndroid()) {
      rows = [
        ['오른쪽 위 <b>점 세 개 ⋮</b>를 눌러요', '⋮'],
        ['<b>홈 화면에 추가</b>(또는 앱 설치)를 눌러요', '➕'],
        ['<b>추가</b>를 누르면 끝!', '✅']
      ];
    } else {
      rows = [
        ['주소창 오른쪽의 <b>설치 아이콘</b>이나 ⋮ 를 눌러요', '⋮'],
        ['<b>설치</b>를 누르면 앱 창에서 열려요', '➕'],
        ['휴대폰에서 열면 <b>홈 화면</b>에 담을 수 있어요', '📱']
      ];
    }
    return rows.map(function (r, i) {
      return '<li><span class="num">' + (i + 1) + '</span><span class="txt">' + r[0] +
        '</span><span class="ui" aria-hidden="true">' + r[1] + '</span></li>';
    }).join('');
  }
  function instTipHTML() {
    if (uaIsIOS()) return '사파리 기준이에요. 크롬으로 열었다면 오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b>를 눌러 주세요.';
    if (uaIsSamsung()) return '삼성 인터넷 메뉴 ≡ 는 화면 <b>아래 가운데</b>에 있어요.';
    if (uaIsAndroid()) return '삼성 인터넷은 <b>≡</b> → 홈 화면에 추가, 아이폰은 <b>공유 ⤴</b> → 홈 화면에 추가예요.';
    return '휴대폰 크롬은 <b>⋮ → 홈 화면에 추가</b>, 아이폰 사파리는 <b>공유 ⤴ → 홈 화면에 추가</b>예요.';
  }
  function openInstall() {
    $('#instSteps').innerHTML = instStepsHTML();
    $('#instTip').innerHTML = instTipHTML();
    var ch = $('#instChrome'), show = uaIsAndroid() && inAppBrowser();
    ch.hidden = !show;
    if (show) ch.setAttribute('href', chromeIntentUrl());
    instWrap.hidden = false;
    try { history.pushState({ bulbInstall: 1 }, ''); instPushed = true; } catch (e) {}
    try { $('#instOk').focus({ preventScroll: true }); } catch (e) {}
  }
  function closeInstall(byButton) {
    if (instWrap.hidden) return;
    instWrap.hidden = true;
    if (instPushed) {
      instPushed = false;
      if (byButton) { try { history.back(); } catch (e) {} }
    }
  }
  function installTap() {
    if (isStandaloneNow()) { toast('이미 홈 화면 앱으로 열려 있어요.'); return; }
    if (instPrompt) {
      var dp = instPrompt; instPrompt = null;
      try {
        dp.prompt();
        if (dp.userChoice && dp.userChoice.then) {
          dp.userChoice.then(function (r) {
            if (r && r.outcome === 'accepted') { instDone = true; syncInstallBtn(); toast('홈 화면에 넣었어요!'); }
          }, function () {});
        }
        return;
      } catch (e) {}
    }
    openInstall();
  }

  shareBtn.addEventListener('click', shareGame);
  installBtn.addEventListener('click', installTap);
  $('#instOk').addEventListener('click', function () { closeInstall(true); });
  $('#instX').addEventListener('click', function () { closeInstall(true); });
  instWrap.addEventListener('click', function (e) { if (e.target === instWrap) closeInstall(true); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeInstall(true); });
  window.addEventListener('appinstalled', function () {
    instDone = true; instPrompt = null; syncInstallBtn(); toast('홈 화면에 넣었어요!');
  });
  window.addEventListener('beforeinstallprompt', function (e) {
    try { e.preventDefault(); } catch (err) {}
    instPrompt = e;
  });
  syncInstallBtn();

  /* ═════════ 다른 게임·와글링 홈으로 (v3) ═════════ */
  var golfLink = $('#golfLink'), golfReady = false;
  golfLink.addEventListener('click', function (e) {
    if (golfReady) return;                 /* 배포되면 그대로 열립니다 */
    e.preventDefault();
    toast('🚧 곧 열려요! 준비 중입니다');
  });
  function probeGolf() {
    if (!window.fetch) return;
    try {
      fetch('../golf-game/', { method: 'HEAD', cache: 'no-store', credentials: 'omit' })
        .then(function (r) {
          if (r && r.ok) {
            golfReady = true;
            golfLink.setAttribute('data-state', 'ok');
            golfLink.setAttribute('aria-label', '공벌레 골프 놀러 가기');
          }
        })
        .catch(function () {});
    } catch (e) {}
  }

  /* 폰 뒤로가기: 안내 팝업 → 축하 화면 순서로 닫기 */
  window.addEventListener('popstate', function () {
    if (!instWrap.hidden) { instWrap.hidden = true; instPushed = false; return; }
    if (!overlay.hidden) { hideOverlay(); overlayPushed = false; }
  });

  /* 그림 넣기 */
  $('#headBadge').innerHTML = hamsterSVG(false);
  $('#mascotFace').innerHTML = hamsterSVG(false);

  /* 시작 */
  loadWxCache();
  loadWeather();
  startLevel(level, true);
  setInterval(renderToday, 60 * 1000);
  probeGolf();

  /* 홈 화면 설치를 위해 앱 껍데기만 캐시하는 가벼운 서비스 워커 (실패해도 게임은 그대로) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
    });
  }

  /* 테스트·디버그용 (읽기 전용 정보) */
  window.__bulb = {
    state: function () {
      var p = poweredSet();
      return {
        n: N, level: level, moves: moves, cleared: cleared, lit: litCount(), total: bulbTotal(),
        taps: tapsNeeded(), hints: hintsUsed, best: best[level] || null,
        cells: cells.map(function (c, k) {
          return c ? { k: k, kind: c.kind, base: c.base, rot: c.rot, mask: cellMask(c), pw: !!p[k] } : null;
        })
      };
    },
    reset: resetLevel,
    hint: useHint
  };
})();
</script>
</body>
</html>
